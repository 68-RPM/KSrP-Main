// <| Bobcat Engine |>
// The additional nozzle for this engine is inspired by Engine Tweaks for Making History

@PART[LiquidEngineLV-TX87]:NEEDS[B9PartSwitch]:FOR[zzzReProgram] {
	@description ^= :$: <br><color="KSPYellowishGreen">This engine has multiple performance options.</color>
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = engineNozzleVariant
		switcherDescription = Nozzle Variant
		switcherDescriptionPlural = Nozzle Variants
		SUBTYPE {
			name = bob1
			title = Bobcat I
			primaryColor = KSPMellowYellow
			secondaryColor = AlmostBlack
			descriptionSummary = All Jebediah's Junkyard's craftsmanship is of the highest quality…which is a key selling point, considering what we're working with here.
			descriptionDetail = (The standard model of the Bobcat engine.)
			defaultSubtypePriority = 1
		}
		SUBTYPE {
			name = bob2
			title = Bobcat II
			primaryColor = KSPNotSoGoodOrange
			secondaryColor = Ivory
			descriptionSummary = We've paid extra attention to the quality of the machining on this one, and did a few extra static fires just to be sure it works. As a bonus, we gave it some reinforcing and tuning!
			descriptionDetail = (Increased thrust, mass, and cost.)
			defaultSubtypePriority = 0
			addedMass = 0.5
			addedCost = 120
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					maxThrust = 570
					}	
				}
			}
		}
		MODULE {
		name = ModuleB9PartSwitch
		moduleID = engineFuelVariant
		switcherDescription = Fuel Variant
		switcherDescriptionPlural = Fuel Variants
		SUBTYPE {
			name = StdBob
			title = Kerosene
			primaryColor = KSPBadassGreen
			secondaryColor = KSPNeutralUIGrey
			descriptionSummary = Basic Liquid Fuel + Oxidizer
			descriptionDetail = Kerosene, Liquid Oxygen
			defaultSubtypePriority = 1
		}
		SUBTYPE {
			name = HypBob
			title = Aerozine
			primaryColor = KSPMETitle
			secondaryColor = KSPNeutralUIGrey
			descriptionSummary = Hypergolic Liquid Fuel + Oxidizer
			descriptionDetail = Aerozine, Nitrogen Tetroxide
			defaultSubtypePriority = 0
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					PROPELLANT {
						name = HyperFuel
						ratio = 0.9
						DrawGauge = True
					}
					PROPELLANT {
						name = HyperDizer
						ratio = 1.1
					}	
				}
			}
		}
	}
}
Localization {
	en-us {
		#LOC_RPtitle_BlackHole = Dizero
		#LOC_RPblurb_BlackHole = This object is what is known as a black hole. Infamous for eating stars, space-time, and calculators, black holes have a very special property: They are so massive and so dense that, within a sufficient proximity, their escape velocity exceeds c; a speed nothing can achieve (let alone surpass).\n\nDespite being so imposing, black holes are as safe to orbit as any other object, provided you keep your distance from their common accessories… and much like a star, under no circumstances should Kerbals <i>ever</i> try to land here.
		#LOC_RPtitle_Wormhole1 = 1WM/Kipper A
		#LOC_RPtitle_Wormhole2 = 1WM/Kipper B
		#LOC_RPblurb_Wormhole = A wormhole is a distortion of space-time akin to a ‘tube’ of vacuum; touching the apparent horizon of either end means falling through, carried by momentum all the way to the other side. The existence of these wormholes is of particular interest to Kerbal scientists, because the negative energy required to keep them from being pinched into black holes breaks the rules of their best models of the universe. By any account, they are most certainly not natural phenomena.\n\nTraversing a wormhole is generally considered an appealing alternative to designing a spacecraft to travel gulfs which even light and gravity take considerable time to cross. To safely do this without being shredded by its tides, a vesselʼs periapsis must be carefully lowered, much like entering atmosphere (read: donʼt dive straight down). A window between <color=#acfffc>30,000 and 10,000 meters</color> is the sweet spot to pull this off.\n\nThe ends of a wormhole would self-destruct if they were brought to a physical distance shorter than their distance in time, preventing time travel (synonymous with ‘impossible’). This is purely theory, however, as Kerbals are nowhere near close to producing the inventions that would be required to put this to experiment.
		#LOC_KSRP_WormholeEnter = Entering wormhole… (Controls locked. Brace for tidal forces!)
		#LOC_KSRP_WormholeExit = Exiting wormhole… (Space-time has returned to normal.)
	}
}
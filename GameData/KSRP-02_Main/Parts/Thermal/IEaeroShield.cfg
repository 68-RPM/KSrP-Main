PART
{
	// --- general parameters ---
	name = reprogram-ie-AeroShield
	module = Part
	author = DennyTX
	MODEL {
		model = KSRP-02_Main/Assets/Thermal/NASAaeroShield
		scale = 1,1,1
		rotation = 0,180,0
		position = 0.0, 0.0, 0.0
	}

	// --- asset parameters ---
	rescaleFactor = 0.103

	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z

	node_stack_top    = 0.0,  9.78,  0.0, 0.0,  1.0, 0.0, 1
	node_stack_bottom = 0.0, -11,   0.0, 0.0, -1.0, 0.0, 1

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,0,1,1,1

	// --- editor parameters ---
	TechRequired = metaMaterials
	entryCost = 5000
	cost = 5000
	category = Thermal
	subcategory = 0
	title = Deployable Heat Shield
	manufacturer = #LOC_RPtitle_FLOOYD
	description = A deployable graphene heat shield. It greatly affects drag when open and is well-suited for any pods re-entering atmosphere.

	// --- standard part parameters ---
	mass = 0.5
	dragModelType = default
	maximum_drag = 1
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 9
	breakingForce = 99
	breakingTorque = 99

	maxTemp = 4500
	emissiveConstant = 0.98
	heatConductivity = 0.0001

	fuelCrossFeed = False

	tags = kspie deployable graphene aero heatshield high temperature

	MODULE {
		name = DMModuleScienceAnimateGeneric
		animationName = AeroShieldOpen
		animSpeed = 2 //0.5
		isOneShot = false
		startEventGUIName = #autoLOC_502007 //#autoLOC_502007 = Inflate Heat Shield
		endEventGUIName = #autoLOC_502008 //#autoLOC_502008 = Deflate Heat Shield
		actionGUIName = #autoLOC_502007 //#autoLOC_502007 = Inflate Heat Shield
		allowAnimationWhileShielded = False
		disableAfterPlaying = false
	}
}

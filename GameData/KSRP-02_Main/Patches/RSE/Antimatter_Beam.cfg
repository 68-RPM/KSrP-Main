@PART[*]:HAS[@RSE_PRESET[Antimatter_Beam]]:AFTER[zRocketSoundEnhancementDefault]:NEEDS[RocketSoundEnhancementDefault] {
	@EFFECTS{@engage{!AUDIO{}}}
	@EFFECTS{@flameout{!AUDIO{}}}
	@EFFECTS{@fx-am-beam-running{!AUDIO{}}}
	MODULE {
		name = RSE_Engines
		volume = #$/RSE_PRESET[Antimatter_Beam]/volume$
		AIRSIMULATION {
			AngleHighpass = 100
			MaxCombMix = 0.15
		}
		SOUNDLAYERGROUP {
			name = #$/RSE_PRESET[Antimatter_Beam]/engineID$
			SOUNDLAYER {
				name = ThrustWeak
				audioClip = RocketSoundEnhancementDefault/Sounds/SRB_Light-Low
				loop = true
				spread = 0.4
				volume = 0.0 1.0
				volume = 0.33 0.5
				volume = 0.66 0.1
				volume = 1.0 0.0
				pitch = #$/RSE_PRESET[Antimatter_Beam]/pitch$
				@pitch *= 0.9
			}
			SOUNDLAYER {
				name = ThrustStrong
				audioClip = KSRP-02_Main/Sounds/SeeteeBeam
				loop = true
				spread = 0.4
				volume = 0.0 0.0
				volume = 0.33 0.1
				volume = 0.66 1.0
				volume = 1.0 1.0
				pitch = #$/RSE_PRESET[Antimatter_Beam]/pitch$
			}
		}
		Engage {
			SOUNDLAYER {
				name = Engage
				audioClip = KSRP-02_Main/Sounds/IEEngage
				channel = ShipBoth
				volume = #$/RSE_PRESET[Antimatter_Beam]/volume$
				pitch = #$/RSE_PRESET[Antimatter_Beam]/pitch$
			}
		}
		Disengage {
			SOUNDLAYER {
				name = Disengage
				audioClip = KSRP-02_Main/Sounds/IEDisengage
				channel = ShipBoth
				volume = #$/RSE_PRESET[Antimatter_Beam]/volume$
				pitch = #$/RSE_PRESET[Antimatter_Beam]/pitch$
			}
		}
		Flameout {
			SOUNDLAYER {
				name = FlameOut
				audioClip = KSRP-02_Main/Sounds/IEFlameout
				channel = ShipBoth
				volume = #$/RSE_PRESET[Antimatter_Beam]/volume$
				pitch = #$/RSE_PRESET[Antimatter_Beam]/pitch$
			}
		}
	}
	@RSE_PRESET[Antimatter_Beam] {
		|_ = RSE_PRESET-Processed
	}
	MM_PATCH_LOOP {}
	}
}
@PART[fft-nswr-1]:NEEDS[RocketSoundEnhancementDefault] {
	RSE_PRESET {
		name = Liquid_Heavy-Sustainer
		volume = 1.24
		pitch = 1.05
	}
}
@PART[fft-nswr-2]:NEEDS[RocketSoundEnhancementDefault] {
	RSE_PRESET {
		name = Liquid_Heavy-Lifter
		volume = 1.89
		pitch = 1.05
	}
}

@PART[fft-antimatter-beam-1]:NEEDS[RocketSoundEnhancementDefault] {
	RSE_PRESET {
		name = Antimatter_Beam
		volume = 1.0
		pitch = 1.0
	}
}

@PART[fft-ffre-*]:FOR[zzz_ReProgram]:NEEDS[RocketSoundEnhancement] {
	@EFFECTS {
		@engage {
			@AUDIO {
				|_ = RSE_AUDIO
				name = engage
				EnableLowpassFilter = True
			}
		}
		@flameout {
			@AUDIO {
				|_ = RSE_AUDIO
				name = flameout
				EnableLowpassFilter = True
			}
		}
		@fx-ffre-core {
			@AUDIO {
				|_ = RSE_AUDIO
				name = fx-ffre-core
				EnableLowpassFilter = True
			}
		}
		@fx-ffre-ab {
			@AUDIO {
				|_ = RSE_AUDIO
				name = fx-ffre-ab
				EnableLowpassFilter = True
			}
		}
	}
}


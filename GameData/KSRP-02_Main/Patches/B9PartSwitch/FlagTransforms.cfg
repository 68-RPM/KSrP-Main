@PART[*]:HAS[~name[flag],~name[kerbalEVA*],@MODULE[FlagDecal]]:FOR[zzz_ReProgram] {
	MODULE {
		name = ModuleB9DisableTransform
		transform = #$/MODULE[FlagDecal]/textureQuadName$
	}
	!MODULE[FlagDecal] {}
}

@PART[kerbalEVA*]:FOR[zzz_ReProgram] {
	MODULE {
		name = ModuleB9DisableTransform
		transform = kbEVA_flagDecals
	}
}
@PART[restock-engine-125-pug]:FOR[zzz_ReProgram] {
	%LF = #$RESOURCE[LiquidFuel]/maxAmount$
	%OX = #$RESOURCE[Oxidizer]/maxAmount$
	%totalCap = #$RESOURCE[LiquidFuel]/maxAmount$
	@totalCap += #$RESOURCE[Oxidizer]/maxAmount$
	%massOffset = #$totalCap$
	@massOffset *= 0.000625
	@massOffset *= -1
	@LF *= #$@RESOURCE_DEFINITION[LiquidFuel]/unitCost$
	@OX *= #$@RESOURCE_DEFINITION[Oxidizer]/unitCost$
	%costOffset = #$LF$
	@costOffset += #$OX$
	@costOffset *= -1
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Oxidizer] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = feedSwitch
		baseVolume = #$../totalCap$
		SUBTYPE {
			name = Kerolox
			descriptionSummary = #LOC_RPshort_KeroseneEngine
			descriptionDetail = #LOC_RPblurb_JebsKerosene
			tankType = LFOX
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = Hypergolic
			descriptionSummary = #LOC_RPshort_AerozineEngine
			descriptionDetail = #LOC_RPblurb_JebsAerozine
			tankType = Hypergolic
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					PROPELLANT {
						name = Aerozine50
						ratio = 0.9
						DrawGauge = True
					}
					PROPELLANT {
						name = NTO
						ratio = 1.1
					}
				}
			}
		}
	}
}


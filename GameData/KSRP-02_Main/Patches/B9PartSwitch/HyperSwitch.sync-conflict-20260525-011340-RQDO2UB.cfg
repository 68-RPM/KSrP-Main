@PART[LiquidEngineLV-TX87|LiquidEngineLV-T91]:FOR[zzz_ReProgram] {
	@MODULE[ModuleEnginesFX] {
		@PROPELLANT[Kerosene] {
			@name = Aerozine50
		}
		@PROPELLANT[LqdOxygen] {
			@name = NTO
		}
	}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = feedSwitch
		affectDragCubes = False
		affectFARVoxels = False
		SUBTYPE {
			name = Hypergolic
			descriptionSummary = #LOC_RPshort_AerozineEngine
			descriptionDetail = #LOC_RPblurb_JebsAerozine
		}
		SUBTYPE {
			name = Kerolox
			descriptionSummary = #LOC_RPshort_KeroseneEngine
			descriptionDetail = #LOC_RPblurb_JebsKerosene
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					PROPELLANT {
						name = Kerosene
						ratio = 0.9
						DrawGauge = True
					}
					PROPELLANT {
						name = LqdOxygen
						ratio = 1.1
					}
				}
			}
		}
	}
}


@B9_TANK_TYPE[LF]:FOR[zzz_ReProgram] {
	%primaryColor = ResourceColorLiquidFuel
	@RESOURCE[LiquidFuel] {
		@name = Kerosene
		@unitsPerVolume *= 5.0173097
	}
}

@B9_TANK_TYPE[OX]:FOR[zzz_ReProgram] {
	%primaryColor = ResourceColorOxidizer
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@unitsPerVolume *= 5.0173097
	}
}

@B9_TANK_TYPE[LFOX]:FOR[zzz_ReProgram] {
	%primaryColor = ResourceColorLiquidFuel
	%secondaryColor = ResourceColorOxidizer
	@RESOURCE[LiquidFuel] {
		@name = Kerosene
		@unitsPerVolume *= 5.0173097
	}
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@unitsPerVolume *= 5.0173097
	}
}

@B9_TANK_TYPE[LH2O,LH2OCryo]:FOR[zzz_ReProgram] {
	%primaryColor = ResourceColorLqdHydrogen
	%secondaryColor = ResourceColorOxidizer
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@unitsPerVolume *= 4.3821209
	}
}

@B9_TANK_TYPE[LMOx]:FOR[zzz_ReProgram] {
	%primaryColor = ResourceColorLqdMethane
	%secondaryColor = ResourceColorOxidizer
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@unitsPerVolume *= 4.3821209
	}
}


@PART[liquidEngine_v2]:FOR[zzz_ReProgram] {
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = perfSwitch
		affectDragCubes = False
		affectFARVoxels = False
		SUBTYPE {
			name = ReliantStock
			title = #LOC_RPtitle_ReliantBase
			descriptionSummary = #LOC_RPshort_EngineBase
			descriptionDetail = #LOC_RPblurb_JebsEngineBase
			primaryColor = KSPMellowYellow
			secondaryColor = AlmostBlack
		}
		SUBTYPE {
			name = ReliantEOE
			title = #LOC_RPtitle_ReliantEve
			descriptionSummary = #LOC_RPshort_EveOptimized
			descriptionDetail = #LOC_RPblurb_EveOptimized
			primaryColor = LightEggplant
			secondaryColor = LeafGreen
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					maxThrust = 205.1612903
					atmosphereCurve {
						key = 0 265
						key = 1 254
						key = 5 214
						key = 10 163
						key = 26 0.001
					}
				}
			}
		}
	}
}


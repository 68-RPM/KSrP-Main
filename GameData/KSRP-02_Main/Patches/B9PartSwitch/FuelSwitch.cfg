@PART[*]:HAS[~name[service-tank-*],@RESOURCE[MonoPropellant],!RESOURCE[LiquidFuel],!RESOURCE[Oxidizer],!MODULE[ModuleCommand],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines],!MODULE[ModuleRCS],!MODULE[ModuleRCSFX]]:FOR[zzz_ReProgram] {
	%MPROP = #$RESOURCE[MonoPropellant]/maxAmount$

	%massOffset = #$MPROP$
	@massOffset *= 0.000625
	@massOffset *= -1

	%costOffset = #$MPROP$
	@costOffset *= #$@RESOURCE_DEFINITION[MonoPropellant]/unitCost$
	@costOffset *= -1

	!RESOURCE[MonoPropellant] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = monoSwitch
		baseVolume = #$../MPROP$
		switcherDescription = #LOC_RPswitcher_Fuel
		SUBTYPE {
			name = MonoProp
			title = #LOC_RPtitle_MonoPropTank
			descriptionDetail = #LOC_RPblurb_MonoPropTank
			tankType = MonoProp
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = Hypergols
			title = #LOC_RPtitle_AerozineTank
			descriptionDetail = #LOC_RPblurb_AerozineTank
			tankType = Hypergolic
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
	}
}

@PART[*]:HAS[@RESOURCE[MonoPropellant],@MODULE[ModuleCommand],@MODULE[ModuleRCSFX],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines]]:FOR[zzz_ReProgram] {
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		@amount *= 3.9840637
		@maxAmount *= 3.9840637
	}
}

@PART[*]:HAS[@RESOURCE[MonoPropellant],@MODULE[ModuleCommand],@MODULE[ModuleRCS],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines]]:FOR[zzz_ReProgram] {
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		@amount *= 3.9840637
		@maxAmount *= 3.9840637
	}
}

@PART[*]:HAS[@RESOURCE[MonoPropellant],!MODULE[InterstellarFuelSwitch],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines],!MODULE[ModuleRCSFX],!MODULE[ModuleRCS]]:FOR[zzz_ReProgram] {
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		@amount *= 3.9840637
		@maxAmount *= 3.9840637
	}
}

@PART[*]:HAS[~name[bluedog_*],@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch],!SUBTYPE[LF/O],@SUBTYPE[LH2/O]] {
		%switcherDescription = #LOC_RPswitcher_Fuel
		SUBTYPE,3 {
			name = LF/O
			tankType = LFOX
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		@SUBTYPE[LH2/O] {
			%defaultSubtypePriority = 1
		}
	}
}

@PART[*]:HAS[~name[bluedog*],@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch],@SUBTYPE[LF/O],@SUBTYPE[LH2/O]] {
		%switcherDescription = #LOC_RPswitcher_Fuel
		SUBTYPE {
			name = MonoProp
			tankType = MonoProp
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = Hypergols
			tankType = Hypergolic
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch],@SUBTYPE[LH2/O]] {
		%switcherDescription = #LOC_RPswitcher_Fuel
		@SUBTYPE[LF/O] {
			%title = #LOC_RPtitle_KeroloxTank
			%descriptionSummary = #LOC_RPshort_KeroloxTank
			%descriptionDetail = #LOC_RPblurb_KeroloxTank
		}
		@SUBTYPE[LH2/O] {
			%title = #LOC_RPtitle_HydroloxTank
			%descriptionSummary = #LOC_RPshort_CryoTank
			%descriptionDetail = #LOC_RPblurb_HydroloxTank
		}
		@SUBTYPE[LH2] {
			%title = #LOC_RPtitle_HydrogenTank
			%descriptionSummary = #LOC_RPshort_CryoTank
			%descriptionDetail = #LOC_RPblurb_HydrogenTank
		}
		@SUBTYPE[LCH4/O] {
			%title = #LOC_RPtitle_MethaloxTank
			%descriptionSummary = #LOC_RPshort_CryoTank
			%descriptionDetail = #LOC_RPblurb_MethaloxTank
		}
		@SUBTYPE[Methalox] {
			%title = #LOC_RPtitle_MethaloxTank
			%descriptionSummary = #LOC_RPshort_CryoTank
			%descriptionDetail = #LOC_RPblurb_MethaloxTank
		}
		@SUBTYPE[MonoProp] {
			%title = #LOC_RPtitle_MonoPropTank
			%descriptionDetail = #LOC_RPblurb_MonoPropTank
		}
		@SUBTYPE[MonoPropellant] {
			%title = #LOC_RPtitle_MonoPropTank
			%descriptionSummary = #LOC_RPshort_MonoPropTank
			%descriptionDetail = #LOC_RPblurb_MonoPropTank
		}
		@SUBTYPE[Monopropellant] {
			%title = #LOC_RPtitle_MonoPropTank
			%descriptionSummary = #LOC_RPshort_MonoPropTank
			%descriptionDetail = #LOC_RPblurb_MonoPropTank
		}
		@SUBTYPE[Hypergols] {
			%title = #LOC_RPtitle_AerozineTank
			%descriptionSummary = #LOC_RPshort_AerozineTank
			%descriptionDetail = #LOC_RPblurb_AerozineTank
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]] {
		%switcherDescription = #LOC_RPswitcher_Fuel
		!SUBTYPE[Methane] {}
		!SUBTYPE[Oxidizer] {}
		!SUBTYPE[LiquidFuel] {}
	}
}
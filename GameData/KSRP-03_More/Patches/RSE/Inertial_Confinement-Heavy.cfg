@PART[*]:HAS[@RSE_PRESET[Inertial_Confinement-Heavy]]:AFTER[zRocketSoundEnhancementDefault]:NEEDS[RocketSoundEnhancement] {
	@EFFECTS{@engage{!AUDIO{}}}
	@EFFECTS{@flameout{!AUDIO{}}}
	@EFFECTS{@running_closed{!AUDIO{}}}
	MODULE {
		name = RSE_Engines
		volume = #$/RSE_PRESET[Inertial_Confinement-Heavy]/volume$
		AIRSIMULATION {
			AngleHighpass = 100
			MaxCombMix = 0.15
		}
		SOUNDLAYERGROUP {
			name = #$/RSE_PRESET[Inertial_Confinement-Heavy]/engineID$
			SOUNDLAYER {
				name = Thrust
				audioClip = KSRP-03_More/Sounds/Daedalus
				loop = true
				spread = 0.5
				volume = 0 0
				volume = 1.0 1.0
				pitch = #$/RSE_PRESET[Inertial_Confinement-Heavy]/pitch$
			}
		}
		Engage {
			SOUNDLAYER {
				name = Engage
				audioClip = KSRP-02_Main/Sounds/IEEngage
				channel = ShipBoth
				volume = #$/RSE_PRESET[Inertial_Confinement-Heavy]/volume$
				pitch = #$/RSE_PRESET[Inertial_Confinement-Heavy]/pitch$
			}
		}
		Disengage {
			SOUNDLAYER {
				name = Disengage
				audioClip = KSRP-02_Main/Sounds/IEDisengage
				channel = ShipBoth
				volume = #$/RSE_PRESET[Inertial_Confinement-Heavy]/volume$
				pitch = #$/RSE_PRESET[Inertial_Confinement-Heavy]/pitch$
			}
		}
		Flameout {
			SOUNDLAYER {
				name = FlameOut
				audioClip = KSRP-02_Main/Sounds/IEFlameout
				channel = ShipBoth
				volume = #$/RSE_PRESET[Inertial_Confinement-Heavy]/volume$
				pitch = #$/RSE_PRESET[Inertial_Confinement-Heavy]/pitch$
			}
		}
	}
	@RSE_PRESET[Inertial_Confinement-Heavy] {
		|_ = RSE_PRESET-Processed
	}
	MM_PATCH_LOOP {}
	}
}
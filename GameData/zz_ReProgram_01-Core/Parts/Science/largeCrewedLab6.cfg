+PART[Large_Crewed_Lab]:BEFORE[zzz_ReProgram] {
	@name = Large_crewed_Lab_6
	@title = #LOC_RPtitle_Large_crewed_Lab_6
	@CrewCapacity = 6
	@cost = 12000
	@MODULE[ModuleInventoryPart] {
		@InventorySlots = 6
	}
	@INTERNAL {
		@name = Mobile_Processing_Lab_Int_6
	}
}

+INTERNAL[Mobile_Processing_Lab_Int]:BEFORE[zzz_ReProgram] {
	@name = Mobile_Processing_Lab_Int_6
	MODULE {
		name = InternalSeat
		seatTransformName = Seat_UpLeft
		portraitCameraName = Camera_UpLeft
		allowCrewHelmet = false
	}
	MODULE {
		name = InternalSeat
		seatTransformName = Seat_UpRight
		portraitCameraName = Camera_UpRight
		allowCrewHelmet = false
	}
	MODULE {
		name = InternalSeat
		seatTransformName = Seat_BackLeft
		portraitCameraName = Camera_BackLeft
		allowCrewHelmet = false
	}
	MODULE {
		name = InternalSeat
		seatTransformName = Seat_BackRight
		portraitCameraName = Camera_BackRight
		allowCrewHelmet = false
	}
}
@PART[*]:HAS[@RESOURCE[MonoPropellant],!MODULE[InterstellarFuelSwitch],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines],!MODULE[FSfuelSwitch],!MODULE[WBIConvertibleStorage],!MODULE[WBIResourceSwitcher],!MODULE[WBIOmniStorage]]:NEEDS[!ModularFuelTanks&!RealFuels]:FOR[zzz_ReProgram] {
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		@amount *= 3.9840637
		@maxAmount *= 3.9840637
	}
}

@PART[*]:HAS[~name[bluedog_*],@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch],!SUBTYPE[LF/O],@SUBTYPE[LH2/O]] {
		SUBTYPE,0 {
			name = LF/O
			title = #LOC_RPtitle_KeroloxTank
			descriptionDetail = #LOC_RPblurb_KeroloxTank
			tankType = LFOX
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		@SUBTYPE[LH2/O] {
			%defaultSubtypePriority = 1
		}
	}
}

@PART[*]:HAS[~name[bluedog*],@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch],@SUBTYPE[LH2/O]] {
		SUBTYPE {
			name = MonoProp
			title = #LOC_RPtitle_MonopropTank
			tankType = MonoProp
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = Hypergols
			title = #LOC_RPtitle_AerozineTank
			descriptionDetail = #LOC_RPblurb_AerozineTank
			tankType = Hypergolic
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch],@SUBTYPE[LH2/O]] {
		@SUBTYPE[LF/O] {
			%title = #LOC_RPtitle_KeroloxTank
			%descriptionDetail = #LOC_RPblurb_KeroloxTank
		}
		@SUBTYPE[LH2/O] {
			%title = #LOC_RPtitle_HydroloxTank
			%descriptionDetail = #LOC_RPblurb_HydroloxTank
		}
		@SUBTYPE[LCH4/O] {
			%title = #LOC_RPtitle_MethaloxTank
			%descriptionDetail = #LOC_RPblurb_MethaloxTank
		}
		@SUBTYPE[MonoProp] {
			%title = #LOC_RPtitle_MonopropTank
			%descriptionDetail = #LOC_RPblurb_MonopropTank
		}
		@SUBTYPE[MonoPropellant] {
			%title = #LOC_RPtitle_MonopropTank
			%descriptionDetail = #LOC_RPblurb_MonopropTank
		}
		@SUBTYPE[Monopropellant] {
			%title = #LOC_RPtitle_MonopropTank
			%descriptionDetail = #LOC_RPblurb_MonopropTank
		}
		@SUBTYPE[Hypergols] {
			%title = #LOC_RPtitle_AerozineTank
			%descriptionDetail = #LOC_RPblurb_AerozineTank
		}
	}
}
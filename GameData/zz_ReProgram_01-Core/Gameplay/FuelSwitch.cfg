@PART[miniFuselage|MK1Fuselage|noseConeAdapter|mk2Fuselage|mk2FuselageShortLiquid|mk3FuselageLF_*|nacelleBody|radialEngineBody|MK1IntakeFuselage|wingShuttleDelta|wingShuttleStrake|airlinerMainWing]:FOR[zzz_ReProgram] {
	@RESOURCE[LiquidFuel] {
		@name = Kerosene
		@amount *= 5.0173097
		@maxAmount *= 5.0173097
	}
}


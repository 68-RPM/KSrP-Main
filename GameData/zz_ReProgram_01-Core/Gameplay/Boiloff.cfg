@PART[*]:HAS[@MODULE[ModuleCryoTank]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks,!SystemHeatBoiloff] {
	@MODULE[ModuleCryoTank] {
		+BOILOFFCONFIG:HAS[#FuelName[LqdMethane]] {
			@FuelName = LqdOxygen
		}
	}
}

@PART[Size2LFB_v2]:FOR[zzz_ReProgram]:NEEDS[CryoTanks] {
	MODULE {
		name = ModuleCryoTank
		CoolingEnabled = False
	BOILOFFCONFIG {
			FuelName = LqdOxygen
			BoiloffRate = 0.005
			CoolingCost = 0.045
		}
	}
}

@PART[restock-engine-125-pug]:FOR[zzz_ReProgram]:NEEDS[ReStockPlus,CryoTanks] {
	MODULE {
		name = ModuleCryoTank
		CoolingEnabled = False
	BOILOFFCONFIG {
			FuelName = LqdOxygen
			BoiloffRate = 0.005
			CoolingCost = 0.045
		}
	}
}
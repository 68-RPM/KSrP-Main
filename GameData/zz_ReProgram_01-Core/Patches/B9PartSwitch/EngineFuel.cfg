@PART[*]:HAS[@MODULE[ModuleEngines]:HAS[@PROPELLANT[LiquidFuel]]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks] {
	@MODULE[ModuleEngines] {
		@PROPELLANT[LiquidFuel] {
			@name = Kerosene
		}
		@PROPELLANT[Oxidizer] {
			@name = LqdOxygen
		}
	}
}


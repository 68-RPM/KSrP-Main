@PART[engineLargeSkipper_v2]:FOR[zzz_ReProgram]:NEEDS[ReStock,CryoEngines] {
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		affectDragCubes = False
		affectFARVoxels = False
		SUBTYPE {
			name = Kerolox
			descriptionSummary = #LOC_RPshort_MassThrustDown
			descriptionDetail = #LOC_RPblurb_Kerosene
		}
		SUBTYPE {
			name = Hydrolox
			descriptionSummary = #LOC_RPshort_MassThrustUp
			descriptionDetail = #LOC_RPblurb_Hydrogen
			addedMass = 0.85
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					maxThrust = 850
					PROPELLANT {
						name = LqdHydrogen
						ratio = 1.5
						DrawGauge = True
					}
					PROPELLANT {
						name = Oxidizer
						ratio = 0.1
					}
					atmosphereCurve {
						key = 0 430 0 0
						key = 1 372 0 0
						key = 4 285 0 0
					}
				}
			}
		}
	}
}


@B9_TANK_TYPE[B9_HX_LFO] {
	%primaryColor = ResourceColorLiquidFuel
	%secondaryColor = ResourceColorOxidizer
	@RESOURCE[LiquidFuel] {
		@name = Kerosene
		@unitsPerVolume *= 5.0173097
	}
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@unitsPerVolume *= 5.0173097
	}
}

@B9_TANK_TYPE[B9_HX_MonoPropellant]:FOR[zzz_ReProgram] {
	%primaryColor = ResourceColorMonoPropellant
	//@tankMass = 0.00002295 //0.000225(0.00006375/0.000625)
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		//@unitsPerVolume = 0.25
		@unitsPerVolume *= 3.9840637
	}
}
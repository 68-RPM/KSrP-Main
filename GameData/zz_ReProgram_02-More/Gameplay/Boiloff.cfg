@PART[*]:HAS[@Resource[Oxidizer],!MODULE[ModuleCryoTank],!MODULE[InterstellarFuelSwitch],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines],!MODULE[FSfuelSwitch],!MODULE[WBIConvertibleStorage],!MODULE[WBIResourceSwitcher]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks,!Bluedog_DB] {
	MODULE {
		name = ModuleCryoTank
		coolingEnabled = false
		BOILOFFCONFIG {
			FuelName = Oxidizer
			BoiloffRate = 0.02
			CoolingCost = 0.01
		}
	}
}
@PART[*]:HAS[@MODULE[ModuleCryoTank]]:AFTER[zzz_ReProgram]:NEEDS[CryoTanks,!Bluedog_DB] {
	@MODULE[ModuleCryoTank] {
		%BOILOFFCONFIG {
			%FuelName = Oxidizer
			%BoiloffRate = 0.02
			%CoolingCost = 0.01
		}
	}
}
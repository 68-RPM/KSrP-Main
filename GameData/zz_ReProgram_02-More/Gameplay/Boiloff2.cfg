@PART[*]:HAS[@MODULE[ModuleSystemHeatCryoTank]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks,SystemHeatBoiloff] {
	@MODULE[ModuleSystemHeatCryoTank] {
		+BOILOFFCONFIG:HAS[#FuelName[LqdMethane]] {
			@FuelName = LqdOxygen
		}
	}
}

@PART[Size2LFB_v2]:AFTER[zzz_ReProgram]:NEEDS[CryoTanks,SystemHeatBoiloff] {
	@MODULE[ModuleCryoTank] {
		@name = ModuleSystemHeatCryoTank
		systemHeatModuleID = tank
		@BOILOFFCONFIG:HAS[#CoolingCost] {
			CoolingHeatCost = #$CoolingCost$
			@CoolingHeatCost *= 10
			@CoolingHeatCost /= 3
		}
		@BOILOFFCONFIG:HAS[#FuelName[LqdOxygen]] {
			CryocoolerTemperature = 400
		}
	}
}

@PART[restock-engine-125-pug]:AFTER[zzz_ReProgram]:NEEDS[ReStockPlus,CryoTanks,SystemHeatBoiloff] {
	@MODULE[ModuleCryoTank] {
		@name = ModuleSystemHeatCryoTank
		systemHeatModuleID = tank
		@BOILOFFCONFIG:HAS[#CoolingCost] {
			CoolingHeatCost = #$CoolingCost$
			@CoolingHeatCost *= 10
			@CoolingHeatCost /= 3
		}
		@BOILOFFCONFIG:HAS[#FuelName[LqdOxygen]] {
			CryocoolerTemperature = 400
		}
	}
}
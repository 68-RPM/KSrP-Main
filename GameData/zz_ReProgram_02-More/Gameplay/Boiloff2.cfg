@PART[*]:HAS[@MODULE[ModuleSystemHeatCryoTank],@RESOURCE[Kerosene],@RESOURCE[LqdOxygen]]:FOR[zzz_ReProgram]:NEEDS[CryoTanks,SystemHeatBoiloff] {
	@MODULE[ModuleSystemHeatCryoTank] {
		BOILOFFCONFIG {
			FuelName = LqdOxygen
			BoiloffRate = 0.005
			CoolingCost = 0.045
		}
		@BOILOFFCONFIG:HAS[#FuelName[LqdOxygen]] {
			CoolingHeatCost = #$CoolingCost$
			@CoolingHeatCost *= 10
			@CoolingHeatCost /= 3
			%CryocoolerTemperature = 400
		}
	}
}


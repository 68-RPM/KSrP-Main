// All subcategories have Priority and Category Priority
// Higher category priority goes first, then higher priority

//	cupolas		22	:	0	// Station Parts Expansion
@ORGANIZERSUBCATEGORY[cupolas]:FOR[zzz_ReProgram] {
	@Label = #LOC_RPVABo_cupolas
	@Priority = 55
}


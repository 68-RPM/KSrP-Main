@PART[proton_v2_*]:FOR[zzz_ReProgram]:NEEDS[TantaresLV] {
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[b9_fuel]] {}
}

@PART[chara_lv_engine_s0p5_2]:FOR[zzz_ReProgram]:NEEDS[TantaresLV] {
	@MODULE[ModuleRCSFX] {
		@PROPELLANT[LiquidFuel] {
			@name = Kerosene
		}
		@PROPELLANT[Oxidizer] {
			@name = LqdOxygen
		}
	}
}
@PART[miniLandingLeg]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = surfaceSwitch
		switcherDescription = #L_RPVarType_Surf
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Metal
			title = #L_RPVarSub_Metal
			primaryColor = #6f6e6d
			secondaryColor = #4f4f4f
		}
		SUBTYPE {
			name = Gold
			title = #L_RPVarSub_FoilGold
			primaryColor = #fccb0a
			secondaryColor = #c7974a
			transform = leg1_body_gold
			transform = leg1_foot_gold
			transform = leg1_hydraulic_upper_1_gold
			transform = leg1_cylinder_gold
			transform = leg1_upper_arm_gold
		}
		SUBTYPE {
			name = Silver
			title = #L_RPVarSub_FoilSilver
			primaryColor = #cecece
			secondaryColor = #b8b8b8
			transform = leg1_body_silver
			transform = leg1_foot_silver
			transform = leg1_hydraulic_upper_1_silver
			transform = leg1_cylinder_silver
			transform = leg1_upper_arm_silver
		}
	}
}


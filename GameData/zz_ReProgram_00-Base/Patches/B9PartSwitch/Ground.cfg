@PART[roverWheelM1-F]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,SquadExpansion/MakingHistory,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = meshSwitch
		switcherDescription = #L_RPVarType_Shape
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Shroud
			title = #L_RPVarMount_Shroud
			primaryColor = #aaaaaa
			secondaryColor = #c7c7c7
			transform = Fender_orange
			transform = Fender_grey
		}
		SUBTYPE {
			name = Broken
			title = #L_RPVarMount_Broken
			primaryColor = #aaaaaa
			secondaryColor = #2e2e2e
			transform = Fender_cernan
		}
		SUBTYPE {
			name = Bare
			title = #L_RPVarStruct_Bare
			primaryColor = #242424
			secondaryColor = #171717
		}
	}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = appearanceSwitch
		switcherDescription = #L_RPVarType_Color
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Red
			title = #L_RPVarSub_Red
			primaryColor = #ab4032
			secondaryColor = #723333
			transform = Fender_orange
		}
		SUBTYPE {
			name = White
			title = #L_RPVarSub_White
			primaryColor = #ffffff
			secondaryColor = #c7c7c7
			transform = Fender_grey
		}
	}
}
@PART[GooExperiment]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = mountSwitch
		switcherDescription = #L_RPVarType_Mount
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Truss
			title = #L_RPVarStruct_Truss
			primaryColor = #ffffff
			secondaryColor = #707070
			transform = Mount_Truss
		}
		SUBTYPE {
			name = Compact
			title = #L_RPVarMount_Compact
			primaryColor = #707070
			secondaryColor = #ffffff
			transform = Mount_Compact
		}
	}
}


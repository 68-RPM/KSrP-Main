@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],!TAGS[*aero*]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleReactionWheel] {
		@PitchTorque *= 0.01
		@YawTorque *= 0.01
		@RollTorque *= 0.01
	}
}

@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],#TAGS[*aero*]:HAS[#CrewCapacity[>0]]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleReactionWheel] {
		@PitchTorque *= 0.008
		@RollTorque *= 0.008
		@YawTorque *= 0.008
	}
}

@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@MODULE[ModuleCommand]:HAS[#CrewCapacity[<0]]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleReactionWheel] {
		@PitchTorque *= 5
		@RollTorque *= 5
		@YawTorque *= 5
	}
}
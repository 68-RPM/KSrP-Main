@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel],~name[nfs-panel-*]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleDeployableSolarPanel] {
		@OUTPUT_RESOURCE[ElectricCharge] {
			@rate *= 0.1
		}
	}
}

@PART[nfs-panel-*]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch] {
		@SUBTYPE[Basic] {
			@MODULE {
				@DATA {
					@chargeRate *= 0.1
				}
			}
		}
		@SUBTYPE[Advanced] {
			@MODULE {
				@DATA {
					@chargeRate *= 0.01
				}
			}
		}

		@SUBTYPE[Concentrating] {
			@MODULE {
				@DATA {
					@chargeRate *= 0.1
				}
			}
		}
	}
}
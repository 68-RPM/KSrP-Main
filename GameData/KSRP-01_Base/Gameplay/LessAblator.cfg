@PART[HeatShield*]:FOR[zzz_ReProgram] {
	%maxTemp = 2400
	%skinMaxTemp = 2800
	@RESOURCE[Ablator] {
		@Amount *= 0.375
		@maxAmount *= 0.375
	}
}

@PART[command-375-biconic-1]:FOR[zzz_ReProgram] {
	@RESOURCE[Ablator] {
		@Amount *= 0.375
		@maxAmount *= 0.375
	}
}

@B9_TANK_TYPE[Mk4CapsuleShroud|Mk4CapsuleFuelledShroud]:FOR[zzz_ReProgram] {
	@RESOURCE[Ablator] {
		name = Ablator
		@unitsPerVolume *= 0.375
	}
}

@PART[kv1Pod]:FOR[zzzReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 10
		@maxAmount = 10
	}
}
@PART[kv2Pod]:FOR[zzzReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 10.5
		@maxAmount = 10.5
	}
}
@PART[kv3Pod]:FOR[zzzReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 11
		@maxAmount = 11
	}
}
@SigmaDimensions {
	@Resize = 2.56
	@Rescale = 2.56
	@Atmosphere = 1.1
	@dayLengthMultiplier = 1.6

	@landscape = 0.76
	@geeASLmultiplier = 1

	@resizeScatter = 0
	@resizeBuildings = 0

	@CustomSoISize = 0
	@CustomRingSize = 0

	@atmoASL = 1
	@tempASL = 1
	@atmoTopLayer = 1.1
	@atmoVisualEffect = 1.1

	@scanAltitude = 1
}

@Kopernicus:BEFORE[SigDim2]:NEEDS[SigDim] {
	@Body:HAS[#Tag[BlackHole]] {
		@ScaledVersion {
			@Light {
				@luminosity *= 0.152587890625
			}
		}
		@SigmaDimensions {
			@Resize = 1
			@Rescale = 2.56
			@Atmosphere = 1
			@dayLengthMultiplier = 1.6

			@landscape = 1
			@geeASLmultiplier = 6.5536

			@resizeScatter = 0
			@resizeBuildings = 0

			@CustomSoISize = 0
			@CustomRingSize = 0

			@lightRange = 0.4

			@atmoASL = 1
			@tempASL = 1
			@atmoTopLayer = 1
			@atmoVisualEffect = 1

			@scanAltitude = 1
		}
	}
	@Body:HAS[#Tag[Wormhole]] {
		@SigmaDimensions {
			@Resize = 1
			@Rescale = 2.56
			@Atmosphere = 1
			@dayLengthMultiplier = 1

			@landscape = 1
			@geeASLmultiplier = 1

			@resizeScatter = 0
			@resizeBuildings = 0

			@CustomSoISize = 0
			@CustomRingSize = 0

			@atmoASL = 1
			@tempASL = 1
			@atmoTopLayer = 1
			@atmoVisualEffect = 1

			@scanAltitude = 1
		}
	}
	@Body:HAS[#name[Kerbin]] {
		@SigmaDimensions {
			@landscape = 0.4
		}
	}
}
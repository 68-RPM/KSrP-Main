

@PART[restock-engine-cherenkov]:NEEDS[ReStockPlus]:FOR[KSRP] {
	!EFFECTS {}
	EFFECTS
	{
		engage {
		}
		flameout {
		}
		fx-cherenkov-running {
		MODEL_MULTI_PARTICLE
		{
			name = turbo
			modelName = ReStockPlus/FX/restock-fx-cherenkov-turbo-1
			transformName = fxTransformTurbo
			emission = 0.0 0.0
			emission = 0.01 0.1
			emission = 0.075 0.25
			emission = 1.0 1.0
			speed = 0.0 0.35
			speed = 1.0 1.0
		}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		// This is a custom name
		moduleID = cherenkovFX

@PART[RAPIER]:NEEDS[Waterfall]:FOR[KSRP] {
	// Removes the stock effect block, and replace it with one that has no particles
	!EFFECTS {}
		EFFECTS {
		fx-rapier-closedcycle-running {
		}
		fx-rapier-airbreathing-power {
		}
		fx-rapier-airbreathing-spool {
			PREFAB_PARTICLE {
				prefabName = fx_smokeTrail_aeroSpike
				transformName = smokePoint
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 0.075 0.1
				emission = 1.0 0.6
				speed = 0.0 5.0
				speed = 1.0 10.0
				energy = 0.0 2.0
				energy = 1.0 4.0
				localOffset = 0, 0, 7
			}
		}
		engage {
		}
		disengage {
		}
		flameout {
			PREFAB_PARTICLE {
				prefabName = fx_exhaustSparks_flameout_2
				transformName = smokePoint
				oneShot = true
			}
		}
	}

@MODULE[ModuleEngines*],0 {
		%powerEffectName = fx-rapier-airbreathing-power
		%spoolEffectName = fx-rapier-airbreathing-spool
	}
@MODULE[ModuleEngines*],1 {
		%powerEffectName = fx-rapier-closedcycle-running
	}

	MODULE {
		name = ModuleWaterfallFX
		// This is a custom name
		moduleID = RapierAirBreathing
		// This links the effects to a given ModuleEngines


		// List out all controllers we want available
	CONTROLLER {
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER {
		name = random1
		linkedTo = random
		noiseType = perlin
		scale = 1
		minimum = 0
		speed = 10
		seed = 654
	}
	CONTROLLER {
		name = mach
		linkedTo = mach
	}
	CONTROLLER {
		name = throttle
		linkedTo = throttle
		engineID = AirBreathing
		responseRateUp = 10
		responseRateDown = 10
	}
	TEMPLATE {
			templateName = stock-rapier-core
		position = 0,0,-0.21
		rotation = 0, 0, 0
		scale = 0.9, 0.9, 0.9
		}
	TEMPLATE {
			templateName = stock-methane-jet-2
			position = 0,0,-0.1
			rotation = 0, 0, 0
			scale = 1.0, 1.0, 1.0
		}
	}

MODULE {
		name = ModuleWaterfallFX
		// This is a custom name
		moduleID = RapierClosedCycle
		// This links the effects to a given ModuleEngines


		// List out all controllers we want available
		CONTROLLER {
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER {
			name = throttle
		linkedTo = throttle
		engineID = ClosedCycle
		responseRateUp = 0.03
			responseRateDown = 0.2
		}
	CONTROLLER {
		name = random1
		linkedTo = random
		noiseType = perlin
		scale = 1
		minimum = 0
		speed = 9
		seed = 0
	}
	CONTROLLER {
		name = Ignition
		linkedTo = engineEvent
		eventDuration = 2
		eventName = ignition
		eventCurve {
			key = 0 0 10 10
			key = 0.1 1 4.444445 4.444445
			key = 1 0 -1.111111 -1.111111
		}
	}

	TEMPLATE {
			templateName = stock-rapier-core
		position = 0,0,-0.2
		rotation = 0, 0, 0
		scale = 0.9, 0.9, 0.9
		}
		TEMPLATE {
			templateName = stock-methalox-lower-2
		position = 0,0,-0.1
		rotation = 0, 0, 0
		scale = 0.35, 0.35, 0.35
		}
	}
}
@PART[spotLight1_v2]:NEEDS[ReStock]:FOR[KSRP] {
	!MODULE[ModuleWaterfallFX] {}
	MODULE {
		name = ModuleWaterfallFX
		moduleID = lightFX
		CONTROLLER {
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER {
			name = light
			lightName = none
			linkedTo = light
		}
		TEMPLATE {
			templateName = waterfall-spotlight-1
			overrideParentTransform = Spot
			position = 0,0,0
			rotation = 0, 0, 0
			scale = 1, 1, 1
		}
	}
}

@PART[JetEngine_v1]:NEEDS[Waterfall]:FOR[KSRP] {
  !EFFECTS {}
  EFFECTS {
	fx-panther-dry-spool {
	  AUDIO
	  {
		name = soundDry1
		channel = Ship
		//clip = RestockWaterfallExpansion/JetSFX/Sounds/GE404_Running_Low
		volume = 0.0 0.0
		volume = 0.0001 1.12
		volume = 1.0 1.32
		pitch = 0.0 0.3
		pitch = 1.0 1.0
		loop = true
	  }
	  PREFAB_PARTICLE
	  {
		prefabName = fx_smokeTrail_aeroSpike
		transformName = smokePoint
		emission = 0.0 0.0
		emission = 0.05 0.0
		emission = 0.075 0.1
		emission = 1.0 0.6
		speed = 0.0 5.0
		speed = 1.0 10.0
		energy = 0.0 2.0
		energy = 1.0 4.0
		localOffset = 0, 0, 7
	  }
	}

	fx-panther-dry-power {
	  AUDIO
	  {
		name = soundDry1
		channel = Ship
		//clip = RestockWaterfallExpansion/JetSFX/Sounds/GE404_Running_High
		volume = 0.0 0.0
		volume = 0.0001 1.12
		volume = 1.0 1.32
		pitch = 0.0 0.3
		pitch = 1.0 1.0
		loop = true
	  }
	  AUDIO
	  {
		name = soundDry2
		channel = Ship
		//clip = RestockWaterfallExpansion/JetSFX/Sounds/GE404_Running_Low
		volume = 0.0 0.0
		volume = 0.0001 1.12
		volume = 1.0 1.32
		pitch = 0.0 0.3
		pitch = 1.0 1.0
		loop = true
	  }
	}

	engage {
	  AUDIO
	  {
		channel = Ship
		//clip = RestockWaterfallExpansion/JetSFX/Sounds/GE404_Startup
		volume = 1.0
		pitch = 2.2
		loop = false
	  }
	}

	disengage {
	  AUDIO
	  {
		channel = Ship
		//clip = RestockWaterfallExpansion/JetSFX/Sounds/GE404_Shutdown
		volume = 1
		pitch = 1.8
		loop = false
	  }
	}

	flameout {
	  PREFAB_PARTICLE
	  {
		prefabName = fx_exhaustSparks_flameout_2
		transformName = smokePoint
		oneShot = true
	  }
	  AUDIO
	  {
		channel = Ship
		//clip = RestockWaterfallExpansion/JetSFX/Sounds/GE404_Shutdown
		volume = 1
		pitch = 2.0
		loop = false
	  }
	}
  }

  @MODULE[ModuleEngines*] {
	%powerEffectName = fx-panther-dry-power
	%spoolEffectName = fx-panther-dry-spool
  }

  MODULE {
	name = ModuleWaterfallFX
	moduleID = pantherDry
	CONTROLLER {
	  name = atmosphereDepth
	  linkedTo = atmosphere_density
	}
	CONTROLLER {
	  name = throttle
	  linkedTo = throttle
	  engineID = Dry
	  responseRateUp = 0.01
	  responseRateDown = 0.01
	}
	CONTROLLER {
	  name = mach
	  linkedTo = mach
	}
	TEMPLATE {
	  templateName = stock-kerozine-turbofan-2
	  overrideParentTransform = thrustTransform
	  position = 0,0,0
	  rotation = 0, 0, 0
	  scale = 1, 1, 1
	}
  }
}
@PART[turboFanEngine_v1]:NEEDS[Waterfall]:FOR[KSRP] {
  !EFFECTS {}
  	EFFECTS {
		fx_whiplash_spool {
			AUDIO {
				name = soundspool
				channel = Ship
				clip = RestockWaterfallExpansion/JetSFX/Sounds/RR_Olympus_Running_Low
				volume = 0.1 0.0
				volume = 0.3 1.2
				volume = 1.0 1.5
				pitch = 0.0 0.4
				pitch = 1.0 1.0
				loop = true
			}
	  PREFAB_PARTICLE
	  {
		prefabName = fx_smokeTrail_aeroSpike
		transformName = smokePoint
		  emission = 0.0 0.0
		emission = 0.05 0.0
		emission = 0.075 0.1
		emission = 1.0 0.6
		speed = 0.0 5.0
		speed = 1.0 10.0
		energy = 0.0 2.0
		energy = 1.0 4.0
		localOffset = 0, 0, 7
	  }
		}

		fx_whiplash_power {
			AUDIO {
				name = sound1
				channel = Ship
				clip = RestockWaterfallExpansion/JetSFX/Sounds/RR_Olympus_Running_High
				volume = 0.0 0.0
				volume = 0.0001 0.65
				volume = 1.0 0.8
				pitch = 0.0 0.3
				pitch = 1.0 1.5
				loop = true
			}
			AUDIO {
				name = sound2
				channel = Ship
				clip = RestockWaterfallExpansion/JetSFX/Sounds/RR_Olympus_Running_Low
				volume = 0.1 0.0
				volume = 0.3 2
				volume = 1.0 3
				pitch = 0.0 0.2
				pitch = 1.0 0.9
				loop = true
			}
		}
		engage {
			AUDIO {
				channel = Ship
				clip = RestockWaterfallExpansion/JetSFX/Sounds/RR_Olympus_Startup
				volume = 1.0
				pitch = 2.2
				loop = false
			}
		}
		disengage {
			AUDIO {
				channel = Ship
				clip = RestockWaterfallExpansion/JetSFX/Sounds/RR_Olympus_Shutdown
				volume = 1
				pitch = 1.8
				loop = false
			}
		}
		flameout {
			PREFAB_PARTICLE {
				prefabName = fx_exhaustSparks_flameout_2
				transformName = smokePoint
				oneShot = true
			}
			AUDIO {
				channel = Ship
				clip = RestockWaterfallExpansion/JetSFX/Sounds/RR_Olympus_Shutdown
				volume = 1
				pitch = 2.0
				loop = false
			}
		}
	}


@PART[spotLight1_v2|spotLight2_v2]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = appearanceSwitch
		switcherDescription = #L_RPVarType_Color
		affectDragCubes = false
		SUBTYPE {
			name = White
			title = #L_RPVarSub_White
			primaryColor = #ffffff
			secondaryColor = #c7c7c7
			TEXTURE {
				texture = ReStock/Assets/Electrical/restock-lights-1-alt
				currentTexture = restock-lights-1
			}
		}
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Black
			title = #L_RPVarSub_Black
			primaryColor = #242424
			secondaryColor = #171717
			TEXTURE {
				texture = ReStock/Assets/Electrical/restock-lights-1
				currentTexture = restock-lights-1
			}
		}
	}
}


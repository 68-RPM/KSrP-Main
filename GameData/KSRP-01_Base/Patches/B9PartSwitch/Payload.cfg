@PART[Size1to0ServiceModule]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,SquadExpansion/MakingHistory,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = meshSwitch
		switcherDescription = #L_RPVarType_Shape
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Solid
			title = #L_RPVarStruct_Solid
			primaryColor = #ffffff
			secondaryColor = #c7c7c7
			transform = Base_Structural
			transform = EndCap_Structural
		}
		SUBTYPE {
			name = Tunnel
			title = #L_RPVarStruct_Tunnel
			primaryColor = #c7c7c7
			secondaryColor = #242424
			transform = endcap_top
			transform = endcap_bottom
			transform = Base_CrewTunnel
			transform = COLCrewTunnel
		}
	}
}

@PART[ServiceModule18]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,SquadExpansion/MakingHistory,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = meshSwitch
		switcherDescription = #L_RPVarType_Shape
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Shelf
			title = #L_RPVarStruct_Shelf
			primaryColor = #ffffff
			secondaryColor = #c7c7c7
			transform = COLMid01
			transform = COLMid02
			transform = Core_Platform
			transform = Platform
			transform = Torus
		}
		SUBTYPE {
			name = Hollow
			title = #L_RPVarStruct_Hollow
			primaryColor = #c7c7c7
			secondaryColor = #242424
			transform = Core_Without_Platform
		}
	}
}
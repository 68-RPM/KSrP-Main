@PART[hydrogen-125-1|hydrogen-125-2]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitch]] {
		!SUBTYPE[Foil] {}
		!SUBTYPE[White] {}
		!SUBTYPE [WhiteBare] {}
		!SUBTYPE [FoilBare] {}
		SUBTYPE {
			name = Foil
			title = #LOC_CryoTanks_switcher_tankappearance_variant1
			primaryColor = #C7974A
			secondaryColor = #C7974A
			transform = 125TankFoilStructured
			transform = 125TankFoil
		}
		SUBTYPE {
			name = White
			title = #LOC_CryoTanks_switcher_tankappearance_variant2
			primaryColor = #ffffff
			secondaryColor = #ffffff
			transform = 125TankIsoStructured
			transform = 125TankIso
		}
	}
	MODULE,0 {
		name = ModuleB9PartSwitch
		moduleID = meshSwitch
		switcherDescription = #LOC_RPswitcher_Shape
		SUBTYPE {
			name = Truss
			primaryColor = #999999
			secondaryColor = #999999
			transform = COLLIDERA
			transform = 125mStructure
			transform = 125TankExtraStructured
			transform = 125TankFoilStructured
			transform = 125TankIsoStructured
			node = top01
			node = bottom01
		}
		SUBTYPE {
			name = Bare
			primaryColor = #666666
			secondaryColor = #666666
			transform = COLLIDERB
			transform = COLLIDERC
			transform = 125TankExtra
			transform = 125TankFoil
			transform = 125TankIso
			node = top02
			node = bottom02
		}
	}
}


@PART[smallCargoContainer]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = appearanceSwitch
		switcherDescription = #L_RPVarType_Color
		affectDragCubes = false
		SUBTYPE {
			defaultSubtypePriority = 1
			name = White
			title = #L_RPVarSub_White
			primaryColor = #ffffff
			secondaryColor = #c7c7c7
			transform = smallCargoContainer-white
		}
		SUBTYPE {
			name = Metal
			title = #L_RPVarSub_Metal
			primaryColor = #6f6e6d
			secondaryColor = #4f4f4f
			transform = smallCargoContainer-metal
		}
	}
}


@PART[RCSLinearSmall]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = mountSwitch
		switcherDescription = #LOC_RPswitcher_Mount
		affectDragCubes = true
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Shroud
			title = #L_RPVarMount_Shroud
			primaryColor = #b89f54
			secondaryColor = #a6a6a6
			transform = MiniRCSBlock2
		}
		SUBTYPE {
			name = Bare
			title = #L_RPVarMount_Bare
			primaryColor = #b89f54
			secondaryColor = #5a5a5a
			transform = MiniRCSBlock1
		}
	}
}


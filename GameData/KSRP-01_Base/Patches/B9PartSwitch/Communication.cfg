@PART[HighGainAntenna]:FOR[zzz_ReProgram]:NEEDS[B9PartSwitch,ReStock] {
	!MODULE[ModulePartVariants] {}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = mountSwitch
		switcherDescription = #L_RPVarType_Mount
		affectDragCubes = true
		switchInFlight = true
		SUBTYPE {
			defaultSubtypePriority = 1
			name = Axial
			title = #L_RPVarMount_Axial
			primaryColor = #fccb0a
			secondaryColor = #707070
			transform = Dish_Axial
		}
		SUBTYPE {
			name = Radial
			title = #L_RPVarMount_Radial
			primaryColor = #707070
			secondaryColor = #fccb0a
			transform = Dish_Normal
		}
	}
}


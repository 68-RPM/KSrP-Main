@PART[*]:HAS[@MODULE[RSE_RCS],@MODULE[ModuleRCSFX]:HAS[#resourceName[MonoPropellant]]]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_RCS] {
		@SOUNDLAYER[Thrust] {
			@audioClip = KSRP-01_Base/Sounds/RcsColdGas
			//@pitch = 1
		}
		@SOUNDLAYER[ThrustHigh] {
			@audioClip = KSRP-01_Base/Sounds/RcsColdGas
			//@pitch = 1
		}
	}
}

@PART[*]:HAS[@MODULE[RSE_RCS],@MODULE[ModuleRCSFX]:HAS[@PROPELLANT[LiquidFuel]]]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_RCS] {
		@SOUNDLAYER[Thrust] {
			@audioClip = KSRP-01_Base/Sounds/RcsHeavy
			//@pitch = 1
		}
		@SOUNDLAYER[ThrustHigh] {
			@audioClip = KSRP-01_Base/Sounds/RcsHeavy
			//@pitch = 1
		}
	}
}
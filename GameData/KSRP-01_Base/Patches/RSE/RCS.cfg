@PART[*]:HAS[@MODULE[RSE_RCS],@MODULE[ModuleRCSFX]:HAS[#resourceName[MonoPropellant]]]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_RCS] {
		@SOUNDLAYER[Thrust] {
			@audioClip = KSRP-01_Base/Sounds/RcsColdGas
			@pitch = 1
			@volume = 0.2
		}
		@SOUNDLAYER[ThrustHigh] {
			@audioClip = KSRP-01_Base/Sounds/RcsColdGas
			@pitch = 1
			@volume = 0.2
		}
	}
}
@PART[*]:HAS[@MODULE[ModuleDockingNode],@MODULE[RSE_Coupler]]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_Coupler] {
		@Dock {
			@SOUNDLAYER[dock] {
				@audioClip = KSRP-01_Base/Sounds/Dock
				@volume = 0.6
			}
		}
		@Undock {
			@SOUNDLAYER[undock] {
				@audioClip = KSRP-01_Base/Sounds/Undock
				@volume = 0.9
			}
		}
	}
}
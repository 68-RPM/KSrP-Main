@PART[*]:HAS[#sound_vent_large[decouple]]:FIRST {
	ksrpRSEflagSVL = yes
}
@PART[*]:HAS[#sound_decoupler_fire[decouple]]:FIRST {
	ksrpRSEflagSDF = yes
}

@PART[*]:HAS[@MODULE[RSE_Coupler],#ksrpRSEflagSVL]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_Coupler] {
		@Decouple {
			@SOUNDLAYER[decouple] {
				@audioClip,0 = KSRP-01_Base/Sounds/StagingVent
				!audioClip,1 = nil
				!audioClip,2 = nil
				@pitch = 1
			}
		}
	}
	!ksrpRSEflagSVL = nil
}
@PART[HeatShield0]:HAS[@MODULE[RSE_Coupler]]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_Coupler] {
		@Decouple {
			@SOUNDLAYER[decouple] {
				@audioClip,0 = KSRP-01_Base/Sounds/StagingVent
				!audioClip,1 = nil
				!audioClip,2 = nil
				@pitch = 1
			}
		}
	}
}

@PART[*]:HAS[@MODULE[RSE_Coupler],#ksrpRSEflagSDF]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_Coupler] {
		@Decouple {
			@SOUNDLAYER[decouple] {
				@audioClip,0 = Squad/Sounds/sound_decoupler_fire
				!audioClip,1 = nil
				!audioClip,2 = nil
				@pitch = 1
			}
		}
	}
	!ksrpRSEflagSDF = nil
}
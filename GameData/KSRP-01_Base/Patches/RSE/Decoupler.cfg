
@PART[*]:HAS[@MODULE[RSE_Coupler]]:AFTER[RocketSoundEnhancementDefault] {
	@MODULE[RSE_Coupler] {
		@Decouple {
			@SOUNDLAYER[decouple] {
				@audioClip,0 = Squad/Sounds/sound_decoupler_fire
				@audioClip,1 = KSRP-01_Base/Sounds/sound_vent_medium
				@audioClip,2 = KSRP-01_Base/Sounds/sound_vent_soft
			}
		}
	}
}
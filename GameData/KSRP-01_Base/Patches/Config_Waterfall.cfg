@WATERFALL_SETTINGS:LAST[zzz_ReProgram]:NEEDS[Waterfall] {
	@ShowEffectEditor = True
	@DebugLoading = True
}

@PART[B9_Structure_HX_HPD1]:LAST[zzz_ReProgram] {
	!EFFECTS {}
	EFFECTS {
		power_closed {
			RSE_AUDIO {
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
		}
		power_plasma {
			RSE_AUDIO {
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage {
			RSE_AUDIO {
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage {
			RSE_AUDIO {
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout {
			RSE_AUDIO {
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	MODULE {
		name = ModuleWaterfallFX
		moduleID = HPD
		engineID = Engine

		CONTROLLER {
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER {
			name = throttle
			linkedTo = throttle
		}
		CONTROLLER {
			name = random
			linkedTo = random
			range = -1,1
		}
		TEMPLATE {
			templateName = waterfall-methalox-lower-BE4-1
			overrideParentTransform = nozzle_transform
			position = 0,0,0.1
			rotation = 0, 0, 0
			scale = 1, 1, 1.1
		}
	}
}


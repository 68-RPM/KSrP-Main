@Kopernicus:FOR[zzz_ReProgram] {
	@Body[Mun] {
		@Properties {
			%displayName = #LOC_RPtitle_Mun
		}
	}
	@Body[Eve] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/rocky_atmos_greenhouse.png
		}
	}
	@Body[Kerbin] {
		@Orbit {
			%eccentricity = 0.00000001
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/rocky_atmos_garden.png
		}
	}
	@Body[Duna] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/rocky_atmos_thin.png
		}
	}
	@Body[Dres] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/rocky_ringed.png
		}
	}
	@Body[Jool] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/giant.png
		}
	}
	@Body[Laythe] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/oceanic.png
		}
	}
	@Body[*]:HAS[#name[Moho|Mun|Minmus|Ike|Vall|Tylo|Eeloo]] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/rocky.png
		}
	}
	@Body[*]:HAS[#name[Gilly|Bop|Pol]] {
		@Orbit {
			iconTexture = KSRP-01_Base/Assets/Kopernicus/Conics/rocky_imbalanced.png
		}
	}
}
// These descriptions copy lines and motifs from RSS, JNSQ, and Alternis Kerbol Rekerjiggered along with the original writing. See "WARNING: COPYRIGHT UNFRIENDLY BUILD"

Localization {
  en-us {
	  // Solar System
	#L_ReProgramKS_KerbolDesc = The most well known object in the daytime sky, the Sun is the center of Kerbal-kind's little universe. The gigantic nuclear furnace of even a relatively small star such as itself can provide more than enough energy to keep a planetary system warm and illuminated for countless millions of years.\n\nScientists have noted a particular burning sensation and the potential for serious vision damage if it is stared at for long periods of time.\nThis is especially important to keep in mind, considering the effect shiny objects have on the average Kerbal.
	#L_ReProgramKS_MohoDesc = This planet figures in Kerbal mythology as a fiery place, with oceans of flowing lava\nand an atmosphere of hot,\nvolatile gases. In reality,\nhowever, Moho has been a geologically quiet planet for many eons—beaten dead by impactors and solar wind.\n\nSome have speculated about possible ways to make it “awesome, like in the stories,”\nand some of those ideas have led to new and exciting break-throughs in aerospace tech.\nHowever, the logistics involved in plotting missions to Moho are a nightmare for engineers.
	#L_ReProgramKS_EveDesc = An exceptionally purple planet, Eve's gorgeous cloud cover is concealing nasty oceans of sulfuric liquid. Presumably, a rare substance creates the tint of this beautiful, bright object, which the Kerbal Astronomical Society has advised is almost certainly not grape juice.)\n\nIt is considered by some to be almost a sister world to Kerbin,\nin spite of, well—the purple, the intense gravitational pull, the dense, toxic atmosphere and extreme temperatures…\nActually, it’s not very similar at all is it?\n\nWho are those people?
	#L_ReProgramKS_GillyDesc = The smallest natural satellite in the entire solar system is this lumpy rock wandering around  the orbit of Eve. Even with modern telescopes, Gilly's discovery was pure luck, as it rarely ever transits Eve at an angle that is visible from Kerbin.\nThe low mass of this object suggests similarly gentle gravity, so it would be wise for\nprospective astronauts to be very cautious about watching their step.\n\nDue to the large amount of squinting and eye strain associated with Gilly’s discovery, wearing glasses has now become synonymous with being an accomplished Astronomer.
	#L_ReProgramKS_KerbinDesc = The only place in the known universe where intelligent life has originated.\nHome to the Kerbals, this wondrous and unique world has just the right conditions to support a vast, seemingly undepletable population of the little green creatures, and though they leap eagerly at the prospect of space exploration, there’s still much to appreciate about the natural beauty of their home planet.\n\nReaching a stable orbit around Kerbin is one of the first things budding space programs strive for. Arguably, those who can get their ship into orbit are halfway to anywhere.
	#L_ReProgramKS_MunDesc = Kerbin’s neighbor since time immemorial, the Mün is a large and particularly close natural satellite that often illuminates Kerbin's night sky and eclipses the Sun. The transition from reverence of the Mün to the study of it has been widely regarded as one of the more important steps in Kerbal history.\n\nAn attempt to land upon its surface is usually the immediate goal after achieving Kerbin orbit. Even if one isn’t planning to stop here, they may wish to give the Mün a close pass for a gravity “sling-shot” out into the greater cosmos—but don’t fly too low!
	#L_ReProgramKS_MinmusDesc = Rather small, rather distant, and rather green, Minmus is the lesser satellite orbiting Kerbin, from which one may see it on clear days as a tiny blue speck in the sky. Although it is a slightly more difficult target than the Mün, it may be far easier to land on.\n\nAs long as artisan food has existed, so has the belief that it is composed of ice cream or mint. Research indicates that it’s more likely glass or patina, to the dismay of many.
	#L_ReProgramKS_DunaDesc = Otherwise known as the Reddest Planet, or "that dot that you can see if you squint at it really hard," Duna has long been a wonder to Kerbalkind, and been held in much awe due to its striking red color (a stark contrast to the color green.)\n\nDuna may have resembled Kerbin in the ancient past, but at some point it became inert and was reduced to a frigid, rusty desert with horribly thin air. Nevertheless, the Kerbal Astronomical Society is sure that Duna is a much more approachable destination than the other three inner planets.
	#L_ReProgramKS_IkeDesc = This relatively large, grey object is occasionally seen looming over Duna, in an orbit almost synchronous with the rotation of the planet below. With a rather large SOI, Ike loves visitors, even when said visitors were planning to go to Duna. Some have made the conjecture that the moon is perfectly positioned to sneakily interfere with any object that presumes to come drifting near its parent.\n\nThough notably different in geological composition, it is rather similar to the Mün in shape and orbit. Why, one wonders, is Ike so alike?
	#L_ReProgramKS_DresDesc = The largest object in the asteroid belt. Dres is classified as a minor planet, as its highly irregular orbit is shared with various other rocks. It took a good while to discover, too, for half the time it wasn’t where scientists expected to find new planets.\n\nDue to its nature of frequenting the bad parts of space, it was officially labeled as “Not to be trusted” by the scientific community—cementing its position as the loneliest world around.\n\nPoor Dres.
	#L_ReProgramKS_GP1Desc = By sheer size, Jool stands the tallest among the planets, and its easily the richest celestial body (by composition.) The predominantly green world is flashy target for telescopes, and Kerbals have longed to visit it, reasoning that the swirling gas giant must be a really nice place to visit on account of its wholesome coloration.\n\nThe Kerbal Astronomical Society notes that this judgment is only true if you stay out of its magnetic field, let alone its terrifying, stormy atmosphere… nevertheless, Jool is a chief source of inspiration to Kerbals, for both interplanetary journeys and watercolor paintings.
	#L_ReProgramKS_LaytheDesc = When Laythe was first discovered, it was not entered in the records. About a second later, the researcher realized that telescopes don’t work that way, and urgently rushed to record what he had observed.\n\nThe gleaming oceans and\nthick atmosphere of this moon easily cause hard questions to arise, such as: Why? How? Could it sustain life? Is it safe from Jool's radiation? Or tidal forces?\nMost importantly...\n\n\nHow soon can we go?
	#L_ReProgramKS_VallDesc = Vall is a curiously blue, airless hailstone, and one of the last moons of Jool to be discovered; having been mistaken for a strange asteroid or a speck on a telescope lens several times.\n\nTidal forces from the other moons, as well as a heaping dose of radiation from Jool, warm the moon enough for it to support liquid water beneath the surface, which occasionally bubbles out of the moon’s many cryovolcanoes.
	#L_ReProgramKS_TyloDesc = Tylo was the first moon of Jool to be discovered, after it foiled many astronomers’ attempts to take a flawless picture of Jool to hang up in the office.\n\nThe large, pale object has approximately the same diameter and nearly the same gravity as Kerbin—with none of the atmosphere. This means that while it makes an excellent gravity assist, it takes lots of Δv and guts to attempt a landing.\n\nScientists speculate that the view from the surface with Laythe, Vall and Jool overhead must be “quite something.”
	#L_ReProgramKS_BopDesc = A small moon in the vicinity of Jool, Bop is unique among all large moons in the solar system for its retrograde orbit around its planet. That, combined with its semi-chaotic precession, makes Bop a maligned moon.\n\nNotably, It’s spoken of in pilot folklore as the home of a mischievous demon known as the Kraken, said to tear spacecraft asunder.\nSome astronauts who survive particularly bad mission failures blame this monster for destroying their spacecraft, much to the chagrin of sceptics.
	#L_ReProgramKS_PolDesc = This moon was especially hard to spot, as it looks just like a pollen grain, particularly when observed through telescopes based near dusty fields.\nPol is a toxic world, spewing sulfuric compounds and covered in spiky hairs of sulfur dioxide ice.\n\nBetween that, and the lack of an atmosphere, hopes of Pol lending itself well to off-world agriculture from its volcanism or its botanical name are very much misguided.
	  // Kerbol System Expansion
	#L_ReProgrmaKE_GP2Desc = Early astronomers believed that Salenne was in fact multiple planets, closely orbiting together.\n\nWhen they cleaned their telescopes, they realized that those extra planets were in fact thin rings orbiting Salenne.\nRegular cleaning of telescope lenses became mandatory after that.
	#L_ReProgramKE_GP2WIP = There is insufficient data on this moon of Salenne at this time. The Kerbal Astronomical Society is currently studying this celestial object.
	#L_ReProgramKE_GP3Desc = It took a while for Kerbal astronomers to realize Oron was not a far away star, but in fact another planet. Not long after that, they incorrectly supposed that it rotated the same way as all of the other planets.\n\nSince then, scientists have been weary of making claims about Oron, for fear of being wrong yet again.\n\nThis planet is what is known as an ice giant; it is gaseous like Jool and Salenne, but is colder, and its atmosphere contains lots of water, methane, and ammonia.
	#L_ReProgramKE_WallDesc = This oblate, frisbee-like rock is a unique case among the objects of the solar system: Wal is a moon of a moon, orbiting Tal rather than Oron.\n\nGiven it is, again, unique in the solar system, we can conjecture that satellites such as this are quite rare...but with a sample size of one, we can't really say for certain.
	#L_ReProgramKE_GP3WIP = There is insufficient data on this moon of Oron at this time. The Kerbal Astronomical Society is currently studying this celestial object.
	#L_ReProgramKE_GP4Desc = Due to its distance from Kerbin, it wasn't until fairly recently that Kerbal-kind discovered the solar system's most distant planet. At first, scientists thought Suyulo might be a rocky planet like Eve, but they quickly realized they were in fact looking at an ice giant similar to Oron.\n\nAmong the gaseous planets in the solar system, Suyulo is the most dense.
	#L_ReProgramKE_MakapeleDesc = This object was quickly discovered making regular transits of Suyulo, but was initially dismissed as garbage data as there positively could not be a moon with a semi-major axis that low. But sure enough: Maka exists, teetering dangerously close to its tidal limit and coming apart at the seams.\n\nThough it appears stable for now, we probably shouldn't attempt to set up any bases on it.
	#L_ReProgramKE_GP4WIP = There is insufficient data on this moon of Suyulo at this time. The Kerbal Astronomical Society is currently studying this celestial object.
	#L_ReProgramKE_BelsonDesc = There was a considerable amount of controversy around the status of Belson as being a proper planet or “just a lump of rock going around the Sun”. Most academic summits held to address this issue would devolve into, on good days, petty name calling, and on worse ones, all-out brawls. Fortunately, everybody eventually agreed to classify it as a minor planet.\n\nBelson has a considerable collection of its fellow distant objects as moons.\nPerhaps this goes to show that no matter how far you are from the sun, you aren’t alone out there in the cosmos.
	#L_ReProgramKE_MoogDesc = This moon of Belson is of particular interest, as it appears to be an ancient, baby planet, without enough mass to even round itself.\n\nThe discovery of "planetesimals" such as this has firmly refuted our previous theories, which stated that the modern planets formed in a cataclysmic, cosmic traffic pile-up.\n\nIt is hard to drum up support for missions here, however, as public consensus appears to be that Moog is "honestly kinda boring" compared to Eriz or Eeloo.
	#L_ReProgramKE_BelsonWIP = There is insufficient data on this moon of Belson at this time. The Kerbal Astronomical Society is currently studying this celestial object.
	#L_ReprogramKE_EelooDesc = Discovered at the same time as Belson, it was initially thought that Eeloo was the planet, and Belson the moon. This was, fortunately, later corrected.\n\nEeloo is covered in brown scratches, which could be the result of cryovolcanic activity... possibly even implicative of the moon harboring a liquid ocean beneath its crust.
	#L_ReProgramKE_AscensionDesc = This extraordinarily distant object is, at least for the time being, so far out from the Sun that it puts even Belson to shame. Predictive models indicate that its periapsis is within the neighborhood of the outer planets, but it will be a very, very long time before it reaches that point.\n\nTo the reasoning minds of the Kerbal Astronomical Society's scientists, the idea of reaching this planet with a spacecraft is an absurd prospect, completely out of the question.\n\nTo the imaginative minds of the Kerbal Space Program's engineers, however…
	  // Kcalbeloh System
	#L_ReProgramKC_KcalbelohDesc = This gargantuan object is known as a supermassive black hole. Infamous for eating stars, space-time, and calculators, black holes such as Kcalbeloh are super-dense objects with gravity so powerful that no velocity in the universe could ever overcome it.\n\nFortunately, however, they are as safe to orbit as any other object. In particular, Kcalbeloh is a rather tame case, that has probably not torn a star apart in millions of years.\n\nStill, the Kerbal Astronomical Society very strongly advises against any attempt to land on a black hole.
	#L_ReProgramKC_WHDesc = This is a wormhole, connecting the solar system with a distant star. It is essentially a black hole, but with the other end of the 'tunnel' as the apparent horizon.\n\nNavigating a wormhole is tricky, and will subject your spacecraft to strong tidal forces. The best course of approach is to gently lower your periapsis…rather than, say, diving straight down like you're trying to land on it.
}
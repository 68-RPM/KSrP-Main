// Stock + Kcalbeloh System planet radii are typically rounded
// to some degree, while Kerbol System Expansion notably does
// not do this, making it incongruous to the rest of the game
// this attempts to round out the radius of each celestial
// object provided by Kerbol System Expansion
@Kopernicus:FOR[zzzReProgram] {
	@Body[Salenne]:NEEDS[KerbolExpansion] {
		@Properties {
			@radius = 5780000 // mean(3000000,5300000,5823200,9000000) -- Radii of Jool/2, Sarnus, Salenne, and GP2 (rounded)
		}
	@Body[Ulloom]:NEEDS[KerbolExpansion] {
		@Properties {
			@radius = 3077000 // mean(2177000,3100000,[3100000*(30/29)],3823200) -- Radii of Urlum, Mandrake, Mandrake (adjusted for Juni-Jool deficit), and Oron (rounded)
		}
	@Body[Poseidon]:NEEDS[KerbolExpansion] {
		@Properties {
			@radius = 2376000 // mean(2000000,2145000,2460686,2900000) -- Radii of GP3, Neidon, Suyulo (rounded), and Rutherford (rounded)
		}
	}
}
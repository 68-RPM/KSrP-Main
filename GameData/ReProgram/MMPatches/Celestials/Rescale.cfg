@Kopernicus:FOR[zzzReProgram] {
  @Body[*] {
	@ScaledVersion {
	  @fadeStart *= 1.4
	  @fadeEnd *= 1.4
	}
	@PQS {
	  @fadeStart *= 1.4
	  @fadeEnd *= 1.4
	  @deactivateAltitude *= 1.4
	}
  }
  @Body:HAS[#Tag[Stock|Expansion|BlackHole]] {
	@Properties {
	  @radius *= 2.56
	  @rotationPeriod *= 1.6
	  @geeASL *= 1
	@Orbit {
	  @semiMajorAxis *= 2.56
	}
	@PQS {
	  @mapMaxHeight *= 0.57
	}
	@Atmosphere {
	  @altitude *= 1.025
	}
  }
  @Body:HAS[#Tag[StockAsteroid|TPRAsteroid|ExpansionAsteroid]] {
	@Properties {
	  @radius *= 2.56
	  @rotationPeriod *= 1.6
	  @geeASL *= 1
	@Orbit {
	  @semiMajorAxis *= 2.56
	}
	@PQS {
	  @mapMaxHeight *= 0.88
	}
	@Atmosphere {
	  @altitude *= 1.025
	}
  }
  @Body:HAS[#Tag[BlackHoleInner]] {
	@Properties {
	  @radius *= 2.56
	  @rotationPeriod *= 0.625
	  @geeASL *= 1
	@Orbit {
	  @semiMajorAxis *= 2.56
	}
	@PQS {
	  @mapMaxHeight *= 0.57
	}
	@Atmosphere {
	  @altitude *= 1.025
	}
  }
  @Body:HAS[#Tag[Star|BlackHoleStar]] {
	@Properties {
	  @radius *= 2.56
	  @rotationPeriod *= 1
	  @geeASL *= 1
	@Orbit {
	  @semiMajorAxis *= 2.56
	}
	@PQS {
	  @mapMaxHeight *= 0.9953125
	}
	@Atmosphere {
	  @altitude *= 1
	}
  }
  @Body[Kcalbeloh]:NEEDS[KcalbelohSystem] {
	@ScaledVersion {
	  @Light {
		@luminosity *= 0.152587890625
	  }
	}
	@Properties {
	  @radius *= 1.2
	  @rotationPeriod *= 1
	  @geeASL *= 6.5536
	@Orbit {
	  @semiMajorAxis *= 1.6
	}
	@PQS {
	  @mapMaxHeight *= 1
	}
	@Atmosphere {
	  @altitude *= 1
	}
	@Light {
	  @sunAU *= 0.46875
	}
  }
  @Body[WH3141A|WH3141B]:NEEDS[KcalbelohSystem] {
	@Properties {
	  @radius *= 1
	  @rotationPeriod *= 1
	  @geeASL *= 1
	@Orbit {
	  @semiMajorAxis *= 2.56
	}
	@PQS {
	  @mapMaxHeight *= 1
	}
	@Atmosphere {
	  @altitude *= 1
	}
  }
}

@Scatterer_planetsList:AFTER[zzzReProgram] {
  @scattererCelestialBodies {
	@Item[*] {
	  @loadDistance *= 2.56
	  @unloadDistance *= 2.56
	}
  }
}

@Scatterer_sunflare:AFTER[zzzReProgram] {
  @Sun
	@flareSettings[2] *= 0.46875
	@spikesSettings[2] *= 0.46875
  }
  @AralcA:NEEDS[KcalbelohSystem] {
	@flareSettings[2] *= 0.46875
	@spikesSettings[2] *= 0.46875
  }
  @AralcB:NEEDS[KcalbelohSystem] {
	@flareSettings[2] *= 0.46875
	@spikesSettings[2] *= 0.46875
  }
  @Sunorc:NEEDS[KcalbelohSystem] {
	@flareSettings[2] *= 0.46875
	@spikesSettings[2] *= 0.46875
  }
  @Maelg:NEEDS[KcalbelohSystem] {
	@flareSettings[2] *= 0.46875
	@spikesSettings[2] *= 0.46875
  }
}
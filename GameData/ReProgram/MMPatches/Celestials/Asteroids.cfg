@Kopernicus:FOR[zzyReProgram] {
	!Asteroid[Stock] {}
	// Near-Kerbin asteroids, which emulate stock Kerbin asteroid flybys but on a 4x slower timer
	Asteroid {
		name = Kerbinoids
		interval = 60	// Very much not often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 44
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Flyby {
				Body {
					body = Kerbin
					minDuration = 15
					maxDuration = 60
					probability = 99
					reached = false
				}
			}
		}
	}
	// The Toshakona Belt; creates an asteroid belt + Dres asteroid flybys. Also emulates stock Dresteroids!
	Asteroid {
		name = Toshakoids
		interval = 15	// Often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 55
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Around {
				Body {
					body = Sun
					probability = 55
					reached = false	// Asteroid belt objects may be observed from Earth.
					semiMajorAxis {
						minValue = 34375680000
						maxValue = 48829100000
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
				}
				Body {
					body = Dres
					semiMajorAxis {
						minValue = 18133960
						maxValue = 20606775
					}
					probability = 33
					reached = true	// The Dresteroid belt waits for the player to reach Dres to spawn.
				}
			}
			Flyby {
				Body {
					body = Dres
					minDuration = 10
					maxDuration = 40
					probability = 11
					reached = true	// As they are Dresteroid offshoots
				}
			}
		}
	}
	// Jool's ring system and trojans; many, many small satellites and planetoids.
	Asteroid {
		name = Joolaroids
		interval = 15	// Often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 44
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Around {
				Body {
					body = Jool
					probability = 55
					reached = true // Jupiter's rings were not observed until the arrival of Voyager 1. You'll need to escape Jool to unlock the ring asteroids.
					semiMajorAxis {
						minValue = 11140000
						maxValue = 11730000
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
				}
				Body {
					body = Sun
					probability = 22
					reached = false	// Jupiter trojans may be observed from Earth.
					semiMajorAxis {
						minValue = 62844648000
						maxValue = 79617375000
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
					longitudeOfAscendingNode {
						minValue = 96.8691
						maxValue = 104.437
					}
					argumentOfPeriapsis {
						minValue = 264.0921
						maxValue = 284.7242
					}
					meanAnomalyAtEpoch {
						minValue = 304.1851
						maxValue = 312.1851
					}
				}
				Body {
					body = Sun
					probability = 22
					reached = false	// Jupiter trojans may be observed from Earth.
					semiMajorAxis {
						minValue = 62844648000
						maxValue = 79617375000
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
					longitudeOfAscendingNode {
						minValue = 96.8691
						maxValue = 104.437
					}
					argumentOfPeriapsis {
						minValue = 264.0921
						maxValue = 284.7242
					}
					meanAnomalyAtEpoch {
						minValue = 64.1851
						maxValue = 72.1851
					}
				}
			}
		}
	}
	// The Xuboloids, named for the theorized-then-refuted planet Xubol, a very innermost disc of sun-scorched debris
	Asteroid {
		name = Xuboloids
		interval = 45	// Not often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 33
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Around {
				Body {
					body = Sun
					probability = 99
					reached = true	// Vulcanoids are merely hypothesized and the sun's glare seems to obscure them. You'll need to escape Kerbin to unlock the Xuboloids.
					semiMajorAxis {
						minValue = 607500000 // Orbit of Cind from QuackPack
						maxValue = 2154700000 // Between Blas and Xubol (biased towards Xubol)
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
				}
			}
		}
	}
	// The Kuipoids, named for...did we have a simulation leak? Anyways, this is the Kuiper Belt objects + Eeloo asteroid flybys.
	Asteroid {
		name = Kuipoids
		interval = 30	// Occasional
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 44
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Around {
				Body {
					body = Sun
					probability = 88
					reached = false	// Kuiper belt objects may be observed from Earth.
					semiMajorAxis {
						minValue = 435195000000
						maxValue = 652792000000
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
				}
			}
			Flyby {
				Body {
					body = Eeloo
					minDuration = 10
					maxDuration = 40
					probability = 11
					reached = true
				}
			}
		}
	}
	// ?
	Asteroid {
		name = MagicBoulders
		interval = 45	// Not often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 33

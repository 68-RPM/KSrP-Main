			key = 1   1
		}
		Locations {
			Around {
				Body {
					body = Ike
					probability = 99
					reached = true	// Don't spoil the boulder early!
					semiMajorAxis {
						minValue = 180000
						maxValue = 220000
					}
					longitudeOfAscendingNode {
						minValue = 0
						maxValue = 0
					}
					argumentOfPeriapsis {
						minValue = 249
						maxValue = 259
					}
					meanAnomalyAtEpoch {
						minValue = 50

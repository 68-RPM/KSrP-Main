@Kopernicus:FOR[zzyReProgram] {
	!Asteroid[Stock] {}
	// Near-Kerbin asteroids, which emulate stock Kerbin asteroid flybys but on a 4x slower timer
	Asteroid {
		name = Kerbinoids
		interval = 60	// Very much not often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 44
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Flyby {
				Body {
					body = Kerbin
					minDuration = 15
					maxDuration = 60
					probability = 99
					reached = false
				}
			}
		}
	}
	// The Toshakona Belt; creates an asteroid belt + Dres asteroid flybys. Also emulates stock Dresteroids!
	Asteroid {
		name = Toshakoids
		interval = 15	// Often
		minUntrackedLifetime = 11
		maxUntrackedLifetime = 99
		probability = 55
		spawnGroupMinLimit = 3
		spawnGroupMaxLimit = 8
		Size {
			key = 0   0
			key = 0.3 0.45
			key = 0.7 0.55
			key = 1   1
		}
		Locations {
			Around {
				Body {
					body = Sun
					probability = 55
					reached = false	// Asteroid belt objects may be observed from Earth.
					semiMajorAxis {
						minValue = 34375680000
						maxValue = 48829100000
					}
					eccentricity {
						minValue = 0.0001
						maxValue = 0.001
					}
					longitudeOfAscendingNode {
						minValue = 0
						maxValue = 360
					}
					argumentOfPeriapsis {
						minValue = 0
						maxValue = 360
					}
					meanAnomalyAtEpoch {
						minValue = 0
						maxValue = 360
					}
				}
				Body {
					body = Dres
					probability = 33
					reached = false	// The Dresteroid belt waits for the player to reach Dres to spawn.
					semiMajorAxis {
						minValue = 18133960
						maxValue = 20606775
					}
				}
			}
			Flyby {
				Body {
					body = Dres
					minDuration = 10
					maxDuration = 40
					probability = 11
					reached = false	// As they are Dresteroid offshoots
				}
			}
		}
	}

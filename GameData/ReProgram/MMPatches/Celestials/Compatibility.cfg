@Kopernicus:BEFORE[zzzReProgram] {
  @Body[Eeloo]:NEEDS[KerbolExpansion,TPR] {
	@Properties {
	  %ScienceValues {
		%landedDataValue = 19.5
		%splashedDataValue = 19.8
		%flyingLowDataValue = 14.7
		%flyingHighDataValue = 14.6
		%inSpaceLowDataValue = 14.3
		%inSpaceHighDataValue = 14.1
		%recoveryValue = 14
		%flyingAltitudeThreshold = 5000
		%spaceAltitudeThreshold = 250000
	  }
	}
	@Orbit {
	  %referenceBody = Belson // Re-applies Eeloo patch which is broken by TPR
	  %semiMajorAxis = 15841126.4026729
	  %inclination = 0.8
	  %eccentricity = 0.034
	  %longitudeOfAscendingNode = 88
	}
  }
  @Body[Salenne]:NEEDS[KerbolExpansion] {
	@Properties {
	  @radius = 5823200 // Fixes Salenne's radius which is broken in KSE 1.2 (has an extra 1 at the front)
	}
  }
}

// Reapply Kcalbeloh's sunflare which is overwritten by TPR
@Scatterer_sunflare:AFTER[zzzReProgram]
{
	!Sun{}
	Sun
	{
		syntaxVersion = 2
		flareColor = 1,1,1
		
		flares
		{
			Item
			{
				texture = KcalbelohTextures/Sunflares/Flare_G.png
				displayAspectRatio = 1
				#../../../scaleCurveFlare{}
				@scaleCurveFlare
				{
					|_= scaleCurve
				}
				#../../../intensityCurveFlare{}

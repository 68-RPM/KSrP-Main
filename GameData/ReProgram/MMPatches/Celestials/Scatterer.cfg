@EVE_CLOUDS:AFTER[zzzReProgram] {
	OBJECT,* {
	@altitude *= 0.8
	}
}

@Scatterer_planetsList:FOR[zzyReProgram] {
	@scattererCelestialBodies {
		@Item:HAS[#celestialBodyName[Laythe]] {
			%secondarySuns {
				%Item {
					%celestialBodyName = Jool
					sunColor = 0.0105,0.0175,0.01075
				}
			}
		}
		Item {
			celestialBodyName = Minmus
			transformName = Minmus
			loadDistance = 300000000
			unloadDistance = 500000000
			hasOcean = False
			flatScaledSpaceModel = False
			usesCloudIntegration = True
			cloudIntegrationUsesScattererSunColors = False
			mainSunCelestialBody = Sun
			sunsUseIntensityCurves = False
		}
	}
}

@Scatterer_atmosphere:AFTER[zzzReProgram] {
	Atmo {
	@HR *= 1.3
	@HM *= 1.3
	@m_betaR[0] *= 0.77
	@m_betaR[1] *= 0.77
	@m_betaR[2] *= 0.77
	@BETA_MSca[0] *= 0.77
	@BETA_MSca[1] *= 0.77
	@BETA_MSca[2] *= 0.77
	}
}

Scatterer_atmosphere {
	Atmo {
		name = Minmus
		atmosphereStartRadiusScale = 1
		HR = 2
		HM = 1.04999995
		m_betaR = 0.00142700004,0.00603300007,0.0049879998

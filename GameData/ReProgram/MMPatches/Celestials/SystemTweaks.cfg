@Kopernicus:FOR[zzzReProgram] {
	@Body[Kerbin] {
		@Orbit {
			%eccentricity = 0.0082
		}
	}
		@Body[Mun] {
			@Orbit {
				%eccentricity = 0.027
			}
		}
		@Body[Minmus] {
			@Orbit {
				%eccentricity = 0.00005
			}
		}
	// @Body[Jool] {
	// }
		@Body[Bop] {
			@Orbit {
				%inclination = 165 // "All hail retrobop!" - Principia
				%longitudeOfAscendingNode = 190 // (1) Ensures orbit is a perfect flip along the semi-major axis (1)
				%argumentOfPeriapsis = 155 // (2) Ensures orbit is a perfect flip along the semi-major axis (2)
				%meanAnomalyAtEpoch = 5 // (3) Ensures retrobop starts at the same position whcih Bop does in stock
			}
		}
	@Body[Ascension]:NEEDS[KerbolExpansion] {
		@Properties {
			%meanAnomalyAtEpoch = 3.14159265358979
			%initialRotation = 180
		}
		@Orbit {
			%semiMajorAxis = 484616812350 // 549104304580
		}
	}
}
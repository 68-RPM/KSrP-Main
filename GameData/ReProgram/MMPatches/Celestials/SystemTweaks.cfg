	@Body[Pallas]:NEEDS[KerbolExpansion] {
		@ScaledVersion {
			@OnDemand {
				@texture = ReProgram/PluginData/New_Pallas_Color.dds
			}
		}
		@PQS {
			@Mods {
				@VertexColorMap {
					@map = ReProgram/PluginData/New_Pallas_Color.dds
				}
			}
		}
	}
	@Body[Ascension]:NEEDS[KerbolExpansion] {
		@Properties {
			%initialRotation = 180
		}
		@Rings {
			@innerRadius = 4660
			@thickness = 1
			%texture = ReProgram/PluginData/dwarfPlanetRing.png
			@color = 0.57,0.55,0.54,1
			@steps = 16384
		}

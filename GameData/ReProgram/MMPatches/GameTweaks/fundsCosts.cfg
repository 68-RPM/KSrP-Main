	@unitCost = 0.03246	// 457.6/t (LF/O 160/t)
}
@RESOURCE_DEFINITION[LqdMethane]:NEEDS[CommunityResourcePack,!KeroloxRemixed]:FIRST {
	@unitCost = 0.143	// 335.89/t
}

// New Fuels
RESOURCE_DEFINITION {
	name = HyperFuel
	displayName = #L_ReProgramRS_HyperFuel
	abbreviation = #L_ReProgramRS_HyperFuelAbv
	density = 0.00515
	unitCost = 1.35
	hsp = 2490 // 2970
	flowMode = STACK_PRIORITY_SEARCH
	transfer = PUMP
	isTweakable = true
	volume = 5
	RESOURCE_DRAIN_DEFINITION {
		isDrainable = true
		showDrainFX = true
		drainFXPriority = 7
		drainForceISP = 5
		drainFXDefinition = gasDraining
	}
}
RESOURCE_DEFINITION {
	name = HyperDizer
	displayName = #L_ReProgramRS_HyperDizer
	abbreviation = #L_ReProgramRS_HyperDizerAbv
	density = 0.00635
	unitCost = 1.075
	hsp = 1922 // 2292
	flowMode = STACK_PRIORITY_SEARCH
	transfer = PUMP
	isTweakable = true
	volume = 5
	RESOURCE_DRAIN_DEFINITION {
		isDrainable = true
		showDrainFX = true
		drainFXPriority = 7
		drainForceISP = 5
		drainFXDefinition = gasDraining
	}
}

// Allow resource drain of Intake Air and Solid Fuel
@RESOURCE_DEFINITION[IntakeAir]:FOR[zzzReProgram] {
	@RESOURCE_DRAIN_DEFINITION {
		%isDrainable = true
		%showDrainFX = true
		%drainFXPriority = 5
		%drainForceISP = 5
		%drainFXDefinition = gasDraining
	}
}
@RESOURCE_DEFINITION[SolidFuel]:FOR[zzzReProgram] {
	@RESOURCE_DRAIN_DEFINITION {
		%isDrainable = true
		%showDrainFX = true
		%drainFXPriority = 7
		%drainForceISP = 5
		%drainFXDefinition = particlesDraining
	}
}

//	Rename basic resources (as well as Liquid Hydrogen)
@RESOURCE_DEFINITION[LiquidFuel]:AFTER[zzzReProgram] {
	@displayName = #L_ReProgramRS_LiquidFuel
	@abbreviation = #L_ReProgramRS_LiquidFuelAbv
}
@RESOURCE_DEFINITION[Oxidizer]:AFTER[zzzReProgram] {
	@displayName = #L_ReProgramRS_Oxidizer
	@abbreviation = #L_ReProgramRS_OxidizerAbv
}
@RESOURCE_DEFINITION[MonoPropellant]:AFTER[zzzReProgram] {
	@displayName = #L_ReProgramRS_MonoPropellant
	@abbreviation = #L_ReProgramRS_MonoPropellantAbv
}
@RESOURCE_DEFINITION[LqdHydrogen]:AFTER[zzzReProgram] {
	@displayName = #L_ReProgramRS_LqdHydrogen
	@abbreviation = #L_ReProgramRS_LqdHydrogenAbv
}


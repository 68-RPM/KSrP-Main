@AGENT[Kerlington?Model?Rockets?and?Paper?Products?Inc]:FOR[zzyReProgram] {
	@title = #L_ReProgramA_Kerl
	%description = #L_ReProgramA_KerlBlurb
}
@PART[seatExternalCmd|mk1pod_v2|Mk2Pod|mk1-3pod]:FOR[zzyReProgram] {
	%manufacturer = #L_ReProgramA_Kerl
}
@PART[radialDrogue|parachuteDrogue|parachuteSingle|parachuteRadial|parachuteLarge]:FOR[zzyReProgram] {
	%manufacturer = #L_ReProgramA_Kerl
}
@PART[solidBooster_sm_v2|solidBooster_v2|Mite|Shrimp]:FOR[zzyReProgram] {
	%manufacturer = #L_ReProgramA_Kerl
}
// Command pods
@PART[mk1pod_v2]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_mk1pod_v2
	@MODULE[ModulePartVariants]:NEEDS[ReStock] {
		@baseVariant = GrayAndWhite
	}
}
@PART[Mk2Pod]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_Mk2Pod
}
@PART[mk1-3pod]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_mk1-3pod
}
// SRBs
@PART[solidBooster_sm_v2]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_solidBooster_sm_v2
}
@PART[solidBooster_v2]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_solidBooster_v2
	@MODULE[ModulePartVariants]:NEEDS[ReStock] {
		@baseVariant = YellowAndWhite
	}
}
@PART[Mite]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_Mite
}
@PART[restock-srb-mallet-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_restock-srb-mallet-1
	%category = Engine
	%TechHidden = False
	%manufacturer = #L_ReProgramA_Kerl
}
@PART[Shrimp]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_Shrimp
}
@PART[restock-srb-striker-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@title = #L_ReProgramPT_restock-srb-striker-1
	%category = Engine
	%TechHidden = False
	%manufacturer = #L_ReProgramA_Kerl
}

// Cleanup
!AGENT[FreeFall?Parachutes]:FINAL {} // All parachutes are now Kerlington, FreeFall is apocryphal [KSPCF]
!PART[restock-mk2-pod]:NEEDS[ReStockPlus]:FINAL {} // Redundant Mk2 Pod [Restock+]


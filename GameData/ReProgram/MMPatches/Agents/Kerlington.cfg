	en-us {
		// Agency
	#L_ReProgramA_Kerl = Kerlington Model Rockets and Paper Products, Inc.
	// #L_ReProgramA_KerlAgent = Kerlington Model Rockets and Paper Products, Incorporated
	#L_ReProgramA_KerlBlurb = Kerlington has a long history of introducing ground-breaking new technologies, many of which are now considered indispensable for rocketry and aerospace engineering. This has fostered a strong community of loyal Kerlington fans, as well as a similarly large group of disgruntled competitors.
		// Aero
	#L_ReProgramPD_basicFin
	#L_ReProgramPD_winglet
	#L_ReProgramPD_R8winglet
	#L_ReProgramPD_winglet3
		// Capsules
	#L_ReProgramPT_mk1pod_v2 = Command Pod Mk1
	#L_ReProgramPT_Mk2Pod = Command Pod Mk2
	#L_ReProgramPT_Mark1-2Pod = Command Pod Mk1-20
	#L_ReProgramPT_mk1-3pod = Command Pod Mk1-25
	#L_ReProgramPD_seatExternalCmd
		// Parachutes
	#L_ReProgramPD_parachuteDrogue
	#L_ReProgramPD_parachuteLarge
	#L_ReProgramPD_parachuteRadial
	#L_ReProgramPD_parachuteSingle
	#L_ReProgramPD_radialDrogue
		// SRBs
	#L_ReProgramPT_Mite = RT-FM1 ‘Mite’ Solid Rocket Booster

	%manufacturer = #L_ReProgramA_Dink
}
@PART[lGripPad|lGripStrip|mGripPad|sGripPad|sGripStrip|groundLight1|groundLight2]:AFTER[zzzReProgram] {
	%manufacturer = #L_ReProgramA_Dink
}
// Lights
@PART[groundLight1]:AFTER[zzzReProgram] {
	@title = #L_ReProgramPT_groundLight1
}
@PART[groundLight2]:AFTER[zzzReProgram] {
	@title = #L_ReProgramPT_groundLight2
}

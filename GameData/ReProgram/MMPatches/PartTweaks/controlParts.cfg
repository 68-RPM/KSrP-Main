// -- Reaction Wheels --
// KSRP
//	Wheel nerf, but not as much as, say, Skyhawk, SETI
//	Kerbal Witchery, or MandatoryRCS -- slightly more
//	magic angular momentum hax is retained than them
// (was 0.01)
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],![#TAGS[*aero*]]]:NEEDS[!MandatoryRCS]:FOR[zzzReProgram] {
	@MODULE[ModuleReactionWheel] {
		@PitchTorque *= 0.01125
		@RollTorque *= 0.01125
		@YawTorque *= 0.01125
	}
}
// If we're a plane cockpit, nuke torque more! 
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@[#TAGS[*aero*]]:HAS[#CrewCapacity[>0]]]:NEEDS[!MandatoryRCS]:FOR[zzzReProgram] {
	@MODULE[ModuleReactionWheel] {
		@PitchTorque *= 0.0075
		@RollTorque *= 0.0075
		@YawTorque *= 0.0075
	}
}
// If we're a probe core, forgive torque loss...
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@MODULE[ModuleCommand]:HAS[#CrewCapacity[<0]]]:NEEDS[!MandatoryRCS]:AFTER[zzzReProgram] {
	@MODULE[ModuleReactionWheel] {
		@PitchTorque *= 2.5
		@RollTorque *= 2.5
		@YawTorque *= 2.5
	}
}

// Mk1 Command Pod
// KSrP
// The part's price is increased
@PART[mk1pod_v2]:FOR[zzzReProgram] {
	@cost = 700
}

// Mk2 Command Pod
// KSRP
// + Now has a proper Monoprop reserve as it does in RS+ (bugfix)
// - Nerf its skinMaxTemp by 100 kelvin (rebalance)
// - Nerf its maxTemp by half (bugfix)
// - Nerf its Electric Charge (rebalance)
@PART[Mk2Pod]:FOR[zzzReProgram] {
	%maxTemp = 1300
	%skinMaxTemp = 2300
	@RESOURCE[ElectricCharge] {
		%amount = 125
		%maxAmount = 125
	}
	RESOURCE {
		name = MonoPropellant
		amount = 20
		maxAmount = 20
	}
}

// Mk1-3 Command Pod
// KSRP
// + Increased charge to the Mk2 Pod's stock EC level
// + Also made 0.1 lighter
@PART[mk1-3pod]:FOR[zzzReProgram] {
	@mass = 2.5
	@RESOURCE[ElectricCharge] {
		@amount = 200
		@maxAmount = 200
	}
}

// ++ Mk1 Lander-Can ++
// KSRP
// + Cheaper, contains more monoprop
@PART[landerCabinSmall]:FOR[zzzReProgram] {
	@cost = 1400
	@RESOURCE[MonoPropellant] {
		@amount = 20
		@maxAmount = 20
	}
}

// Mk2 Lander-Can
// KSRP
// + Better reaction wheel power draw
// - Weaker reaction wheels
@PART[mk2LanderCabin_v2]:BEFORE[zzzReProgram] {
	@MODULE[ModuleReactionWheel] {
		PitchTorque = 11
		@RollTorque = 11
		@YawTorque = 11
		@RESOURCE {
			@rate = 0.62
		}
	}
}

// ++ Hitchhiker container ++
// KSRP
// 15% sale
@PART[crewCabin]:FOR[zzzReProgram] {
	@cost = 3400
}

// ++ RCS Thrusters ++
// Source: Stageable RCS
// RCS jets can now be controlled in the editor and use their old icon
@PART[*]:HAS[@MODULE[ModuleRCS],!MODULE[ModuleEngines*],!MODULE[ModuleDecouple],~stagingIcon[]]:FOR[zzzReProgram] {
	%stagingIcon = RCS_MODULE
}
@PART[*]:HAS[@MODULE[ModuleRCS],~rcsNoStage[]]:FOR[SRCS] {
	@MODULE[ModuleRCS] {
		%stagingEnabled = True
		%stagingToggleEnabledEditor = True
		%rcsEnabled = False
	}
}
@PART[*]:HAS[@MODULE[ModuleRCSFX],!MODULE[ModuleEngines*],!MODULE[ModuleDecouple],~stagingIcon[]]:FOR[SRCS] {
	%stagingIcon = RCS_MODULE
}
@PART[*]:HAS[@MODULE[ModuleRCSFX],~rcsNoStage[]]:FOR[SRCS] {
	@MODULE[ModuleRCSFX] {
		%stagingEnabled = True
		%stagingToggleEnabledEditor = True
		%rcsEnabled = False
	}
}

// -- Gee forces --
// Source: WYG
// Now universally lower
@PART[*]:HAS[#CrewCapacity[>0],]:FOR[zzzReProgram] {
	%gTolerance = 8
}
@PART[*]:HAS[#CrewCapacity[>0]:HAS[#tags[*aero*]]]:FOR[zzzReProgram] {
	%gTolerance = 24
}

// ++ Pilots ++
// Source: Fuel Efficient Pilots
//	Shallower version of Fuel Efficient Pilots' curve.
// 	I think magic fuel efficiency is cheat-y, there is
// 	very little forgiveness in space. But, it's a nice
//	gameplay bonus, so we can keep it, and simply make
//	the curve shallower than the original mod had it @
@EXPERIENCE_TRAIT[Pilot]:NEEDS[Squad]:FOR[zzzReProgram] {
	%EFFECT[FuelUsage] {
		%modifiers = 0.995, 0.97, 0.955, 0.94, 0.925
	}	
}

// -- Kerbals --
// KSRP
// Temperature limits are lowered, so survivability is now more conditional
@PART[kerbalEVA|kerbalEVA*]:FOR[zzzReProgram] {
	@maxTemp = 310		// Slightly above the wet-bulb survivability limit. Why? Suit cooling rly good ig
	@skinMaxTemp = 620	// maxTemp * 2; around the point an EVA suit would start having exterior failures
}

// ++ Mark 2 plane parts ++
// Source: OCCULT
// Weight reduction
@PART[mk2SpacePlaneAdapter|mk2_1m_AdapterLong|mk2_1m_Bicoupler|adapterSize2-Mk2]:FOR[zzzReProgram] {
	@mass *= 0.95
}
@PART[mk2FuselageShortLFO|mk2FuselageLongLFO|mk2FuselageShortLiquid|mk2Fuselage|mk2FuselageShortMono]:FOR[zzzReProgram] {
	@mass *= 0.95
}
@PART[mk2DroneCore|mk2Cockpit_Standard|mk2Cockpit_Inline|mk2CrewCabin]:FOR[zzzReProgram] {
	@mass *= 0.95
}
@PART[mk2DockingPort|mk2CargoBayS|mk2CargoBayL]:FOR[zzzReProgram] {
	@mass *= 0.95
}
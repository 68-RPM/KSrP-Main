// ~~ Skipper nozzles ~~
// Citations:
// Engine Tweaks for Making History
// Eve Optimized Engines
@PART[engineLargeSkipper_v2]:NEEDS[B9PartSwitch]:FOR[zREPROGRAM_core] {
	@description ^= :$: <br><color="KSPYellowishGreen">This engine has multiple performance options.</color><br><i><color="KSPUnnamedCyan">This engine has an</i> <b>η</b><i>-variant!</color></i>
	@tags ^= :$: lh2 hydrolox hydrogen
	MODULE {
		name = ModuleB9PartSwitch
		switcherDescription = Engine Config
		switcherDescriptionPlural = Engine Configs
		affectDragCubes = False
		affectFARVoxels = False
		moduleID = engineSwitch
		SUBTYPE {
			name = Kerolox
			title = Kerolox
			primaryColor = #6B5D44
			secondaryColor = #6B5D44
			descriptionSummary = The stock Kerolox version
			defaultSubtypePriority = 1
		}
	 	SUBTYPE {
			name = Hydrolox
			title = Hydrolox
			primaryColor = #53686F
			secondaryColor = #53686F
			descriptionSummary = Hydrolox version
			defaultSubtypePriority = 0
			addedMass = 0.85
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					maxThrust = 850
					PROPELLANT {
						name = LqdHydrogen
						ratio = 1.5
						DrawGauge = True
					}
					PROPELLANT {
						name = Oxidizer
						ratio = 0.1
					}
					atmosphereCurve {
						key = 0 430 0 0
						key = 1 372 0 0
						key = 4 285 0 0	
					}
				}
			}
		}
	}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = engineNozzleVariant
		switcherDescription = Nozzle Variant
		switcherDescriptionPlural = Nozzle Variants
		SUBTYPE {
			name = skipper1
			title = Skipper™ Standard
			primaryColor = KSPMellowYellow
			secondaryColor = AlmostBlack
			descriptionSummary = With the RE-I5 Skipper's Standard package, you can soar to the skies with a joule output higher than that of some large cities.
			descriptionDetail = <i>(The standard model of the Skipper engine.)</i>
			defaultSubtypePriority = 2
		}
		SUBTYPE {
			name = skipper2
			title = Skipper™ Premium
			primaryColor = KSPNotSoGoodOrange
			secondaryColor = Ivory
			descriptionSummary = With the RE-I5 Skipper Premium package, your rocket could possibly exceed the power output of a major metropolitan area!
			descriptionDetail = <i>(Increased thrust, mass, and cost.)</i>
			defaultSubtypePriority = 1
			addedmass = 0.5
			addedCost = 715
			MODULE {
				IDENTIFIER {
					name = ModuleEngines
				}
				DATA {
					maxThrust = 825
				}
			}
		}
		SUBTYPE {
			name = skipperEve
			title = Skipper™ <b>η</b>
			primaryColor = LightEggplant
			secondaryColor = LeafGreen
			descriptionSummary = Research and Development's own ‘Eta’ series of engine nozzles have been optimized for high-pressure atmospheres, and command a premium with that in mind—proceeds go to the ground crew's salaries.
			descriptionDetail = <i>(Decreased thrust and expansion ratio for Eve, Jool, and similar planets.)</i>
			defaultSubtypePriority = 0
			addedCost = 1200
			MODULE {
				IDENTIFIER {
					name = ModuleEngines
				}
				DATA {
					maxThrust = 553.5
				}
				DATA {
					atmosphereCurve {
						key = 0 272.5
						key = 1 265.5
						key = 5 235.5
						key = 10 199
						key = 38 0.001
					}
				}
			}
		}
	}
}


// ++ RCS ++
@PART[*]:HAS[@MODULE[ModuleRCSFX],!NAME[vernierEngine]]:FOR[zzzReProgram] {
	@EFFECTS {
		@running {
			@AUDIO {
				@clip = ReProgram/Sounds/RcsColdGas
			}
			@AUDIO_MULTI_POOL {
				@clip = ReProgram/Sounds/RcsColdGas
			}
		}
	}
}

// ++ Parts with flags ++
// KSRP
// Flag toggles are removed. They are ugly, & their
// job is done infinitely better by Conformal Decals
@PART[*]:HAS[!NAME[flag],!NAME[kerbalEVA*],@MODULE[FlagDecal]]:BEFORE[zzzReProgram] {
	MODULE {
		name = ModuleB9DisableTransform
		transform = #$/MODULE[FlagDecal]/textureQuadName$
	}
}
@PART[*]:HAS[@MODULE[ModuleB9DisableTransform,FlagDecal]]:FOR[zzzReProgram] {
	!MODULE[FlagDecal] {}
}
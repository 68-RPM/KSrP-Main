// ++ RCS ++
@PART[*]:HAS[@MODULE[ModuleRCSFX],!NAME[vernierEngine]]:FOR[zzzReProgram] {
  @EFFECTS {
	@running {
	  @AUDIO {
		@clip = ReProgram/Sounds/RcsColdGas
	  }
	  @AUDIO_MULTI_POOL {
		@clip = ReProgram/Sounds/RcsColdGas
	  }
	}
  }
}

// ++ Parts with flags ++
// KSRP
// Flag toggles are removed. They are ugly, & their
// job is done infinitely better by Conformal Decals
@PART[*]:HAS[@MODULE[FlagDecal],!MODULE[InternalCameraSwitch]]:FOR[zzzReProgram] {
  MODULE {
	name = ModuleB9DisableTransform
	transform = flag
	transform = Flag
	transform = FLAG
	transform = FLAG01
	transform = FLAG02
	transform = flagdecal
	transform = flagDecal
	transform = FlagDecal
	transform = flagobj
	transform = flagObj
	transform = FlagObj
	transform = flagtransform
	transform = flagTransform
	transform = FlagTransform
	transform = kbEVA_flagDecals
  }
  !MODULE[FlagDecal] {}
}
// ~~ Mastodon nozzles ~~
// Citations:
// Engine Tweaks for Making History
@PART[LiquidEngineKE-1]:NEEDS[B9PartSwitch,ReStock]:FOR[zzzReProgram] {
	@description ^= :$: <br><color="KSPYellowishGreen">This engine has multiple performance options.</color>
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = engineNozzleVariant
		switcherDescription = Nozzle Variant
		switcherDescriptionPlural = Nozzle Variants
		SUBTYPE {
			name = mastodon1
			title = Mastodon A
			primaryColor = KSPMellowYellow
			secondaryColor = AlmostBlack
			descriptionSummary = The KE-1 engine, built exactly to design. It's not quite as powerful as we expected, however.
			descriptionDetail = (The standard model of the Mastodon engine.)
			defaultSubtypePriority = 1
		}
		SUBTYPE {
			name = mastodon2
			title = Mastodon B
			primaryColor = KSPNotSoGoodOrange
			secondaryColor = Ivory
			descriptionSummary = Our original KE-1 design was built to exact specifications, but we can do better than that—this version is built using our assembly team's notes and tweaks, which we fortunately rescued from the paper shredder at the last second. 
			descriptionDetail = <i>(Increased thrust, mass, and cost.)</i>
			defaultSubtypePriority = 0
			addedMass = 0.7
			addedCost = 500
			MODULE {
				IDENTIFIER {
					name = ModuleEngines
				}
				DATA {
					maxThrust = 1475
					atmosphereCurve
					{
					key = 0 300
					key = 1 285
					key = 14.5 0.001
					}
				}
			}
		}
	}
}


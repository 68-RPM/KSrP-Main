// ~~ Mammoth nozzles ~~
// Citations:
// Cryogenic Engines
@PART[Size3EngineCluster]:NEEDS[B9PartSwitch,CryoEngines,Restock]:FOR[zzzReProgram] {
	@description ^= :$: <br><color="KSPYellowishGreen">This engine has multiple performance options.</i>
	@tags ^= :$: lh2 hydrolox hydrogen
	MODULE {
		name = ModuleB9PartSwitch
		switcherDescription = Engine Config
		switcherDescriptionPlural = Engine Configs
		affectDragCubes = False
		affectFARVoxels = False
		moduleID = engineSwitch
		SUBTYPE {
			name = Kerolox
			title = Kerolox
			primaryColor = #6B5D44
			secondaryColor = #6B5D44
			descriptionSummary = The stock Kerolox version
			defaultSubtypePriority = 1
		}
	 	SUBTYPE {
			name = Hydrolox
			title = Hydrolox
			primaryColor = #53686F
			secondaryColor = #53686F
			descriptionSummary = Hydrolox version
			defaultSubtypePriority = 0
			addedMass = -0.2
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					maxThrust = 4000
					PROPELLANT {
						name = LqdHydrogen
						ratio = 1.5
						DrawGauge = True
					}
					PROPELLANT {
						name = Oxidizer
						ratio = 0.1
					}
					atmosphereCurve {
						key = 0 416 0 0
						key = 1 362 0 0
						key = 4 285 0 0
					}
				}
			}
		}
	}
}


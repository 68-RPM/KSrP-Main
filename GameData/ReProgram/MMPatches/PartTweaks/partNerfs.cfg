// -- Reaction Wheels --
// KSRP
//	Wheel nerf, but not as much as, say, Skyhawk, SETI
//	Kerbal Witchery, or MandatoryRCS -- slightly more
//	magic angular momentum hax is retained than them
// (was 0.01)
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],!PROPELLANT[IntakeAtm]]:NEEDS[!MandatoryRCS]:FOR[zzyReProgram] {
	@MODULE[ModuleReactionWheel] {
	@PitchTorque *= 0.01125
	@RollTorque *= 0.01125
	@YawTorque *= 0.01125
	}
}
// If we're a plane cockpit, nuke torque more! 
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@PROPELLANT[IntakeAtm],#CrewCapacity[>0]]:NEEDS[!MandatoryRCS]:FOR[zzyReProgram] {
	@MODULE[ModuleReactionWheel] {
	@PitchTorque *= 0.0075
	@RollTorque *= 0.0075
	@YawTorque *= 0.0075
	}
}
// If we're a probe core, forgive torque loss...
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@MODULE[ModuleCommand],#CrewCapacity[<0]]:NEEDS[!MandatoryRCS]:AFTER[zzyReProgram] {
	@MODULE[ModuleReactionWheel] {
	@PitchTorque *= 3
	@RollTorque *= 3
	@YawTorque *= 3
	}
}

// ++ Solid Rockets ++
// KSRP
// Sepratrons now spool up, and
// launch escape towers as well
@PART[sepMotor1|Size1p5_Tank_05]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines] {
		@engineAccelerationSpeed = 1.7
	}
}
@PART[LaunchEscapeSystem|restock-engine-les-2]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines] {
		@engineAccelerationSpeed = 0.85
	}
}

// -- Heat Shields --
// Source: Weaker Heat Shields, Improved Ablator
//	Ablator nerf, but not as much as Weaker Heat Shields (was 0.2)
//	Temperature limits from Weaker Heat Shields & Improved Ablator
@PART[*]:HAS[@RESOURCE[Ablator],!NAME[kv1Pod|kv2Pod|kv3Pod]]:FOR[zzyReProgram] {
	%maxTemp = 2400
	%skinMaxTemp = 2800
	@RESOURCE[Ablator] {
		@Amount *= 0.375
		@maxAmount *= 0.375
	}
}
// KSRP
// The Making History capsules are manually rebalanced
// as the Heat Shield blanket patch gives them too
// little ablator. We give each tier of the capsule
// a little more ablator than the last, and revise
// the temperature limits of all of them
@PART[kv1Pod|kv2Pod|kv3Pod]:FOR[zzyReProgram] {
	%maxTemp = 1900
	%skinMaxTemp = 2600
}
@PART[kv1Pod]:FOR[zzyReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 10
		@maxAmount = 10
	}
}
@PART[kv2Pod]:FOR[zzyReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 10.5
		@maxAmount = 10.5
	}
}
@PART[kv3Pod]:FOR[zzyReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 11
		@maxAmount = 11
	}
}

// -- Mk2 Command Pod --
// KSRP
// The Mk2 Command Pod has a glaring
// oversight in that it has the same
// interior and exterior temperature
// limit. We nerf its skinMaxTemp by
// 100 kelvin and its maxTemp is all
// the way down to 1300, which makes
// it halfway between Mk1 - Mk1-3
// Its charge reserves are also
// reduced from their previous 200
@PART[Mk2Pod]:FOR[zzyReProgram] {
	%maxTemp = 1300
	%skinMaxTemp = 2300
	@RESOURCE[ElectricCharge] {
		%amount = 125
		%maxAmount = 125
	}
}

// -- Kerbals --
// KSRP
// Temperature limits are lowered, so survivability is now more conditional
@PART[kerbalEVA|kerbalEVA*]:FOR[zzyReProgram] {
	@maxTemp = 310		// Slightly above the wet-bulb survivability limit, suit cooling makes it alright
	@skinMaxTemp = 620	// maxTemp * 2; around the point an EVA suit would start having exterior failures
}

// -- Photovoltaic Panels --
// Source: No More OPs
// Electric charge gain rate is reduced at a rate
// slightly higher than that of "No More OPs" (was 0.08)
@PART[*]:HAS[@MODULE[ModuleDockingNode]]:FOR[zzyReProgram] {
	@MODULE[ModuleDeployableSolarPanel] {
		@OUTPUT_RESOURCE[ElectricCharge] {
			@rate *= 0.09375
		}
	}
}

// -- Docking Ports --
// Source: Kerbealistic Docking
// Capture force is nerfed as in
// RO and Kerbealistic Docking
@PART[*]:HAS[@MODULE[ModuleDockingNode]]:FOR[zzyReProgram] {
	@MODULE[ModuleDockingNode] {
		%acquireForce = 0.3
		%acquireMinFwdDot = 0.8
		%acquireminRollDot = -3.40282347E+38
		%acquireRange = 0.175
		%acquireTorque = 0.3
		%captureMaxRvel = 0.1
		%captureMinFwdDot = 0.998
		%captureMinRollDot = -3.40282347E+38
		%captureRange = 0.05
		%minDistanceToReEngage = 1.25
		%undockEjectionForce = 0.1
	}
}

// -- ReStock Plus SRBs --
// KSRP
// These soft-deprecated boosters have much stronger thrust
// than the next size up, and a heat production discrepancy
// compared to the stock SRB. We balance them accordingly.
@PART[restock-srb-mallet-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines*] {
		@minThrust = 0
		@maxThrust = 21.25
		@heatProduction = 550
	}
}
@PART[restock-srb-striker-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines*] {
		@minThrust = 0
		@maxThrust = 42.5
		@heatProduction = 550
	}
}
@PART[restock-srb-anvil-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines*] {
		@minThrust = 0
		@maxThrust = 1500
		@heatProduction = 550
	}
}
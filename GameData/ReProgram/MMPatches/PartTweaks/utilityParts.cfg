// ++ Strut Connectors ++
// KSRP
//	Additional reach, now 12.5 (was 10)
//	Stability stops for no Kerbal, these
//	strut connector beams don't flex any-
//	-ways so I'm sure slightly less cred-
//	-ible beam reach is totally alright.
@PART[*]:HAS[@MODULE[CModuleStrut]]:FOR[zzzReProgram] {
	@maxLength *= 1.25
}

// ++ Fuel Ducts ++
// KSRP
//	Additional reach, now 11.25 (was 10)
//	Slightly less just so we aren't asparagus-
//	-haxing all over the place with big lines
@PART[*]:HAS[@MODULE[CModuleFuelLine]]:FOR[zzzReProgram] {
	@maxLength *= 1.125
}

// ++ Launch Clamps ++
// Source: Free Launch Clamps
// Now completely free, and have a higher temperature limit
// as well as providing a steady input of Electric Charge
@PART[*]:HAS[@MODULE[*LaunchClamp]]:FOR[zzzReProgram] {
	@cost = 0
	@maxTemp = 3840
	MODULE {
		name = ModuleGenerator 
		isAlwaysActive = true
		isGroundFixture = true
		OUTPUT_RESOURCE {
			name = ElectricCharge
			rate = 1
		}
	}
}

// -- Photovoltaic Panels --
// Source: No More OPs
// Electric charge gain rate is reduced at a rate
// slightly higher than that of "No More OPs" (was 0.08)
@PART[*]:HAS[@MODULE[ModuleDockingNode]]:FOR[zzzReProgram] {
	@MODULE[ModuleDeployableSolarPanel] {
		@OUTPUT_RESOURCE[ElectricCharge] {
			@rate *= 0.09375
		}
	}
}

// -- Docking Ports --
// Source: Kerbealistic Docking
// Capture force is nerfed as in
// RO and Kerbealistic Docking
@PART[*]:HAS[@MODULE[ModuleDockingNode]]:FOR[zzzReProgram] {
	@MODULE[ModuleDockingNode] {
		%acquireForce = 0.3
		%acquireMinFwdDot = 0.8
		%acquireminRollDot = -3.40282347E+38
		%acquireRange = 0.175
		%acquireTorque = 0.3
		%captureMaxRvel = 0.1
		%captureMinFwdDot = 0.998
		%captureMinRollDot = -3.40282347E+38
		%captureRange = 0.05
		%minDistanceToReEngage = 1.25
		%undockEjectionForce = 0.1
	}
}

// -- Heat Shields --
// Source: Weaker Heat Shields, Improved Ablator
//	Ablator nerf, but not as much as Weaker Heat Shields (was 0.2)
//	Temperature limits from Weaker Heat Shields & Improved Ablator
@PART[*]:HAS[@RESOURCE[Ablator],!NAME[kv1Pod|kv2Pod|kv3Pod]]:FOR[zzzReProgram] {
	%maxTemp = 2400
	%skinMaxTemp = 2800
	@RESOURCE[Ablator] {
		@Amount *= 0.375
		@maxAmount *= 0.375
	}
}
// KSRP
// The Making History capsules are manually rebalanced
// as the Heat Shield blanket patch gives them too
// little ablator. We give each tier of the capsule
// a little more ablator than the last, and revise
// the temperature limits of all of them
@PART[kv1Pod|kv2Pod|kv3Pod]:FOR[zzzReProgram] {
	%maxTemp = 1900
	%skinMaxTemp = 2600
}
@PART[kv1Pod]:FOR[zzzReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 10
		@maxAmount = 10
	}
}
@PART[kv2Pod]:FOR[zzzReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 10.5
		@maxAmount = 10.5
	}
}
@PART[kv3Pod]:FOR[zzzReProgram] {
	@RESOURCE[Ablator] {
		@Amount = 11
		@maxAmount = 11
	}
}

// ++ Parachutes ++
// Source: Stock Autocut Drogues
// Drogue parachutes will automatically give way
// when your main parachutes deploy -- nice!
@PART[radialDrogue|parachuteDrogue]:NEEDS[KSPCommunityPartModules&!RealChute]:FOR[zzzReProgram] {
	MODULE {
		name = ModuleAutoCutDrogue
		isDrogueChute = true
	}
}
@PART[parachuteSingle|parachuteLarge|parachuteRadial]:NEEDS[KSPCommunityPartModules&!RealChute]:FOR[zzzReProgram] {
	MODULE {
		name = ModuleAutoCutDrogue
	}
}


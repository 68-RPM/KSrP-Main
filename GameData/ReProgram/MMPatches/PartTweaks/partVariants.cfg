// <| Labrador Engine |>
// Poodle Engine's aesthetic variant is made into a new engine

@PART[liquidEngine2-2_v2]:AFTER[zzzReProgram] {
	@title = #L_ReProgramPTp_liquidEngine2-2_v2
	@description = #L_ReProgramPDp_liquidEngine2-2_v2
}

+PART[liquidEngine2-2_v2]:FOR[zzzReProgram] {
    @name = liquidEngine2-2_v2-b2
    @title = #L_ReProgramPT_liquidEngine2-2_v2-b2
    @description = #L_ReProgramPD_liquidEngine2-2_v2-b2
	@entryCost = 9100
	@cost = 3300
    @mass = 2.5
    @MODULE[ModuleEngines*] {
		@maxThrust = 450
		-atmosphereCurve,* {}
		atmosphereCurve {
		    key = 0 335
		    key = 1 185
		    key = 3 0.001
		}
    }
}

@PART[liquidEngine2-2_v2]:FOR[zzzReProgram]:NEEDS[ReStock] {
	@MODULE[ModulePartVariants] {
		!VARIANT[TwoBell],* {}
		!VARIANT[Compact],* {}
		!VARIANT[TwoBell_Alternate],* {}
		!VARIANT[Compact_Alternate],* {}
		@VARIANT,* {
			@displayName ^= :Single \(:2.5m (:
			@displayName ^= :Single::
		}
	}
}

@PART[liquidEngine2-2_v2-b2]:FOR[zzzReProgram]:NEEDS[ReStock] {
	@MODULE[ModulePartVariants] {
		!VARIANT[SingleBell],* {}
		!VARIANT[SingleBell-Alt],* {}
		!VARIANT[SingleBell-Compact],* {}
		!VARIANT[SingleBell-Compact-Alt],* {}
		@VARIANT,* {
			@displayName ^= :Quad \(:2.5m (:
			@displayName ^= :Quad::
		}
	}
}

@PART[restock-engine-375-corgi]:NEEDS[ReStockPlus]:AFTER[zzzReProgram] {
	@title = #L_ReProgramPTp_restock-engine-375-corgi
}

@PART[LiquidEngineLV-TX87]:FOR[zzzReProgram] {
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = engineFuelVariant
		switcherDescription = Fuel Variant
		switcherDescriptionPlural = Fuel Variants
		SUBTYPE {
			name = StdBob
			title = Kerosene
			primaryColor = Azure
			secondaryColor = White
			descriptionSummary = Test
			descriptionDetail = Test
			defaultSubtypePriority = 1
		}
		SUBTYPE {
			name = HypBob
			title = Aerozine
			primaryColor = Amethyst
			secondaryColor = White
			descriptionSummary = Test
			descriptionDetail = Test
			defaultSubtypePriority = 0
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				PROPELLANT {
					name = HyperFuel
					ratio = 0.9
					DrawGauge = True
				}
				PROPELLANT {
					name = HyperDizer
					ratio = 1.1
				}
			}
		}
	}
}
// ++ Parachutes ++
// Source: Stock Autocut Drogues
// Drogue parachutes will automatically give way
// when your main parachutes deploy -- nice!
@PART[radialDrogue|parachuteDrogue]:NEEDS[KSPCommunityPartModules&!RealChute]:FOR[zzyReProgram] {
	MODULE {
		name = ModuleAutoCutDrogue
		isDrogueChute = true
	}
}
@PART[parachuteSingle|parachuteLarge|parachuteRadial]:NEEDS[KSPCommunityPartModules&!RealChute]:FOR[zzyReProgram] {
	MODULE {
		name = ModuleAutoCutDrogue
	}
}

// ++ RCS Thrusters ++
// Source: Stageable RCS
// RCS jets can now be controlled in the editor and use their old icon
@PART[*]:HAS[@MODULE[ModuleRCS],!MODULE[ModuleEngines*],!MODULE[ModuleDecouple],~stagingIcon[]]:FOR[zzyReProgram] {
	%stagingIcon = RCS_MODULE
}
@PART[*]:HAS[@MODULE[ModuleRCS],~rcsNoStage[]]:FOR[SRCS] {
	@MODULE[ModuleRCS] {
		%stagingEnabled = True
		%stagingToggleEnabledEditor = True
		%rcsEnabled = False
	}
}
@PART[*]:HAS[@MODULE[ModuleRCSFX],!MODULE[ModuleEngines*],!MODULE[ModuleDecouple],~stagingIcon[]]:FOR[SRCS] {
	%stagingIcon = RCS_MODULE
}
@PART[*]:HAS[@MODULE[ModuleRCSFX],~rcsNoStage[]]:FOR[SRCS] {
	@MODULE[ModuleRCSFX] {
		%stagingEnabled = True
		%stagingToggleEnabledEditor = True
		%rcsEnabled = False
	}
}

// ++ Mark 2 plane parts ++
// Source: OCCULT
// Weight reduction
@PART[mk2SpacePlaneAdapter|mk2_1m_AdapterLong|mk2_1m_Bicoupler|adapterSize2-Mk2]:FOR[zzyReProgram] {
	@mass *= 0.95
}
@PART[mk2FuselageShortLFO|mk2FuselageLongLFO|mk2FuselageShortLiquid|mk2Fuselage|mk2FuselageShortMono]:FOR[zzyReProgram] {
	@mass *= 0.95
}
@PART[mk2DroneCore|mk2Cockpit_Standard|mk2Cockpit_Inline|mk2CrewCabin]:FOR[zzyReProgram] {
	@mass *= 0.95
}
@PART[mk2DockingPort|mk2CargoBayS|mk2CargoBayL]:FOR[zzyReProgram] {
	@mass *= 0.95
}
// ++ Strut Connectors ++
// KSRP
//	Additional reach, now 12.5 (was 10)
//	Stability stops for no Kerbal, these
//	strut connector beams don't flex any-
//	-ways so I'm sure slightly less cred-
//	-ible beam reach is totally alright.
@PART[*]:HAS[@MODULE[CModuleStrut]]:FOR[zzyReProgram] {
	@maxLength *= 1.25
}

// ++ Fuel Ducts ++
// KSRP
//	Additional reach, now 11.25 (was 10)
//	Slightly less just so we aren't asparagus-
//	-haxing all over the place with big lines
@PART[*]:HAS[@MODULE[CModuleFuelLine]]:FOR[zzyReProgram] {
	@maxLength *= 1.125
}

// ++ Solid Rockets ++
// KSRP
// Heavy boosters now use the Thumper / Kickback accel
// Rather than the Hammer or Flea booster's acceleration
// 1.875 and 0.625 boosters now get 9 acceleration
// The deprecated 0.625 boosters are lighter
@PART[Thoroughbred|Clydesdale]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines*] {
		@engineAccelerationSpeed = 8.0
	}
}
@PART[Shrimp|SolidBoosterFM1|SolidBoosterTHK]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines*] {
		@engineAccelerationSpeed = 9.0
	}
}
@PART[restock-srb-mallet-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@mass = 0.1125
}
@PART[restock-srb-striker-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@mass = 0.225
}
@PART[restock-srb-mallet-1|restock-srb-striker-1|restock-srb-anvil-1]:NEEDS[ReStockPlus]:FOR[zzyReProgram] {
	@MODULE[ModuleEngines*] {
		@engineAccelerationSpeed = 9.0
	}
}

// ++ Pilots ++
// Source: Fuel Efficient Pilots
//	Shallower version of Fuel Efficient Pilots' curve.
// 	I think magic fuel efficiency is cheat-y, there is
// 	very little forgiveness in space. But, it's a nice
//	gameplay bonus, so we can keep it, and simply make
//	the curve shallower than the original mod had it @
@EXPERIENCE_TRAIT[Pilot]:NEEDS[Squad]:FOR[zzyReProgram] {
	%EFFECT[FuelUsage] {
		%modifiers = 0.995, 0.97, 0.955, 0.94, 0.925
	}	
}

// ++ Launch Clamps ++
// Source: Free Launch Clamps
// Now completely free, and have a higher temperature limit
// as well as providing a steady input of Electric Charge
@PART[*]:HAS[@MODULE[*LaunchClamp]]:FOR[zzyReProgram] {
	@cost = 0
	@maxTemp = 3840
	MODULE {
		name = ModuleGenerator 
		isAlwaysActive = true
		isGroundFixture = true
		OUTPUT_RESOURCE {
			name = ElectricCharge
			rate = 1
		}
	}
}

// ++ Mk2 Command Pod ++
// KSRP
// Now has a proper Monoprop
// reserve as it does in RS+
@PART[Mk2Pod]:FOR[zzyReProgram] {
	RESOURCE {
		name = MonoPropellant
		amount = 20
		maxAmount = 20
	}
}

// ++ Mk1-3 Command Pod ++
// KSRP
// Increased charge to the 2
// Pod's amount, the Mk2 has
// been nerfed to compense
// Also made 0.1 lighter
@PART[mk1-3pod]:FOR[zzyReProgram] {
	@mass = 2.5
	@RESOURCE[ElectricCharge] {
		@amount = 200
		@maxAmount = 200
	}
}

// ++ Mk1 Lander-Can ++
// KSRP
// Cheaper, contains more monoprop
@PART[landerCabinSmall]:FOR[zzyReProgram] {
	@cost = 1400
	@RESOURCE[MonoPropellant] {
		@amount = 20
		@maxAmount = 20
	}
}

// ++ Mk2 Lander-Can ++
// KSRP
// Better reaction wheel power draw
@PART[mk2LanderCabin_v2]:BEFORE[zzyReProgram] {
	@MODULE[ModuleReactionWheel] {
		@RESOURCE {
			@rate = 0.62
		}
	}
}

// ++ Hitchhiker container ++
// KSRP
// 15% sale
@PART[crewCabin]:FOR[zzyReProgram] {
	@cost = 3400
}


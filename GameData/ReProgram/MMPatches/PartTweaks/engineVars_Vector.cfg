// ~~ Vector nozzles ~~
// Citations:
// Vector Repurposed
@PART[SSME]:NEEDS[B9PartSwitch,CommunityResourcePack]:FOR[zzzReProgram] {
	@description ^= :$: <br><color="KSPYellowishGreen">This engine has multiple performance options.</color>
	@tags ^= :$: lh2 hydrolox hydrogen
	MODULE {
		name = ModuleB9PartSwitch
		switcherDescription = Engine Config
		switcherDescriptionPlural = Engine Configs
		affectDragCubes = False
		affectFARVoxels = False
		moduleID = engineSwitch
		SUBTYPE {
			name = Kerolox
			title = Kerolox
			primaryColor = #6B5D44
			secondaryColor = #6B5D44
			descriptionSummary = The stock Kerolox version
			defaultSubtypePriority = 1
		}
	 	SUBTYPE {
			name = Hydrolox
			title = Hydrolox
			primaryColor = #53686F
			secondaryColor = #53686F
			descriptionSummary = Hydrolox version
			defaultSubtypePriority = 0
			MODULE {
				IDENTIFIER {
					name = ModuleEnginesFX
				}
				DATA {
					maxThrust = 900
					PROPELLANT {
						name = LqdHydrogen
						ratio = 1.5
						DrawGauge = True
					}
					PROPELLANT {
						name = Oxidizer
						ratio = 0.1
					}
					atmosphereCurve {
						key = 0 420 0 0
						key = 1 365 0 0
						key = 4 285 0 0	
					}
				}
			}
		}
	}
	MODULE {
		name = ModuleB9PartSwitch
		moduleID = engineNozzleVariant
		switcherDescription = Nozzle Variant
		switcherDescriptionPlural = Nozzle Variants
		SUBTYPE {
			name = vector1
			title = Vector A
			primaryColor = KSPNotSoGoodOrange
			secondaryColor = Ivory
			descriptionSummary = The KS-25 engine as originally designed; a powerhouse with trigger-happy gimbal.
			descriptionDetail = (The standard model of the Vector engine.)
			defaultSubtypePriority = 1
		}
		SUBTYPE {
			name = vector2
			title = Vector B
			primaryColor = KSPMellowYellow
			secondaryColor = AlmostBlack
			descriptionSummary = Our original KS-25 specification was designed for reusable orbiter vehicles. This build will refit the engine for ordinary rockets, and is comparatively modest.
			descriptionDetail = (Reduced thrust, mass, gimbal, and cost.)
			defaultSubtypePriority = 0
			addedMass = -2.2
			addedCost = -13500
			MODULE {
				IDENTIFIER {
					name = ModuleGimbal
				}
				DATA {
					gimbalRange = 2
					useGimbalResponseSpeed = false
				}
			}
			MODULE {
				IDENTIFIER {
					name = ModuleEngines
				}
				DATA {
					maxThrust = 450
				}
			}
		}
	}
}
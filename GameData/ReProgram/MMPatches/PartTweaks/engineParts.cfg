// Fuel Tanks
// + Now have Hypergolics
@PART[*]:HAS[@RESOURCE[LiquidFuel],@RESOURCE[Oxidizer],!MODULE[ModuleEngine*]]:NEEDS[!ModularFuelTanks,!RealFuels]:AFTER[zzzReProgram] {
	// Math to avoid breaking tank
	%LF = #$RESOURCE[LiquidFuel]/maxAmount$
	%OX = #$RESOURCE[Oxidizer]/maxAmount$
	%totalCap = #$RESOURCE[LiquidFuel]/maxAmount$
	@totalCap += #$RESOURCE[Oxidizer]/maxAmount$
		%massOffset = #$totalCap$
		@massOffset *= 0.000625 // standard dry mass per units of LF/OX
		@massOffset *= -1
			@LF *= #$@RESOURCE_DEFINITION[LiquidFuel]/unitCost$
			@OX *= #$@RESOURCE_DEFINITION[Oxidizer]/unitCost$
			%costOffset = #$LF$
			@costOffset += #$OX$
			@costOffset *= -1

	!RESOURCE[LiquidFuel|Oxidizer] {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]] {}

	MODULE {
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		switcherDescription = Fuel
		baseVolume = #$../totalCap$
		SUBTYPE {
			name = LF/O
			title = Kerolox
			tankType = LFOX
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = LiquidFuel
			title = Kerosene
			tankType = LF
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = Oxidizer
			title = Oxidizer
			tankType = OX
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = HF/HD
			title = Hypergolic
			tankType = HY
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = HyperFuel
			title = Aerozine
			tankType = HF
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
		SUBTYPE {
			name = HyperDizer
			title = Nitrogen Tetroxide
			tankType = HD
			addedMass = #$../../massOffset$
			addedCost = #$../../costOffset$
		}
	}
}

// Fuel Tanks
// Source: Skyhawk
// -- Now always have boiloff
@PART[*]:HAS[@MODULE[ModuleCryoTank]]:NEEDS[CryoTanks]:AFTER[zzz_CryoTanks] {
	@MODULE[ModuleCryoTank] {
		BOILOFFCONFIG {
			FuelName = Oxidizer
			BoiloffRate = 0.02
			CoolingCost = 0.01
		}
	}
}
@PART[*]:HAS[@Resource[Oxidizer],!MODULE[ModuleCryoTank],!MODULE[InterstellarFuelSwitch],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines],!MODULE[FSfuelSwitch],!MODULE[WBIConvertibleStorage],!MODULE[WBIResourceSwitcher]]:NEEDS[CryoTanks]:FOR[zzz_CryoTanks] {
	MODULE {
		name = ModuleCryoTank
		coolingEnabled = false
		BOILOFFCONFIG {
			FuelName = Oxidizer
			BoiloffRate = 0.02
			CoolingCost = 0.01
		}
	}
}
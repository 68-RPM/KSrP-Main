// -- Stock Solid Rockets --
// KSRP
// Sepratrons now spool up, and
// launch escape towers as well
@PART[sepMotor1|Size1p5_Tank_05]:FOR[zzzReProgram] {
	@MODULE[ModuleEngines] {
		@engineAccelerationSpeed = 1.7
	}
}
@PART[LaunchEscapeSystem|restock-engine-les-2]:FOR[zzzReProgram] {
	@MODULE[ModuleEngines] {
		@engineAccelerationSpeed = 0.85
	}
}

// -- ReStock Plus Solid Rockets --
// KSRP
// These soft-deprecated boosters have much stronger thrust
// than the next size up, and a heat production discrepancy
// compared to the stock SRB. We balance them accordingly.
@PART[restock-srb-mallet-1]:NEEDS[ReStockPlus]:FOR[zzzReProgram] {
	@MODULE[ModuleEngines*] {
		@minThrust = 0
		@maxThrust = 21.25
		@heatProduction = 550
	}
}
@PART[restock-srb-striker-1]:NEEDS[ReStockPlus]:FOR[zzzReProgram] {
	@MODULE[ModuleEngines*] {
		@minThrust = 0
		@maxThrust = 42.5
		@heatProduction = 550
	}
}
@PART[restock-srb-anvil-1]:NEEDS[ReStockPlus]:FOR[zzzReProgram] {
	@MODULE[ModuleEngines*] {
		@minThrust = 0
		@maxThrust = 1500
		@heatProduction = 550
	}
}

// -- Fuel Tanks --
// Source: Skyhawk
// Now always have boiloff
@PART[*]:HAS[@MODULE[ModuleCryoTank]]:NEEDS[CryoTanks]:AFTER[zzz_CryoTanks] {
	@MODULE[ModuleCryoTank] {
		BOILOFFCONFIG {
			FuelName = Oxidizer
			BoiloffRate = 0.02
			CoolingCost = 0.01
		}
	}
}
@PART[*]:HAS[@Resource[Oxidizer],!MODULE[ModuleCryoTank],!MODULE[InterstellarFuelSwitch],!MODULE[ModuleEnginesFX],!MODULE[ModuleEngines],!MODULE[FSfuelSwitch],!MODULE[WBIConvertibleStorage],!MODULE[WBIResourceSwitcher]]:NEEDS[CryoTanks]:AFTER[zzz_CryoTanks] {
	MODULE {
		name = ModuleCryoTank
		coolingEnabled = false
		BOILOFFCONFIG {
			FuelName = Oxidizer
			BoiloffRate = 0.02
			CoolingCost = 0.01
		}
	}
}
// ++ Solid Rockets ++
// KSRP
// Heavy boosters now use the Thumper / Kickback accel
// Rather than the Hammer or Flea booster's acceleration
// 1.875 and 0.625 boosters now get 9 acceleration
// The deprecated 0.625 boosters are lighter

@PART[Thoroughbred|Clydesdale]:AFTER[zzzReProgram] {
	@MODULE[ModuleEngines*] {
		@engineAccelerationSpeed = 8.0
	}
}
@PART[Shrimp|SolidBoosterFM1|SolidBoosterTHK]:AFTER[zzzReProgram] {
	@MODULE[ModuleEngines*] {
		@engineAccelerationSpeed = 9.0
	}
}
@PART[restock-srb-mallet-1]:NEEDS[ReStockPlus]:AFTER[zzzReProgram] {
	@mass = 0.1125
}
@PART[restock-srb-striker-1]:NEEDS[ReStockPlus]:AFTER[zzzReProgram] {
	@mass = 0.225
}
@PART[restock-srb-mallet-1|restock-srb-striker-1|restock-srb-anvil-1]:NEEDS[ReStockPlus]:AFTER[zzzReProgram] {
	@MODULE[ModuleEngines*] {
		@engineAccelerationSpeed = 9.0
	}
}


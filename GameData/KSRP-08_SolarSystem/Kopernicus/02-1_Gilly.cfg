				}
				Biome {
					name = Rilles
					displayName = Rilles
					color = RGBA(6, 0, 255, 255)
					value = 1
				}
			}
		}
		Orbit {
			referenceBody = Eve
			inclination = 12
			eccentricity = 0.55
			semiMajorAxis = 315000000
			@semiMajorAxis *= 0.1
			longitudeOfAscendingNode = 80
			argumentOfPeriapsis = 10
			meanAnomalyAtEpochD = 51.56

				VertexColorMapBlend {
					map = KSRP-08_Planets/Assets/Kopernicus/Gilly_Color.png
					blend = 1
					name = ColorMap
					order = 99999992
				}

				//Noise
				VertexHeightOblate {
					height = 4000
					pow = 8
					enabled = true
					order = 7

				}

				//Modifier
				FlattenOcean {
					oceanRadius = 1
					order = 9999
				}
			}

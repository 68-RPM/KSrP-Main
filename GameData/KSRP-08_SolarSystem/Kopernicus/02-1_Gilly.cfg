			Material {
				specColor = 0,0,0,0
				shininess = 0.03
				color = 1.2,1.2,1.2,0
				texture = KSRP-08_Planets/Assets/Kopernicus/Gilly_Color.png
				normals = KSRP-08_Planets/Assets/Kopernicus/Gilly_Normal.png
			}
		}
		PQS {
			fadeStart = 17000
			fadeEnd = 19000
			deactivateAltitude = 20000
			Mods {
				//Heightmaps
				VertexMitchellNetravaliHeightMap {
					map = KSRP-08_Planets/Assets/Kopernicus/Gilly_Height1.png
					offset = 500
					deformity = 4500
					scaleDeformityByRadius = False
					order = 6
					enabled = True
					name = _Height
				}
				VertexMitchellNetravaliHeightMap {
					map = KSRP-08_Planets/Assets/Kopernicus/Gilly_Height2.png
					offset = 0

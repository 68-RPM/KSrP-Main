				}
				Biome {
					name = Lowlands
					displayName = Lowlands
					color = RGBA(0, 0, 0, 255)
					value = 1
				}
				Biome {
					name = Midlands
					displayName = Midlands
					color = RGBA(49, 49, 49, 255)
					value = 1
				}
				Biome {
					name = Highlands
					displayName = Highlands
					color = RGBA(128, 128, 128, 255)
					value = 1
				}
				Biome {
					name = Equator
					displayName = Equatorial Highlands
					color = RGBA(199, 199, 199, 255)
					value = 1
				}
				Biome {
					name = Craters
					displayName = Craters
					color = RGBA(0, 255, 14, 255)

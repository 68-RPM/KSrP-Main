		identifier = Sun/Gilly
		Debug {
			update = True
		}
		Template {
			name = Gilly
			removePQSMods = VertexSimplexHeightAbsolute
		}
		Properties {
			radius = 130000
			@radius *= 0.1
			geeASL = 0.005
			rotates = True
			rotationPeriod = 28255
			tidallyLocked = False
			initialRotation = 5
			timewarpAltitudeLimits = 0 0 0 0 0 0 0 80000
			biomeMap = KSRP-08_Planets/Assets/Kopernicus/Gilly_Biomes.png
			Biomes {
				Biome {
					name = Mountains
					displayName = Mountains
					color = RGBA(141, 0, 0, 255)

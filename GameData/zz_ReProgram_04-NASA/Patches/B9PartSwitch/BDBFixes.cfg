@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@RESOURCE[LiquidFuel] {
		@name = Kerosene
		@amount *= 5.0173097
		@maxAmount *= 5.0173097
	}
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@amount *= 5.0173097
		@maxAmount *= 5.0173097
	}
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		@amount *= 3.9840637
		@maxAmount *= 3.9840637
	}
}

@PART[bluedog_XLR129]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX]:HAS[#engineID[BDB_XLR129_vac]] {
		@PROPELLANT[Oxidizer] {
			@name = LqdOxygen
			@ratio *= 4.3821209
		}
	}
}

@PART[bluedog_X15_SERJ_Engine]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX]:HAS[#engineID[ClosedCycle]] {
		@PROPELLANT[LiquidFuel] {
			@name = Kerosene
		}
		@PROPELLANT[Oxidizer] {
			@name = LqdOxygen
		}
	}
}

@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX] {
		@PROPELLANT[MonoPropellant] {
			@name = Hydrazine
		}
	}
}

@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleRCSFX] {
		@PROPELLANT[MonoPropellant] {
			@name = Hydrazine
		}
	}
}

@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX]:HAS[#engineID[S1SRB_Abort]] {
		@PROPELLANT[SolidFuel] {
			@name = PBAN
		}
	}
}

@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX]:HAS[#engineID[LES]] {
		@PROPELLANT[SolidFuel] {
			@name = PBAN
		}

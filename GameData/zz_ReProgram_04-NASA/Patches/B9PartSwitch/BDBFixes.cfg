@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@RESOURCE[LiquidFuel] {
		@name = Kerosene
		@amount *= 5.0173097
		@maxAmount *= 5.0173097
	}
	@RESOURCE[Oxidizer] {
		@name = LqdOxygen
		@amount *= 5.0173097
		@maxAmount *= 5.0173097
	}
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
		@amount *= 3.9840637
		@maxAmount *= 3.9840637
	}
}

@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX],2 {
		@PROPELLANT[MonoPropellant] {
			@name = Hydrazine
		}
	}
}

@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleRCSFX],2 {
		@PROPELLANT[MonoPropellant] {
			@name = Hydrazine
		}
	}
}

@PART[bluedog_XLR129]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX]:HAS[#engineID[BDB_XLR129_vac]] {
		@PROPELLANT[Oxidizer] {
			@name = LqdOxygen
			@ratio *= 4.3821209
		}
	}
}

@PART[bluedog_X15_SERJ_Engine]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleEnginesFX]:HAS[#engineID[ClosedCycle]] {
		@PROPELLANT[LiquidFuel] {
			@name = Kerosene
		}
		@PROPELLANT[Oxidizer] {
			@name = LqdOxygen
		}
	}
}

@PART[BDB_FASAUmbilicalTower]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleGenerator] {
		@OUTPUT_RESOURCE[LiquidFuel] {
			@name = LqdOxygen
			@rate *= 5.0173097
		}
		@OUTPUT_RESOURCE[Oxidizer] {
			@name = LqdOxygen
			@rate *= 5.0173097
		}
		@OUTPUT_RESOURCE[MonoPropellant] {
			@name = Hydrazine
			@rate *= 3.9840637
		}
	}
}
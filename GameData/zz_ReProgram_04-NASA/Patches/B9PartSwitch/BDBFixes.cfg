@PART[bluedog_*]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@RESOURCE[SolidFuel] {
		@name = PBAN
		@amount *= 4.2325056
		@maxAmount *= 4.2325056
	}
}

@PART[bluedog_UA120]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]] {
		@SUBTYPE[*] {
			@RESOURCE[SolidFuel] {
				@name = PBAN
				@amount *= 4.2325056
				@maxAmount *= 4.2325056
			}
		}
	}
}

@PART[BDB_FASAUmbilicalTower]:FOR[zzz_ReProgram]:NEEDS[Bluedog_DB] {
	@MODULE[ModuleGenerator] {
		@OUTPUT_RESOURCE[LiquidFuel] {
			@name = LqdOxygen
			@rate *= 5.0173097
		}
		@OUTPUT_RESOURCE[Oxidizer] {
			@name = LqdOxygen
			@rate *= 5.0173097
		}
		@OUTPUT_RESOURCE[MonoPropellant] {
			@name = Hydrazine
			@rate *= 3.9840637
		}
	}
}
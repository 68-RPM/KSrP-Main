
@PART[*]:HAS[#name[bluedog*],@MODULE[ModuleB9PartSwitch]]:FOR[zzz_ReProgram] {
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]] {
		SUBTYPE {
			name = Hypergols
			title = #LOC_RPtitle_AerozineTank
			descriptionDetail = #LOC_RPblurb_AerozineTank
			tankType = Hypergolic
			addedMass = #$../../tank_mass$
			@addedMass *= -1
			addedCost = #$../../tank_plus_fuel_cost$
			@addedCost *= -1
			percentFilled = #$../../fuelPctFill$
		}
	}
}
Localization {
	en-us {
		#LOC_RPtitle_C7 = C7 Aerospace Division
		#LOC_RPtitle_HOTOL = C7 Aerospace Division + Rockomax Conglomerate
		#LOC_RPtitle_LateralClamp = C7 Aerospace Division + Coopʼs Connectors
		#LOC_RPblurb_C7 = “Why go straight up, when you can fly equally well in other directions?”—thatʼs the old motto of C7 Aerospace founder Chad Kerman. (Well, it was originally “Failure isnʼt an option, itʼs a feature”, but heʼs ashamed of that one.)\n\nEmerging from humble beginnings to the powerhouse they are now, C7 have always been looking straight ahead towards the horizon…as well as a little above it, towards that spot where the sky meets outer space. With their line of experimental aircraft parts, covering just about everything necessary for level flight, there is adventure to be found in whichever direction you choose.

		#LOC_RPtitle_ClampOTron = Coopʼs Connectors
		#LOC_RPtitle_InflatableAirlock = Coopʼs Connectors + FLOOYD Dynamics Research Labs
		#LOC_RPblurb_ClampOTron = After a peaceful protest against the lack of spacecraft attachment systems turned violent, pilot and engineer Coopford Kerman left retirement to save the day, devising the ingenious Clamp-O-Tron docking port using whatever he could find lying by the side of the road. Since then, Clamp-O-Tron parts have become a household name, world-famous for their reliability even under extreme centrifugal, tidal, or phantom forces.\n\nBetween you and me, though, the real star of the company is his sidekick, an intelligent Moving Parts Group robot named SARB.

		#LOC_RPtitle_Dinkelsteins = Dinkelstein Kermanʼs Construction Emporium
		#LOC_RPblurb_Dinkelsteins = Dinkelstein Kerman has become somewhat of a legend in the spacecraft industry, not least impressively because he vehemently claims to have been constructing and flying spaceships long before the first actual recorded instance of any such vehicle being assembled. This has led to some controversy and a lot of awkwardness between him and the Kerbin World-Firsts Record-Keeping Society. Be that as it may, Dinklesteinʼs Emporium is still generally well regarded as a traditional, old-fashioned company, and their products are actually a lot less rusty than the companyʼs owner.

		#LOC_RPtitle_Experimental = Experimental Engineering Group
		#LOC_RPblurb_Experimental = The Experimental Engineering Group is a typical tech startup: Low budgets and impossibly tight deadlines are part of a normal working day for them. In spite of being such a young company, Experimental Engineering has made a good start, quickly making a name for themselves in the industry, mainly thanks to their very educational and entertaining SC-9001 Science Jr. Experiment Kit.\n\nDespite valiant efforts from their representatives, however, they havenʼt quite been able to shake off the bad press that followed some leaked footage of an incident involving one of their units and a small critter that one of the scientists over at R&D used to keep as a pet. Some say the incident has made them extremely concerned with the safety of anything that approach their products. Theyʼve even rounded out the edges on their company logo.

		#LOC_RPtitle_FLOOYD = FLOOYD Dynamics Research Labs
		#LOC_RPtitle_InflatableHeatShield = FLOOYD Dynamics Research Labs + O.M.B Demolition Enterprises
		#LOC_RPblurb_FLOOYD = FLOOYD Labs is a company focused on doing one thing, and doing it as well as is conceivably possible to do it: Displacing liquids from one place to another. Their flagship product, the FTX-2 Fuel Duct, is the final result of years of research and development and endless Kerbal-hours of effort to produce a device that will pump any amount of just about anything, no matter how cold, dense or volatile it is.\n\nThe company enjoys a well-deserved reputation for such an important contribution to the industry, and most agree that these days, almost nobody remembers the embarrassment of their recall of the FTX-1 series, which had a small but highly problematic issue; while it did pump fluids flawlessly…it pumped them in the wrong direction.

		#LOC_RPtitle_Goliath = Goliath National Products
		#LOC_RPblurb_Goliath = Goliath National Products know whatʼs needed to keep them ahead of the competition: an eye for detail and a good nose for sniffing out whatʼs needed for our plucky engineers. Many of the great vessels of our age carry one of Goliaths nose cones, which tend to excel in moving air out of the way of the soft, important bits of any spacecraft (i.e. our heroes heading off on another adventure).

		#LOC_RPtitle_Integral = Integrated Integrals
		#LOC_RPblurb_Integral = What this small company lacks in experience and reputation, it makes up for in the sheer ambitiousness of their projects. Their first product was the very massive Mobile Processing Lab, which rumour has it was first developed as a mobile processing facility to secretly brew an experimental, possibly illegal fuel mixture, which was reportedly far more potent than the currently available propellants. Those rumours have never been proven however, and this mysterious propellant has yet to be seen by a reliable source.\n\nDespite their repeated attempts to be rid of these rumours, the company still suffers from a (probably undeserved) bad reputation. They try to offset this initial impression by offering much larger cash payoffs than other companies of similar size, which admittedly does very little to improve their current image.

		#LOC_RPtitle_I3 = Intensive Impulse Institute
		#LOC_RPtitle_Casaba = Intensive Impulse Institute + Winnfield Atomic Research
		#LOC_RPtitle_Dirac = Intensive Impulse Institute + Supergiant Dynamics
		#LOC_RPblurb_I3 = Hidden within research papers and spoken of as the stuff of legend, there are nuclear reactions more efficient than any atomic bomb, or even stellar fusion. Every known particle of ordinary matter has a partner with mirrored charge, and when they collide they convert each other to energy with little to no waste–half a kilogram of this ‘antimatter’ is worth over 20 megatons when thrown at half a kilogram of matter.\n\nThough often criticized as ‘having their head in the clouds’ or as being ‘a global catastrophic risk masquerading as a part manufacturer’, the I3 is quite successful for a band of misfit scientists and engineers, dedicated to unleashing the might of positrons, antiprotons, and antihydrogen… not all at once, ideally.

		#LOC_RPtitle_Ionic = Ionic Symphonic Protonic Electronics
		#LOC_RPblurb_Ionic = One of the leading names in spacecraft electronics, and not just because the name itself sounds so cool.\n\nISP Electronics has a large catalogue of components, ranging from simple communication antennas to seriously cutting-edge gear. This has made their products quite popular among aerospace engineers, and also nurtured a profound enmity from the pragmatic folks at Probodobodyne. (It doesnʼt help that Ionic labels their Size-0 parts ‘PB’ for ‘Probodobodyne compatible’—which confuses naïve buyers).\n\nThey were originally known as Ionic Protonic Electronics, but an extra rhyme was added when they discovered their name wasnʼt considered legally distinct from Zaltonic Electronics.


		#LOC_RPtitle_Jebediahs = Jebediah Kermanʼs Junkyard & Spaceship Parts Co.
		#LOC_RPblurb_Jebediahs = Jebʼs Junkyard is a case study in unwavering motivation against insurmountable odds. Though the namesake owner bought it with the intent of looking for salvageable aircraft, Jebediah Kerman would by chance end up developing the LV-T30 engine, helping Kerbalkind take its first steps towards the depths of space.\n\nIn the present, it has become a much larger junkyard, having had to expand its facilities and purchase surplus scrap to accommodate an ever-increasing demand for spacecraft components. Jebediah Kerman, meanwhile, has become one of Kerbinʼs most iconic names—he and his company now stand proudly as a symbol of the unstoppable Kerbal drive towards attempting the impossible…while grossly underestimating the gravity of the situation.

		#LOC_RPtitle_KerbalMotion = Kerbal Motion LLC
		#LOC_RPblurb_KerbalMotion = After years of outcry against the lack of proper powered wheels, Kerbal Motion was founded as a small startup company to deliver just what the public wanted.\n\nInitially, they started with square wheels, and began adding sides until they settled on a more cylindrical configuration. Intensive testing, which incidentally led to various new motors being invented, confirmed their suspicions that round wheels really do make for a much smoother ride.\n\nOnce they overcame that hurdle (and conquered the wheel business with their RoveMax brand), the brains at the company then began looking towards what else they could apply their considerable grey matter to; they settled on grabber claws, in part as this would mean they wouldnʼt have to reach quite so far for their drinks.

		#LOC_RPtitle_Kerbodyne = Kerbodyne International
		#LOC_RPblurb_Kerbodyne = Although Kerbodyne is a relatively new name in the aerospace industry, their engines and fuel tanks have earned them a quite a reputation in a short amount of time…so much so, in fact, that Kerbodyne was nominated for the ‘Best Debut’ Award at last yearʼs Spacecraft Developers Convention.\n\nUnfortunately, the prize ultimately went to another company, but Kerbodyne fans are known to demonstrate—loudly and publicly—their appreciation for the company and its products.

		#LOC_RPtitle_Kerlington = Kerlington Model Rockets and Paper Products, Inc.
		#LOC_RPblurb_Kerlington = Kerlington has a long history of introducing ground-breaking new technologies, many of which are now considered indispensable for rocketry and aerospace engineering. This has fostered a strong community of loyal Kerlington fans, as well as a similarly large group of disgruntled competitors.

		#LOC_RPtitle_LightYear = LightYear Tire Company
		#LOC_RPblurb_LightYear = Allegedly used on more aircraft and spaceplanes than any other tire, LightYearʼs overspecialization leaves them envious of Kerbal Motionʼs wider adoption. In order to compensate, theyʼve researched tougher and tougher reinforced compounds from which to build their landing gear, meaning their products effectively never wear out…but even so, the companyʼs claim that they would last for an actual light yearʼs worth of landings arenʼt very likely.

		#LOC_RPtitle_Maxo = MAXO Construction Toys
		#LOC_RPblurb_Maxo = The MAXO Construction Toys engineers always enjoyed building things—especially out of little plastic bricks. So when they put their heads together and got a bit of money in the bank, they decided to do the same but with bits of lightweight metal.\n\nMAXOʼs metallic constructions are renowned for their durability and build quality. In fact when sifting through the wreckage of yet another spectacular ‘landing’, their parts are almost always found intact.

		#LOC_RPtitle_MovingParts = Moving Parts Expert Group
		#LOC_RPblurb_MovingParts = The Moving Parts Expert Group started off as a mostly non-commercial initiative to bring some of the brightest minds together to create truly innovative and ground-breaking technologies for spacecraft construction. As is the case with many such enterprises, their initial investment funds very soon ran out and they were forced to start developing stuff that they could sell, quickly. As a result, the Group acquired a reputation for being always in a hurry, and always strapped for cash. They still try their best to stay true to their original motivations as much as possible though, and will always be willing to support any ventures that push the currently established boundaries.

		#LOC_RPtitle_OMB = O.M.B Demolition Enterprises
		#LOC_RPtitle_HeatShield = O.M.B Demolition Enterprises + FLOOYD Dynamics Research Labs
		#LOC_RPtitle_Size1p5_Strut_Decoupler = O.M.B Demolition Enterprises + StrutCo
		#LOC_RPblurb_OMB = For a company thatʼs made a reputation for creating as much destruction as possible, O.M.B has found a remarkably suitable place for its highly volatile devices in the aerospace industry. Their precision, pyrotechnic-bolt Decouplers are second to none when the job calls for splitting spacecraft into multiple smaller ones.\n\nSome of their other demolition products, despite being heavily advertised as far more powerful disassembly tools, have not been as successful. O.M.B is still unsure as to why those ‘clearly superior’ products werenʼt so well received.

		#LOC_RPtitle_Periapsis = Periapsis Co. Rocket Supplies
		#LOC_RPblurb_Periapsis = Periapsis RSC are notoriously private—the small roster of rocket supplies they do build does nothing but add to the mystique surrounding them. Many question why they donʼt build more parts, but Periapsis always answers this with a standard response of “wait and see what weʼll do next!”.\n\nGiven that has been the standard response for more than a little while now, general consensus is that the lack of transparency is primarily a means to maintain interest in their niche of utilitarian solid motors.

		//Potatoes
		#LOC_RPtitle_PotatoRoid = An asteroid
		#LOC_RPtitle_PotatoComet = A comet
		#LOC_RPtitle_Potato = Outer space
		#LOC_RPblurb_Potato = A big olʼ space rock.

		#LOC_RPtitle_Probodobodyne = Probodobodyne Inc.
		#LOC_RPblurb_Probodobodyne = Probodobodyne was at one point one of the leading (and few) names in the industry. Over the years though, the company has fallen somewhat behind the times, but they continue to maintain their philosophy that space exploration should be the privilege of the few who can overcome the challenges of conquering it, with minimal technological assistance.\n\nTheir products reflect that pragmatic and arguably obsolete outlook, even in spite of the many newer companies that are coming up around them with alternatives that make space travel far more accessible than it was back in the ‘early days’. Despite all this, the company has retained a small but loyal following of hardcore fans, who live by their vision of a very selective industry, populated only by the very best astronauts and engineers.

		#LOC_RPtitle_RD = Research & Development Department

		#LOC_RPtitle_ReactionSystems = Reaction Systems Limited
		#LOC_RPblurb_ReactionSystems = Reaction Systems is a small company which developed the famous EVA Jetpack and enjoyed a reasonable amount of success with their Place-Anywhere series of Linear RCS Ports. These days, however, nobody knows for certain what theyʼre working on.\n\nEven though Reaction Systems is most definitely not the largest business out there, they try to make up for it by supporting all pioneering endeavours…and their eagerness to offer science-gathering contracts lends credit to speculation that they may be up to something.

		#LOC_RPtitle_Rockomax = Rockomax Conglomerate
		#LOC_RPblurb_Rockomax = Indisputably the largest supplier of rocketry components out there, Rockomax products are widely regarded as the most accessible way to get into space. This has earned them a somewhat negative reputation among the more posh or avant-garde engineers, some even outright refusing to admit to having used Rockomax™ brand products.\n\nBe that as it may, Rockomaxʼs gigantic presence in the industry cannot be gainsaid, and their products are actually pretty good value, even if they do lack the ‘trendy’ feel of the more up-scale rocketry brands. They are a massively large corporation, so donʼt expect them to cut you very special deals; they are already giving all their customers a bulk discount plus their ‘super-value’ deals when using products from their partner brands…\n\n…all this provided, of course, that you have a membership card with you when you go shopping at their warehouses.

		#LOC_RPtitle_Rokea = RÖKEA Inc.
		#LOC_RPblurb_Rokea = Originally a supplier of ready-to-build furniture, RÖKEA provides a number of products… however, they are most infamously known for their ‘vertical mobility enhancer’ product line, which they go to great lengths to ensure are not mistaken for simplistic ladders. Some say they are failing miserably in that effort, even though their representatives will very eagerly educate all who come within earshot about the differences between a ladder and a vertical mobility enhancement apparatus upon the slightest utturance of the word ‘ladder’.\n\nPerhaps this communications strategy is part of the reason nobody cares.

		#LOC_RPtitle_Seans = Seanʼs Cannery
		#LOC_RPblurb_Seans = Many question the reasoning behind Seanʼs Cannery (known for their very excellent canned food products) setting out on a venture into the aerospace engineering world. Despite the criticism, none can dispute that their flagship products, the Lander Can series of capsules, has proven themselves many times over as a reliable and, perhaps not surprisingly, very air-tight series of crew-carrying modules. Lander Can crews often praise the modules for their ability to keep stowed snacks crisp and fresh, and complain of how on other pods they become mushy after but a few days into the mission.

		#LOC_RPtitle_Shikigami = Shikigami Cooperative
		#LOC_RPblurb_Shikigami = Worker-owned, entirely self-managed, and producing the most powerful lifter engines on the market, Shikigamiʼs convictions represent a direct challenge to the status quo of Kerbinʼs aerospace economy at large. They work for minimal profit, dedicating the vast majority of their funding and resources to furthering engineering and rocket science, and for the moment this appears to be doing quite well.\n\nTheir success, they would say, is also a statement—one which has the economists and shareholders at mega-corporations such as Rockomax or Kerbodyne shaking in their dress shoes.

		#LOC_RPtitle_STEADLER = STEADLER Engineering Corps
		#LOC_RPblurb_STEADLER = STEADLER is not known for being a very kind or yielding company; militaristic, stern, and uncompromising are much more fitting adjectives to describe them. Some say these are good qualities for a company responsible mainly for engineering control systems for rockets and hypersonic aircraft, while others suggest that the company is actually being run by a rogue Guidance Module that achieved sentience…\n\n…all we really know is that their gate security is much too temperamental to allow for any observation, and that their stun guns recharge very quickly.

		#LOC_RPtitle_Stratus = Stratus Corporation
		#LOC_RPblurb_Stratus = Stratus is a manufacturer of pressure vessels, historically building Hydrogen tanks for airships, hence the name. The tanks they build for the space industry are instead filled with monopropellant, but they retain a cloud-white coloration to harken back to the companyʼs roots.

		#LOC_RPtitle_StrutCo = StrutCo Strut Company
		#LOC_RPblurb_StrutCo = One of the largest manufacturers of structural components for any purpose, StrutCo is by all measures a very well-established company. This may seem improbable, considering that they only have three aerospace products to their name…but when one of those products just so happens to be the legendary EAS-4 Strut Connector*, it becomes much more clear why their market share is so big.\n\n\n*(Owned by Kerlington Model Rockets. StrutCo just builds them for Kerlington, much to their chagrin.)

		#LOC_RPtitle_SuperGiant = Supergiant Dynamics
		#LOC_RPblurb_SuperGiant = In spite of the common saying that their technological breakthrough of choice has been ‘thirty years away’ for much longer than a decade, Supergiant Dynamics has recently achieved a satisfactory level of nuclear fusion, allowing them to (finally) enter the market as the manufactory of choice for fusion power–whether that be in the form of a power plant or a rocket engine. The power of the stars, available to Kerbals everywhere… for better or for worse.

		#LOC_RPtitle_VacCo = Vac-Co Advanced Suction Systems
		#LOC_RPblurb_VacCo = Vac-Co is a relatively new name in the industry. With previous experience only as a manufacturer of housecleaning equipment and small appliances, their recent venture into aerospace engineering has been met with no small amount of skepticism. Nevertheless, they seem to know what theyʼre doing, as their one product has been quite innovative in the spaceplane sector.

		//Winnfield Atomics
		#LOC_RPtitle_WAR = Winnfield Atomic Research
		#LOC_RPblurb_WAR = Even before the debut of the first nuclear engine, Kerbal scientists were interested in the far-reaching implications of particle physics. This lead to the foundation of the initially-top-secret Winnfield Kerman International Laboratory at some undisclosed location between the Kerbal Space Center and the Dessert airfield, where the power of radioactive decay was unleashed in a ginormous explosion, one no mixture of fuel and oxidizer could ever reproduce.\n\nWith no armed conflicts on Kerbin for generations, practical applications for this were immediately sought in spaceflight, and the laboratory revealed itself to the world as a spaceflight manufacturer. Today, Winnfield Atomics is the one firm who are trusted with the most extreme of fission reactions.

		//WinterOwl Aircraft Emporium
		#LOC_RPtitle_WinterOwl = WinterOwl Aircraft Emporium
		#LOC_RPblurb_WinterOwl = WinterOwl is by no means comparable to other large aircraft companies in terms of sheer number of products they offer. However, the company is one of the best-known names in the industry as itʼs one of the oldest companies in operation.\n\nThis has earned them a reputation for being a friendly, reliable partner, which means they have good standings with many other companies. In the aerospace circles, it is considered very poor manners to be rude about WinterOwl or its products.

		//Zaltonic Electronics
		#LOC_RPtitle_Zaltonic = Zaltonic Electronics
		#LOC_RPblurb_Zaltonic = Zaltonics isnʼt exactly known as a strong leader in the electronic components industry, rather more as a somewhat utilitarian company that lacks a certain amount of ambition. These traits however, have made Zaltonic indispensable in their own way, as they are willing to take on the manufacturing of the less exciting devices, and theyʼve become quite good at doing that in a quick and cost-effective way. Their products might not be all the rage, but when your fancy remote guidance unit runs out of juice, chances are youʼll be using a Zaltonics battery to keep it powered.
	}
}
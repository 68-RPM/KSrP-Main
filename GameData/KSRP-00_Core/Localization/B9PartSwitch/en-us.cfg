		#LOC_RPshort_KeroloxTank = The tank is filled with <b>rocket-grade jet fuel</b>.
		#LOC_RPblurb_KeroloxTank = This mixture is versatile, but the oxidizer <b>slowly boils</b>.

		#LOC_RPshort_AerozineTank = The tank is filled with <b>hypergolic rocket fuel</b>.
		#LOC_RPblurb_AerozineTank = This mixture <b>does not evaporate</b>, but has fewer engines,\nand a <b>unique oxidizer</b> that no other propellant can use.
		#LOC_RPshort_MonoPropTank = The tank is filled with <b>hypergolic monopropellant</b>.
		#LOC_RPblurb_MonoPropTank = This compound, used for RCS, <b>burns without oxidizer</b>.

		#LOC_RPshort_CryoTank = The tank is filled with <b>cryogenic rocket fuel</b>.
		#LOC_RPblurb_HydroloxTank = This mixture is an ideal propellant, but it <b>boils faster</b>!
		#LOC_RPblurb_HydrogenTank = This tank has <b>no oxidizer</b>, for use with specialty engines.
		#LOC_RPblurb_MethaloxTank = The tank is filled with <b>cryogenic rocket fuel</b>.\nThis mixture is <b>well-rounded</b> as propellant, and is costly.

		#LOC_RPshort_KeroseneEngine_MTUp = The plumbing is configured for <b>rocket-grade jet fuel</b>.\n<i>Increased <b>mass</b> & <b>thrust</b>.</i>
		#LOC_RPshort_HydrogenEngine_MTUp = The plumbing is configured for <b>cryogenic rocket fuel</b>.\n<i>Increased <b>mass</b> & <b>thrust</b>.</i>
		#LOC_RPshort_KeroseneEngine_MTDown = The plumbing is configured for <b>rocket-grade jet fuel</b>.\n<i>Decreased <b>mass</b> & <b>thrust</b>.</i>
		#LOC_RPshort_HydrogenEngine_MTDown = The plumbing is configured for <b>cryogenic rocket fuel</b>.\n<i>Decreased <b>mass</b> & <b>thrust</b>.</i>
		#LOC_RPshort_KeroseneEngine_MassUp = The plumbing is configured for <b>rocket-grade jet fuel</b>.\n<i>Increased <b>mass</b>.</i>
		#LOC_RPshort_HydrogenEngine_MassDown = The plumbing is configured for <b>cryogenic rocket fuel</b>.\n<i>Decreased <b>mass</b>.</i>
		#LOC_RPshort_HydrogenEngine_ThrustUp = The plumbing is configured for <b>cryogenic rocket fuel</b>.\n<i>Increased <b>thrust</b>.</i>
		#LOC_RPshort_KeroseneEngine_ThrustDown = The plumbing is configured for <b>rocket-grade jet fuel</b>.\n<i>Decreased <b>thrust</b>.</i>

		#LOC_RPshort_KeroseneEngine = The plumbing is configured for <b>rocket-grade jet fuel</b>. <i>(1:1 performance)</i>
		#LOC_RPshort_AerozineEngine = The plumbing is configured for <b>hypergolic rocket fuel</b>. <i>(1:1 performance)</i>
		#LOC_RPblurb_JebsKerosene = We build most of our engines with multiple ignition systems.\nThis is the configuration we designed before we specified the liquid fuel.
		#LOC_RPblurb_JebsAerozine = We build most of our engines with multiple ignition systems.\nThis stuff is easy to light, but very nasty, so use it in space or maintain a safe distance.
		#LOC_RPblurb_RockoKerosene = Thanks to an agreement with our subsidiary Paramax™ Petrochemicals, you can rest assured that you wonʼt have to use anything besides good olʼ El-Eff-Oh.
		#LOC_RPblurb_RockoHydrogen = The Space Program had to go through a lot of red tape for legal to allow this, but trust us: We in the engineering department didnʼt cheap out.
		#LOC_RPblurb_KerboHydrogen = Thanks to the recent popularity of cryogenic fuels, Kerbodyne now ships many of their engines running Hydrogen.
		#LOC_RPblurb_KerboKerosene = Most of Kerbodyneʼs engines originally released running standard Liquid Fuel, despite their design specs.
		#LOC_RPblurb_KerboAerozine = Given it is a vacuum engine, Kerbodyne was not scared of the risks inherent to Hypergolics when designing the Wolfhound.


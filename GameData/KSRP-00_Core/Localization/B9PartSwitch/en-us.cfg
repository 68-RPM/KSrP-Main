		// Tanks

		#LOC_RPtitle_KeroloxTank = Kerolox
		#LOC_RPtitle_AerozineTank = Hypergolics
		#LOC_RPtitle_MonopropTank = Monopropellant
		#LOC_RPtitle_HydroloxTank = Hydrolox

		#LOC_RPblurb_JebsEngineBase = All Jebediahʼs Junkyard craftsmanship is of the highest quality…\n…which is a key selling point, considering what weʼre working with here.
		#LOC_RPblurb_JebsEngineUpgrade = We paid extra attention to the quality of the machining, and did a few extra static fires just to be sure that it works.\nAs a bonus, we gave it some reinforcement and tuning!
		#LOC_RPblurb_ThudBase = The inner machinations of Eugene Kermanʼs mind are an enigma.\nHe donned a costume and dubbed himself ‘THE CONSTRUCTOR!’ while making this thing.
		#LOC_RPblurb_SkipperBase = With the RE-I5 Skipper standard package, you can soar to the skies with a joule output higher than that of some large cities.
		#LOC_RPblurb_SkipperUpgrade = With the RE-I5 Skipper premium package, your rocket could possibly exceed the power output of a major metropolitan area!
		#LOC_RPblurb_MainsailBase = With the RE-M3 Mainsail standard package, you can soar to the skies with a joule output exceeding that of some small countries!
		#LOC_RPblurb_MainsailUpgrade = With the RE-M3 Mainsail deluxe package, your launch vehicle very well may have more power than a wealthy microstate.\nHow could you ever settle for less?
		#LOC_RPblurb_KerboBase = The basic model.\nWeʼd write more, but we donʼt have a marketing team.
		#LOC_RPblurb_KerboUpgrade = A side-grade model.\nWeʼd write more, but we donʼt have a marketing team.
		#LOC_RPblurb_VectorBase = The KS-25 engine as originally designed: An expensive powerhouse with trigger-happy gimbal.
		#LOC_RPblurb_VectorVR = Our original KS-25 specification was made for reusable spaceplanes.\nThis build refits the engine for launch vehicles, and is comparatively modest.
		#LOC_RPblurb_MastodonBase = The KE-1 engine, built exactly to design…\n…itʼs not quite as powerful as we expected, however.
		#LOC_RPblurb_MastodonUpgrade = Our original KE-1 was built to exact specifications, but we can do better.\nThis version is built using the assembly lineʼs Acapello-era notes, rescued from the shredder.
		#LOC_RPblurb_EveOptimized = Research & Development's own ‘Eta’ series of engines have been built for high-pressure atmospheres, and command a premium with that in mind.\nAll proceeds go to the ground crewʼs salaries.

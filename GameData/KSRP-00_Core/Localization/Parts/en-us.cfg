		#LOC_RPtitle_Mark1-2Pod_v1 = Command Pod Mk1-2
		#LOC_RPblurb_Mark1-2Pod_v1 = Designed as a replacement for Kerlingtonʼs original three-seater Mk1 pod, this modern cockpit is designed to be fully re-useable and its spacious cabin can hold a maximum of 3 crew. It is also designed to resist hull loss, making it quite impact-tolerant (and heavy).

		#LOC_RPtitle_mk2LanderCabin_v1 = Lander-Can Mk2
		#LOC_RPblurb_mk2LanderCabin_v1 = This cozy capsule seats two, and is very lightweight.\n\nHowever, donʼt expect it to survive atmospheric entry, lithobraking, or even a sneeze.

		#LOC_RPtitle_Mark1Cockpit_v1 = Mk1 Cockpit Rev.001
		#LOC_RPblurb_Mark1Cockpit_v1 = C7 Aerospaceʼs first generation cockpit. This sleek, sharp design is equally useful for supersonic, hypersonic, and orbit-capable vehicles. Though production costs and comparatively rare use cases forced it into a niche, the Mk1-001 remains one of the best-performing airframes in its class, with a slight edge over its successor.\n\n<color=orange>WARNING: Not equipped with a docking view!</color>

		#LOC_RPtitle_reprogram-ie-SphereTank = X-11 Cryogenic Fuel Tank
		#LOC_RPblurb_reprogram-ie-SphereTank = For those times when you need a large quantity of fuel attached to your vessel, HDLF has manufacturered this tank. Inspired by bunches of grapes, it is designed to be more portable than the competitonʼs products and even comes with an integrated radial decoupler.

		#LOC_RPtitle_reprogram-ie-Daedalus = K-153 ‘Braveheart’ Nuclear Fusion Engine
		#LOC_RPblurb_reprogram-ie-Daedalus = Originally designed to (A) throw probes at nearby red dwarfs and (B) have them get there within the century, the K-153 engineʼs inertial confinement system is far faster (and <i>angrier</i>) than the K-80ʼs, outputting enough pulses per second to form seamless rocket thrust. It also outputs absurd amounts of neutron radiation, but Supergiantʼs engineers and marketing are adamant that the engine is ‘mostly safe’ for Kerbal-rated spacecraft, or at least ‘not as bad as some of the alternatives’.
		#LOC_RPtitle_reprogram-ie-VISTA = K-197 ‘Longhorn’ Nuclear Fusion Engine
		#LOC_RPblurb_reprogram-ie-VISTA = The Longhorn is a portable model from the same school of thought as the K-80 and K-153 engines. Originally envisioned as a giant interstellar spacecraft, what was originally the vehicleʼs combination superstructure-and-exhaust-shield was downsized to become the engine housing. Supergiant Dynamics has gone to great lengths to ensure they do not let their engineers get bored ever since.

		#LOC_RPtitle_reprogram-ie-OmniRCS = Omnidirectional Vernier Unit
		#LOC_RPblurb_reprogram-ie-OmniRCS = The staff at MonkeyWrench came up with this after one too many attitude control losses using STEADLERʼs products.\n\nKeep <i>very</i> clear of the nozzles.

		#LOC_RPtitle_reprogram-ie-AeroShield = Deployable Heat Shield
		#LOC_RPblurb_reprogram-ie-AeroShield = A deployable heat shield made of graphene. It creates large amounts of drag when open, and is well suited for most pods entering most atmospheres.
		#LOC_RPtitle_reporgram-ie-SunShield = Deployable Solar Shield
		#LOC_RPblurb_reprogram-ie-SunShield = A fairly compact heat shield which can unfold to about ten times its stowage diameter for operations close to the sun (be sure to bring enough radiators).\n\nAbsolutely, positively, definitively <b>not</b> for aerobraking or aerocapture maneuvers.
	}

@EVE_CLOUDS:AFTER[zzzReProgram] {
  @OBJECT,* {
	@altitude *= 0.8
  }
}

@Scatterer_planetsList:AFTER[zzzReProgram] {
  @scattererCelestialBodies {
	@Item {
	  @loadDistance *= 2.56
	  @unloadDistance *= 2.56
	}
	@Item:HAS[#celestialBodyName[Laythe]] {
	  %secondarySuns {
		%Item {
		  %celestialBodyName = Jool
		  %sunColor = 0.009,0.015,0.0095
		}
	  }
	}
  }
}

@Scatterer_atmosphere:AFTER[zzzReProgram] {
  @Atmo {
	@HR *= 1.3
	@HM *= 1.3
	@m_betaR[0] *= 0.77
	@m_betaR[1] *= 0.77
	@m_betaR[2] *= 0.77
	@BETA_MSca[0] *= 0.77
	@BETA_MSca[1] *= 0.77
	@BETA_MSca[2] *= 0.77
  }
}
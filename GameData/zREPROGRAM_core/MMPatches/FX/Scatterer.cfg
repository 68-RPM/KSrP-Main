@EVE_CLOUDS:AFTER[zREPROGRAM_core] {
	@OBJECT,* {
		@altitude *= 0.8
	}
}

@Scatterer_planetsList:AFTER[zREPROGRAM_core] {
	@scattererCelestialBodies {
		@Item:HAS[~Tag[Kcalbeloh]] {
			@loadDistance *= 2.56
			@unloadDistance *= 2.56
		}
	}
}
@Scatterer_atmosphere:AFTER[zREPROGRAM_core] {
    @Atmo:HAS[~Tag[Kcalbeloh]] {
		@HR *= 1.3
		@HM *= 1.3
		@m_betaR[0] *= 0.77
		@m_betaR[1] *= 0.77
		@m_betaR[2] *= 0.77
		@BETA_MSca[0] *= 0.77
		@BETA_MSca[1] *= 0.77
		@BETA_MSca[2] *= 0.77
    }
}
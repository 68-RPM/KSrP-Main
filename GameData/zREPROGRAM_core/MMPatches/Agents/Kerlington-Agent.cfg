@AGENT[Kerlington?Model?Rockets?and?Paper?Products?Inc]:AFTER[zzzReProgram] {
  @title = #L_ReProgramA_Kerl
  %description = #L_ReProgramA_KerlBlurb
}
@PART[seatExternalCmd|mk1pod_v2|Mk2Pod|mk1-3pod]:AFTER[zzzReProgram] {
  %manufacturer = #L_ReProgramA_Kerl
}
@PART[radialDrogue|parachuteDrogue|parachuteSingle|parachuteRadial|parachuteLarge]:AFTER[zzzReProgram] {
  %manufacturer = #L_ReProgramA_Kerl
}
@PART[solidBooster_sm_v2|solidBooster_v2|Mite|Shrimp]:AFTER[zzzReProgram] {
  %manufacturer = #L_ReProgramA_Kerl
}
// Command pods
@PART[mk1pod_v2]:AFTER[zzzReProgram] {
  @MODULE[ModulePartVariants]:NEEDS[ReStock]
  {
	@baseVariant = GrayAndWhite
  }
}
@PART[mk1-3pod]:AFTER[zzzReProgram] {
  @title = #L_ReProgramPT_mk1-3pod
}
// SRBs
@PART[solidBooster_sm_v2]:AFTER[zzzReProgram] {
  @title = #L_ReProgramPT_solidBooster_sm_v2
}
@PART[solidBooster_v2]:AFTER[zzzReProgram] {
  @title = #L_ReProgramPT_solidBooster_v2
  @MODULE[ModulePartVariants]:NEEDS[ReStock]
  {
	@baseVariant = YellowAndWhite
  }
}
@PART[Mite]:AFTER[zzzReProgram] {
  @title = #L_ReProgramPT_Mite
}
@PART[Shrimp]:AFTER[zzzReProgram] {
  @title = #L_ReProgramPT_Shrimp
}
@PART[restock-srb-mallet-1|restock-srb-striker-1|restock-srb-anvil-1]:NEEDS[ReStockPlus]:AFTER[zzzReProgram] {
  %category = Engine
  %TechHidden = False
  %manufacturer = #L_ReProgramA_Kerl
}
// Cleanup
!AGENT[FreeFall?Parachutes]:FINAL {} // All parachutes are now Kerlington, FreeFall is apocryphal [KSPCF]
!PART[restock-mk2-pod]:NEEDS[ReStockPlus]:FINAL {} // Redundant Mk2 Pod [Restock+]
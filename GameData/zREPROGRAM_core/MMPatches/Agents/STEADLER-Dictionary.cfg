Localization {
 en-us {
	// Agency
	#L_ReProgramA_Stead = STEADLER Engineering Corps
	#L_ReProgramA_SteadAgent = STEADLER Engineering Corps, gGmbH
	#L_ReProgramA_SteadBlurb = STEADLER is not known for being a very kind or yielding company; militaristic, stern, and uncompromising are much more fitting adjectives to describe them. Some say these are good qualities for a company responsible mainly for engineering control systems for rockets and hypersonic aircraft, while others suggest that the company is actually being run by a rogue Guidance Module that achieved sentience…\n\n…all we really know is that their gate security is much too temperamental to allow for any observation, and that their stun guns recharge very quickly.
	
	// Parts
		// Reaction wheels
	#L_ReProgramPT_sasModule = Standard Stabilizer Module, Small
		#L_ReProgramPD_sasModule = Built to add stability to small craft, this inline reaction wheel system uses a series of micro-gyroscopic discs that are spinning ‘very fast’ to generate the torque necessary to steer a spacecraft without spending propellant.\n\n(Do not attempt to service device while operational. Absolutely NOT to be used as a sit-and-spin.)
	#L_ReProgramPT_sasModule125 = Standard Stabilizer Module
		#L_ReProgramPD_sasModule125 = SAS: Stability Augmentation System, Spin Auto-Stabilizer, Sickness Avoidance Solution…whatever you choose to call it, it makes a craft stop spinning around—and a reaction wheel such as this one certainly helps. The equipment inside of reaction wheels spins very quickly, to keep the craft under control without spending propellant.
	#L_ReProgramPT_advSasModule = Advanced Stabilizer Module
		#L_ReProgramPD_advSasModule = Research shows that Kerbal crewmembers just can't be trusted to keep a spacecraft under control. The Advanced Stabilizer Module adresses this issue by containing a larger and heavier array of reaction wheels than the Standard Stabilizer. These larger wheels are driven by proportionally larger electric motors, so keep an eye on your electricity levels.\n\n(Batteries not included. It is highly recommended that crewmembers are kept unaware of this device, as experience shows that many Kerbals will see that as a 'challenge to their flying prowess'.)
	#L_ReProgramPT_asasmodule1-2 = Advanced Stabilizer Module, Large
		#L_ReProgramPD_asasmodule1-2 = After many years of research, STEADLER engineers devised this larger-scale version of the Advanced Stabilizer Module to keep massive spacecraft under control, using patented Large Flywheels™ technology to produce even more torque than the models before it. STEADLER has dismissed criticism concerning the necessity of so much research work, stating that 'it only sounds so simple now that we've figured it out', and although critics remain skeptical, none can disagree that this reaction wheel does indeed pack a lot more punch.\n\nIt also needs a lot more power, but STEADLER reassures us this is not a ploy to bolster Probodobodyne's solar panel sales.
		// Probes
	#L_ReProgramPD_MpoProbe =
	#L_ReProgramPD_MtmStage =
	#L_ReProgramPD_probeStackLarge = A larger version of the popular RGU system, developed in partnership with Rockomax Conglomerate.
		#L_ReProgramPM_probeStackLarge = STEADLER Engineering Corps + Rockomax Conglomerate
	#L_ReProgramPD_probeStackSmall = The STEADLER RGU core is one of the most complete command units available to date, featuring all the latest guidance systems, plus its own internal set of Reaction Wheels. STEADLER claims this is the closest one can get to a fully self-contained spacecraft.\n\n(Some assembly required. Spacecraft sold separately.)
		// RCS
	#L_ReProgramPD_RCSBlock_v2 = The recent discovery of a new law of physics made it possible for STEADLER engineers to produce these small monopropellant thrusters, to help with attitude control and linear motion.\n\nEven though many Kerbal physicists still dispute the validity of this new law, studies show that the thrusters appear to work as advertised.
	#L_ReProgramPT_RCSblock_01_small = RV-1X RCS Thruster Block
		#L_ReProgramPD_RCSblock_01_small = This small thruster block comes in a variety of variants that offer different RCS horn configurations to solve all your RCS needs.\n\n(We do not recommend attempting to say that quickly.)
 }
}
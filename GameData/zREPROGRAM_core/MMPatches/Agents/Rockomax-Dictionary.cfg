Localization {
 en-us {
		// Agency
	#L_ReProgramA_Rocko = Rockomax Conglomerate
	#L_ReProgramA_RockoAgent = Rockomax Conglomerate
	#L_ReProgramA_RockoBlurb = Indisputably the largest supplier of rocketry components out there, Rockomax products are widely regarded as the most accessible way to get into space. This has earned them a somewhat negative reputation among the more posh or avant-garde engineers, some even outright refusing to admit to having used Rockomax™ brand products.\n\nBe that as it may, Rockomax's gigantic presence in the industry cannot be gainsaid, and their products are actually pretty good value, even if they do lack the ‘trendy’ feel of the more up-scale rocketry brands. They are a massively large corporation, so donʼt expect them to cut you very special deals; they are already giving all their customers a bulk discount plus their ‘super-value’ deals when using products from their partner brands…\n\n…all this provided, of course, that you have a membership card with you when you go shopping at their warehouses.

		// Engines
	#L_ReProgramPT_liquidEngineMini_v2 = Rockomax™ 48-7S ‘Spark’ Liquid Fuel Engine
	#L_ReProgramPD_liquidEngineMini_v2 = The 48-7S may be small, but it packs quite a punch for its size. This little engine is a testament to how bigger does not always mean better, even if that contradicts the rest of our marketing department…\n\n…the box it comes in is pretty cool, in any case.

	#L_ReProgramPT_smallRadialEngine_v2 = Rockomax™ 24-77 "‘Twitch’ Liquid Fuel Engine
	#L_ReProgramPD_smallRadialEngine_v2 = Tiny engine!—But very useful, good for craft where larger radial engines wonʼt fit, or when you want more control with large lifter engines. You may need a few of them to lift heavy objects unassisted, however.
	

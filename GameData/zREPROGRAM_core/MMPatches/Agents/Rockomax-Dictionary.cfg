		// Drills
	#L_ReProgramPT_RadialDrill = Drill-O-Matic™ Resource Harvester
	#L_ReProgramPD_RadialDrill = Designed to help extract valuable resources from the crust of planets and asteroids, the Drill-O-Matic uses a rotary drill combined with an internal transfer auger to pull crushed regolith into holding tanks for later processing. … Resource processors operate best at their ideal operating temperatures, and feature automatic shutdown in the event of dangerous overheating. Radiators can be used to help manage excess heat.\n<color=KSPUnnamedCyan>Please allow skilled Engineers to operate for best results.</color>

	#L_ReProgramPT_MiniDrill = Drill-O-Matic™ Resource Harvester Jr.
	#L_ReProgramPD_MiniDrill = A smaller version of the popular Drill-O-Matic, this drill is designed to help extract valuable resources from the crust of planets and asteroids (unlike it's larger cousin, this smaller model is only suitable for ore concentrations above 2.5 percent). … Resource processors operate best at their ideal operating temperatures, and feature automatic shutdown in the event of dangerous overheating. Radiators can be used to help manage excess heat.\n<color=KSPUnnamedCyan>Please allow skilled Engineers to operate for best results.</color>


	#L_ReProgramPT_ISRU = Convert-O-Tron™ 250 Resource Utilizer
	#L_ReProgramPD_ISRU = This mobile processing plant can take raw materials containing even trace amounts of oxygen and hydrogen, and crack them into useful fuel products. … Resource processors operate best at their ideal operating temperatures, and feature automatic shutdown in the event of dangerous overheating. Radiators can be used to help manage excess heat.\n<color=KSPUnnamedCyan>Please allow skilled Engineers to operate for best results.</color>

	#L_ReProgramPT_MiniISRU = Convert-O-Tron™ 125 Resource Utilizer
	#L_ReProgramPD_MiniISRU = A smaller version of Kerbodyne's mobile processing plant, this module can take raw materials containing even trace amounts of oxygen and hydrogen, and crack them into useful fuel products (though this lighter model is less efficient, and not designed for long-term operations). … Resource processors operate best at their ideal operating temperatures, and feature automatic shutdown in the event of dangerous overheating. Radiators can be used to help manage excess heat.\n<color=KSPUnnamedCyan>Please allow skilled Engineers to operate for best results.</color>


Localization {
  en-us {
	  // Agency
	#L_ReProgramA_Probo = Probodobodyne Inc.
	// #L_ReProgramA_ProboAgent = Probodobodyne Incorporated
	#L_ReProgramA_ProboBlurb = Probodobodyne was at one point one of the leading (and few) names in the industry. Over the years though, the company has fallen somewhat behind the times, but they continue to maintain their philosophy that space exploration should be the privilege of the few who can overcome the challenges of conquering it, with minimal technological assistance.\n\nTheir products reflect that pragmatic and arguably obsolete outlook, even in spite of the many newer companies that are coming up around them with alternatives that make space travel far more accessible than it was back in the "early days". Despite all this, the company has retained a small but loyal following of hardcore fans, who live by their vision of a very selective industry, populated only by the very best astronauts and engineers.

	  // Command
	#L_ReProgramPT_kv1Pod = SV-1 ‘Onion’ Reentry Module
	#L_ReProgramPD_kv1Pod = The SV-1 is Probodobodyne's daring leap into the field of\nmanned capsule design. Under budgetary constraints that\ndrove the design bureau to tears, the engineers found them-\n-selves faced with the challenge of keeping the heat shield facing forward without reaction wheels.\nAn intern suggested making the whole thing a heat shield, and one integrated decoupler later, this spherical command module was born.
	#L_ReProgramPT_kv2Pod = SV-2 ‘Pea’ Reentry Module
	#L_ReProgramPD_kv2Pod = Probododyne found a market niche with the Onion, and as a result the SV-2 Reentry module was born—now fitting two Kerbals like peas in a pea pod.\n\nSome "unnecessary" equipment was removed from the SV-1's design to make room for the second seat. This decision has made the design bureau very unpopular with the astronauts.
	#L_ReProgramPT_kv3Pod = SV-3 ‘Pomegranate’ Reentry Module
	#L_ReProgramPD_kv3Pod = The Pomegranate is the ultimate in narrow-profile crew transport; you couldn't fit more Kerbals if you tried.\n\nProbododyne has, incidentally, learned why Kerlington cancelled their three-seater Mk1 Pod: With three seats fit into the same space as one, any occupants have severe difficulty moving their arms to access the controls.\nThey'll probably survive.

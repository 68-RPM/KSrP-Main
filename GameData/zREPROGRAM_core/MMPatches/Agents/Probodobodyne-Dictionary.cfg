	#L_ReProgramPD_solarPanelOX10L = A larger version of the OX-4 series of solar panels, which includes advanced heat radiators and a deploying bracket to keep the panels clear of other senstive instruments on the craft.\n\n<color=orange>WARNING: Not retractable once deployed!</color>

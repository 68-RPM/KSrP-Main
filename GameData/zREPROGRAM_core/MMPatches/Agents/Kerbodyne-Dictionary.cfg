Localization {
  en-us {
	  // Agency
	#L_ReProgramA_Kerbo = Kerbodyne International
	// #L_ReProgramA_KerboAgent = Kerbin Aerospace Dynamics dba Kerbodyne International
	#L_ReProgramA_KerboBlurb = Although Kerbodyne is a relatively new name in the aerospace industry, their engines and fuel tanks have earned them a quite a reputation in a short amount of time…so much so, in fact, that Kerbodyne was nominated for the "Best Debut" Award at last year's Spacecraft Developers Convention.\n\nUnfortunately, the prize ultimately went to another company, but Kerbodyne fans are known to demonstrate—loudly and publicly—their appreciation for the company and its products.
	  // Engines
	#L_ReProgramPT_LiquidEngineRE-J10 = KR-J10 ‘Wolfhound’ Liquid Fuel Engine
	#L_ReProgramPD_LiquidEngineRE-J10 = With the largest bell in its diameter class, this upper stage engine functions majestically.
	#L_ReProgramPT_LiquidEngineRE-I2 = KR-I2 ‘Skiff’ Liquid Fuel Engine
	#L_ReProgramPD_LiquidEngineRE-I2 = The Skiff is a powerful upper-stage drive, which easily sails into the (wholly metaphorical) winds of interplanetary space even with its average efficiency and thrust.
	#L_ReProgramPT_restock-engine-boar = KR-1 ‘Boar’ Liquid Fuel Engine
	#L_ReProgramPT_Size2LFB_v2 = KR-1×2 ‘Twin Boar’ Liquid Fuel Booster
	#L_ReProgramPD_Size2LFB_v2 = This liquid fuel booster system is a very purposeful piece of engineering: Instead of relying on single engines or solid rocket boosters, the KR-1×2 employs two modified KR-1 engines, fed by a built-in fuel system, as the source of its lifting power. All this self-contained goodness comes at the cost of it not having a mounting point on its underside, and it is not quite as efficient as dedicated engines…it comes at a literal cost, as well.
	#L_ReProgramPT_restock-engine-375-corgi = KR-10A ‘Corgi’ Liquid Fuel Engine
	#L_ReProgramPT_Size3AdvancedEngine = KR-2L+ ‘Rhino’ Liquid Fuel Engine
	#L_ReProgramPT_SSME = S3 KS-25 ‘Vector’ Liquid Fuel Engine
	#L_ReProgramPT_Size3EngineCluster = S3 KS-25×4 ‘Mammoth’ Liquid Fuel Engine
	#L_ReProgramPT_LiquidEngineKE-1 = KR-1 ‘Mastodon’ Liquid Fuel Engine
	#L_ReProgramPD_LiquidEngineKE-1 = Considered to be the behemoth of rocket technology, THIS propulsion system is the pinnacle of power. You hear that? THIS one. Not the Rockomax Mainsail, not those cheaters over in our Cryogenics department strapping four Vectors together and calling it a ‘Mammoth’, and almost certainly not those Φ@#&ING COMMUNISTS over at Shikigami. (Hey, wait, where are you going?)

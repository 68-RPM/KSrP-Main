Localization {
 en-us {
	// Agency
	#L_ReProgramA_Stratus = Stratus Corporation
	#L_ReProgramA_StratusAgent = Stratus Corporation
	#L_ReProgramA_StratusBlurb = Stratus is a manufacturer of pressure vessels, historically building Hydrogen tanks for airships, hence the name. The tanks they build for the space industry are instead filled with monopropellant, but they retain a cloud-white coloration to harken back to the company's roots.

	// Parts
		// RCS Tanks
	#L_ReProgramPD_evaCylinder = When you just don't have enough Δv to visit all your favorite spots on Minmus, or you want to circumnavigate Dres freestyle…you'll want to pack this spare fuel cylinder for extra-long duration activities. It handily tranfers propellant to an astronaut's EVA jetpack with a child-proof safety seal!
	#L_ReProgramPD_monopropMiniSphere = The Stratus-V Minified is the smallest and cutest monopropellant tank available. It holds a very minute amount of fuel, so it is common to see rings of them on a vehicle.\n\nRemember: this is a precision made fuel storage tank, not a toy.
	#L_ReProgramPD_radialRCSTank = Despite its fanciful name, the Stratus-V is quite simple—a small, radially attachable monopropellant storage tank.
	#L_ReProgramPD_rcsTankRadialLong = After years of research and development, the Stratus corporation developed a revolutionary new course for the future: Cylinders! This radially attached tank holds a moderate amount of monopropellant while also being quite attractive, versatile, and very cylindrical.
	#L_ReProgramPD_rcsTankMini = The FL-R20 is a miniature RCS tank perfect for small probes and other craft requiring just a little RCS thruster boost every now and then. We're also told they make excellent kettle drums when they're empty.	
	#L_ReProgramPD_RCSFuelTank = This tank stores monopropellant for RCS thrusters. Several recent advancements in plumbing have made possible to route RCS lines to any point on a craft, so RCS Fuel tanks can be placed anywhere…just watch your fuel levels, especially when docking.
	#L_ReProgramPD_Size1p5_Monoprop = For mid-sized stacks, Stratus has produced this larger-scaled version of the standard RCS tank.
	#L_ReProgramPD_RCSTank1-2 = A larger-scale RCS fuel tank, the FL-R750 is designed for Rockomax-sized stacks, and can hold a considerable amount of fuel. This makes it ideal for medium to large craft requiring precision docking and landing.
 }
}
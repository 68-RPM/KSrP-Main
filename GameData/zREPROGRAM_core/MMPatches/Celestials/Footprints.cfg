@Kopernicus:AFTER[zREPROGRAM_core]:NEEDS[KopernicusExpansion|!ParallaxContinued] {
	@Body[Moho|Gilly|Mun|Minmus] {
		@PQS
		{
			%allowFootprints = true
		}
	}
	@Body[Duna|Ike|Dres] {
		@PQS
		{
			%allowFootprints = true
		}
	}
	@Body[Vall|Tylo|Bop|Pol|Eeloo] {
		@PQS
		{
			%allowFootprints = true
		}
	}
}

@Kopernicus:AFTER[zREPROGRAM_core]:NEEDS[KopernicusExpansion|ParallaxContinued|!Parallax] {
	@Body[Moho|Gilly|Mun|Minmus] {
		@PQS
		{
			%allowFootprints = false
		}
	}
	@Body[Duna|Ike|Dres] {
		@PQS
		{
			%allowFootprints = false
		}
	}
	@Body[Vall|Tylo|Bop|Pol|Eeloo] {
		@PQS
		{
			%allowFootprints = false
		}
	}
}
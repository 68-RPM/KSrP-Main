// -- Reaction Wheels --
// KSRP
//	Wheel nerf, but not as much as, say, Skyhawk, SETI
//	Kerbal Witchery, or MandatoryRCS -- slightly more
//	magic angular momentum hax is retained than them
// (was 0.01)
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],!PROPELLANT[IntakeAtm]]:NEEDS[!MandatoryRCS]:FOR[zREPROGRAM_core] {
  @MODULE[ModuleReactionWheel] {
	@PitchTorque *= 0.01125
	@RollTorque *= 0.01125
	@YawTorque *= 0.01125
  }
}
// If we're a plane cockpit, nuke torque more! 
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@PROPELLANT[IntakeAtm],#CrewCapacity[>0]]:NEEDS[!MandatoryRCS]:FOR[zREPROGRAM_core] {
  @MODULE[ModuleReactionWheel] {
	@PitchTorque *= 0.0075
	@RollTorque *= 0.0075
	@YawTorque *= 0.0075
  }
}
// If we're a probe core, forgive torque loss...
@PART[*]:HAS[@MODULE[ModuleReactionWheel],!MODULE[ModuleEngines*],@MODULE[ModuleCommand],#CrewCapacity[<0]]:NEEDS[!MandatoryRCS]:FOR[zREPROGRAM_core] {
  @MODULE[ModuleReactionWheel] {
	@PitchTorque *= 3
	@RollTorque *= 3
	@YawTorque *= 3
  }
}

// ++ Solid Rockets ++
// KSRP
// Sepratrons now spool up, and
// launch escape towers as well
@PART[sepMotor1|Size1p5_Tank_05]:FOR[zREPROGRAM_core] {
  @MODULE[ModuleEngines] {
    @engineAccelerationSpeed = 0.025
  }
}
@PART[LaunchEscapeSystem|restock-engine-les-2]:FOR[zREPROGRAM_core] {
  @MODULE[ModuleEngines] {
    @engineAccelerationSpeed = 0.01875
  }
}

// -- Heat Shields --
// Source: Weaker Heat Shields, Improved Ablator
//	Ablator nerf, but not as much as Weaker Heat Shields (was 0.2)
//	Temperature limits from Weaker Heat Shields & Improved Ablator
@PART[*]:HAS[@RESOURCE[Ablator],!NAME[kv1Pod|kv2Pod|kv3Pod]]:FOR[zREPROGRAM_core] {
  %maxTemp = 2400
  %skinMaxTemp = 2800
  @RESOURCE[Ablator] {
	@Amount *= 0.375
	@maxAmount *= 0.375
  }
}
// KSRP
// The Making History capsules are manually rebalanced
// as the Heat Shield blanket patch gives them 2 little
// We increase maxTemp to a mean between the new HS
// temp and the original max temperature of the pod
@PART[kv1Pod]:FOR[zREPROGRAM_core] {
  %maxTemp = 1900
  %skinMaxTemp = 2800
  @RESOURCE[Ablator] {
	@Amount = 9
	@maxAmount = 9
  }
}
@PART[kv2Pod]:FOR[zREPROGRAM_core] {
  %maxTemp = 1900
  %skinMaxTemp = 2800
  @RESOURCE[Ablator] {
	@Amount = 10
	@maxAmount = 10
  }
}
@PART[kv3Pod]:FOR[zREPROGRAM_core] {
  %maxTemp = 1900
  %skinMaxTemp = 2800
  @RESOURCE[Ablator] {
	@Amount = 11
	@maxAmount = 11
  }
}


// -- Photovoltaic Panels --
// Source: No More OPs
// Electric charge gain rate is reduced at a rate
// slightly higher than that of "No More OPs" (was 0.08)
@PART[*]:HAS[@MODULE[ModuleDockingNode]]:FOR[zREPROGRAM_core] {
    @MODULE[ModuleDeployableSolarPanel]
	{
		@OUTPUT_RESOURCE[ElectricCharge]
		{
		    @rate *= 0.09375
		}
	}
}


// -- Docking Ports --
// Source: Kerbealistic Docking
// Capture force is nerfed as in
// RO and Kerbealistic Docking
@PART[*]:HAS[@MODULE[ModuleDockingNode]]:FOR[zREPROGRAM_core]
{
	@MODULE[ModuleDockingNode]
	{
		%acquireForce = 0.3
		%acquireMinFwdDot = 0.8
		%acquireminRollDot = -3.40282347E+38
		%acquireRange = 0.175
		%acquireTorque = 0.3
		%captureMaxRvel = 0.1
		%captureMinFwdDot = 0.998
		%captureMinRollDot = -3.40282347E+38
		%captureRange = 0.05
		%minDistanceToReEngage = 1.25
		%undockEjectionForce = 0.1
	}
}